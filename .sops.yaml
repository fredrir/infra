    key_groups:
      - age:
          - *admin
          - *llunde-01
  - path_regex: ansible/roles/gatus/files/config\.sops\.yaml$
    encrypted_regex: ^(username|password|token)$
    key_groups:
      - age:
          - *flux
          - *macie
          - *ci-apply
          - *archie
  - path_regex: ansible/roles/[^/]+/files/[^/]+\.sops\.yaml$
    key_groups:
      - age:
          - *macie
          - *ci-apply
          - *archie
