{{- with .Values.migration }}
{{- if or (ne .compatibility "backward-compatible") (not .retrySafe) }}
{{- fail "automatic migration requires backward compatibility and safe retries" }}
{{- end }}
{{- if hasKey $.Values.workloads "migration" }}
{{- fail "migration is a reserved workload name" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    infra.fredrir.com/migration-compatibility: backward-compatible
    infra.fredrir.com/migration-retry-safe: "true"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    {{- include "project.pod" (list $ "migration" .) | nindent 4 }}
{{- end }}
