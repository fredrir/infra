apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: llunde
  install:
    remediation:
      retries: 3
  values:
    fullnameOverride: valkey
    image:
      tag: 8.1.10-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    podLabels:
      app: valkey
    priorityClassName: production
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    initResources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    readinessProbe:
      enabled: true
    valkeyConfig: 'maxmemory 128mb

      maxmemory-policy noeviction

      save ""

      appendonly no

      '
    dataStorage:
      enabled: false
