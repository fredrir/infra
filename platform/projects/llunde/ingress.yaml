apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
data:
  Caddyfile: |
    {
      admin off
      servers {
        trusted_proxies static private_ranges
        client_ip_headers Cf-Connecting-Ip
      }
    }
    (upstream) {
      reverse_proxy {args[0]} {
        lb_try_duration 5s
        lb_try_interval 250ms
        header_up X-Forwarded-Proto https
        header_up X-Forwarded-For {client_ip}
      }
    }
    :8080 {
      handle /healthz {
        respond "origin alive" 200
      }
      @www host www.llunde.no
      handle @www {
        redir https://llunde.no{uri} permanent
      }
      @api host api.llunde.no
      handle @api {
        handle /__client-ip {
          respond "{client_ip}" 200
        }
        @private path /metrics* /health* /ready*
        respond @private 403
        import upstream api:8080
      }
      @web host llunde.no
      handle @web {
        import upstream web:8080
      }
      respond 404
    }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  selector:
    app: caddy
  ports:
  - name: http
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: caddy
        image: ghcr.io/fredrir/platform-caddy@sha256:b6c38126fe81ea62bba23a7d2aaff7301119eb530a2baae957d7517680889bd8
        command:
        - caddy
        args:
        - run
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        ports:
        - name: http
          containerPort: 8080
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: configuration
          mountPath: /etc/caddy
          readOnly: true
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
      volumes:
      - name: configuration
        configMap:
          name: caddy
      - name: data
        emptyDir:
          sizeLimit: 128Mi
      - name: config
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: docker.io/cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
        args:
        - tunnel
        - --no-autoupdate
        - --protocol
        - http2
        - --metrics
        - 0.0.0.0:2000
        - run
        envFrom:
        - secretRef:
            name: tunnel
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 2000
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 10
