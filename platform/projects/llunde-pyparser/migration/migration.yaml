apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: llunde-pyparser
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: llunde-pyparser
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: fredrir-09
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: ghcr
      containers:
      - name: migrate
        image: ghcr.io/fredrir/pyparser-review@sha256:483d94a9239189f02415541dd3828ae8e8de411d178231da3cd2596e0b1a8e4f
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - upgrade
        - head
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: application
        env:
        - name: PYPARSER_ENV
          value: production
        - name: HOME
          value: /tmp
        - name: USER
          value: pyparser
        - name: LOGNAME
          value: pyparser
        - name: XDG_CACHE_HOME
          value: /var/cache/pyparser
        - name: DOCTR_CACHE_DIR
          value: /var/cache/pyparser/doctr
        - name: HF_HOME
          value: /var/cache/pyparser/huggingface
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: model-cache
          mountPath: /var/cache/pyparser
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
