apiVersion: v1
kind: Service
metadata:
  name: review
  namespace: llunde-pyparser
spec:
  selector:
    app.kubernetes.io/name: review
    app.kubernetes.io/part-of: llunde-pyparser
    app.kubernetes.io/component: application
  ports:
  - name: http
    port: 8081
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  namespace: llunde-pyparser
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review
      app.kubernetes.io/part-of: llunde-pyparser
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review
        app.kubernetes.io/part-of: llunde-pyparser
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      nodeSelector:
        kubernetes.io/hostname: fredrir-09
        kubernetes.io/arch: amd64
      hostAliases:
      - ip: 10.43.0.30
        hostnames:
        - llm.hpc.ntnu.no
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: ghcr
      containers:
      - name: review
        image: ghcr.io/fredrir/pyparser-review@sha256:483d94a9239189f02415541dd3828ae8e8de411d178231da3cd2596e0b1a8e4f
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: application
        env:
        - name: PYPARSER_ENV
          value: production
        - name: PYPARSER_DOCLING_NUM_THREADS
          value: '1'
        - name: HOME
          value: /tmp
        - name: USER
          value: pyparser
        - name: LOGNAME
          value: pyparser
        - name: XDG_CACHE_HOME
          value: /var/cache/pyparser
        - name: DOCTR_CACHE_DIR
          value: /var/cache/pyparser/doctr
        - name: HF_HOME
          value: /var/cache/pyparser/huggingface
        - name: PYPARSER_STORAGE_ENDPOINT
          value: https://seaweedfs-nl.object-store.svc.cluster.local:8333
        - name: PYPARSER_STORAGE_CA_BUNDLE
          value: /etc/object-store/ca.crt
        - name: PYPARSER_STORAGE_REGION
          value: nl
        - name: PYPARSER_STORAGE_BUCKET
          value: parser-dataset
        - name: PYPARSER_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: application
              key: PYPARSER_STORAGE_ACCESS_KEY
        - name: PYPARSER_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: application
              key: PYPARSER_STORAGE_SECRET_KEY
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        command:
        - pyparser-review-serve
        - --host
        - 0.0.0.0
        - --port
        - '8081'
        volumeMounts:
        - name: files
          mountPath: /app/.local/files
        - name: model-cache
          mountPath: /var/cache/pyparser
        - name: object-store-ca
          mountPath: /etc/object-store
          readOnly: true
        ports:
        - name: http
          containerPort: 8081
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: files
        persistentVolumeClaim:
          claimName: files
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: object-store-ca
        configMap:
          name: object-store-ca
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
---
