apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rif
resources:
    - namespace.yaml
    - database.yaml
    - application.yaml
    - engine.yaml
    - imgproxy.yaml
    - ingress.yaml
    - network.yaml
    - database.secret.sops.yaml
    - mirror.secret.sops.yaml
    - engine.secret.sops.yaml
    - imgproxy.secret.sops.yaml
    - ghcr.secret.sops.yaml
    - backup.yaml
    - backup.secret.sops.yaml
    - backup-primary.secret.sops.yaml
components:
    - ../../components/backup-job
    - ../../components/backup-primary
    - ../../components/object-store-trust
    - ../../components/netpol-gate/egress
patches:
    - target:
        kind: CronJob
        name: repository-maintenance
      patch: |-
        - op: replace
          path: /spec/jobTemplate/spec/template/spec/nodeSelector/kubernetes.io~1hostname
          value: fredrir-04
images:
    - digest: sha256:da3a7f0902212726f7a5a210d9eb8d54b75378a3051b03d2451d78be288316e7
      name: ghcr.io/fredrir/rif-mirror
      newName: ghcr.io/fredrir/rif-mirror
    - digest: sha256:a7303d34c516192bca880f691082db9da4c663861f335494b8723a742f023a64
      name: ghcr.io/fredrir/rif-mirror-engine
      newName: ghcr.io/fredrir/rif-mirror-engine
