---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tunnel-egress
  namespace: 'y'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/part-of: 'y'
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: web
          app.kubernetes.io/part-of: 'y'
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - ipBlock:
        cidr: 198.41.192.0/24
    - ipBlock:
        cidr: 198.41.200.0/24
    ports:
    - protocol: TCP
      port: 7844
    - protocol: UDP
      port: 7844
