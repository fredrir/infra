apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: netpol-canary
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canary-probes
  namespace: netpol-canary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netpol-canary
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
