apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- network.yaml
patches:
- target:
    kind: HelmRelease
    name: buildkit
  patch: |
    - op: add
      path: /spec/values/template/spec/containers/0/env/-
      value:
        name: CI_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    - op: add
      path: /spec/values/template/spec/containers/0/env/-
      value:
        name: BUILDKIT_CACHE_BUCKET
        value: $(CI_NAMESPACE)-main
    - op: add
      path: /spec/values/template/spec/containers/0/env/-
      value:
        name: BUILDKIT_CACHE_ENDPOINT
        value: http://garage.build-cache.svc.cluster.local:3900
    - op: add
      path: /spec/values/template/spec/containers/0/env/-
      value:
        name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: buildkit-cache
            key: AWS_ACCESS_KEY_ID
    - op: add
      path: /spec/values/template/spec/containers/0/env/-
      value:
        name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: buildkit-cache
            key: AWS_SECRET_ACCESS_KEY
