apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deploy
spec:
  driftDetection:
    mode: enabled
  suspend: false
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions
        namespace: flux-system
