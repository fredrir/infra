apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-infra
resources:
- ../ci-namespace
- deploy.yaml
- check.yaml
- network.yaml
- attic.secret.sops.yaml
- github-app.secret.sops.yaml
- buildkit-cache.secret.sops.yaml
components:
- ../buildkit-cache
patches:
- path: quota.yaml
configurations:
- release-references.yaml
configMapGenerator:
- name: check-release
  files:
  - check.yaml
  options:
    annotations:
      config.kubernetes.io/local-config: 'true'
- name: deploy-release
  files:
  - deploy.yaml
  options:
    annotations:
      config.kubernetes.io/local-config: 'true'
