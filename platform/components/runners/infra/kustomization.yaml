apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-infra
resources:
- ../ci-namespace
- deploy.yaml
- network.yaml
- github-app.secret.sops.yaml
patches:
- path: quota.yaml
- path: deploy-values.yaml
configurations:
- values-references.yaml
configMapGenerator:
- name: deploy-values
  files:
  - deploy-values.yaml
  options:
    annotations:
      config.kubernetes.io/local-config: 'true'
