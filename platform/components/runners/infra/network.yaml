apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nix-cache
spec:
  podSelector:
    matchLabels:
      actions.github.com/scale-set-name: nix-amd64
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nix-cache
      podSelector:
        matchLabels:
          app: attic
    ports:
    - protocol: TCP
      port: 8080
