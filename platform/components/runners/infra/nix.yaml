apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nix
spec:
  driftDetection:
    mode: enabled
  suspend: false
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions
        namespace: flux-system
  values:
    githubConfigUrl: https://github.com/fredrir/infra
    githubConfigSecret: github-app
    runnerScaleSetName: nix-amd64
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-system
    listenerTemplate:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-restriction.kubernetes.io/critical
                  operator: In
                  values:
                  - 'true'
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: listener
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
    template:
      spec:
        serviceAccountName: ci-job
        automountServiceAccountToken: false
        runtimeClassName: kata
        nodeSelector:
          node-restriction.kubernetes.io/kata: 'true'
          kubernetes.io/arch: amd64
        priorityClassName: ci
        restartPolicy: Never
        activeDeadlineSeconds: 3600
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: Localhost
            localhostProfile: kata-nix.json
        containers:
        - name: runner
          image: ghcr.io/fredrir/infra-runner-nix@sha256:20441eef3d493f450bcc4f409fa4e0412cb8afcb07548e380a5bbb03a30ffb92
          imagePullPolicy: IfNotPresent
          command:
          - /bin/bash
          - -euc
          - 'test "$(uname -r)" = 6.18.51

            test ! -e /dev/kvm

            mount -t proc -o nosuid,nodev,noexec proc /proc

            exec /home/runner/run.sh

            '
          env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: '1'
          - name: ATTIC_SERVER
            value: http://attic.nix-cache.svc.cluster.local:8080
          - name: ATTIC_CACHE
            value: infra
          - name: ATTIC_TOKEN
            valueFrom:
              secretKeyRef:
                name: attic-client
                key: ATTIC_TOKEN
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
              - DAC_OVERRIDE
              - FSETID
              - FOWNER
              - MKNOD
              - NET_RAW
              - SETGID
              - SETUID
              - SETFCAP
              - SETPCAP
              - NET_BIND_SERVICE
              - SYS_CHROOT
              - KILL
              - AUDIT_WRITE
              - SYS_ADMIN
              - NET_ADMIN
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
              ephemeral-storage: 10Gi
              infra.fredrir.com/ci-slot: '1'
            limits:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 60Gi
              infra.fredrir.com/ci-slot: '1'
