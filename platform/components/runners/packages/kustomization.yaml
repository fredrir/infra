apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci-packages
resources:
- ../base
- github-app.secret.sops.yaml
- network.yaml
patches:
- target:
    kind: HelmRelease
    name: buildkit
  patch: |
    - op: replace
      path: /spec/values/githubConfigUrl
      value: https://github.com/fredrir/packages
    - op: replace
      path: /spec/values/runnerScaleSetName
      value: publish-amd64
