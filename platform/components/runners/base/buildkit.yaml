apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkit
spec:
  driftDetection:
    mode: enabled
  suspend: false
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions
        namespace: flux-system
  values:
    githubConfigUrl: https://github.com/fredrir/infra
    githubConfigSecret: github-app
    runnerScaleSetName: buildkit-amd64
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      name: arc-controller
      namespace: arc-system
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: listener
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
    template:
      spec:
        serviceAccountName: ci-job
        automountServiceAccountToken: false
        runtimeClassName: gvisor
        nodeSelector:
          node-restriction.kubernetes.io/gvisor: 'true'
          kubernetes.io/arch: amd64
        priorityClassName: ci
        restartPolicy: Never
        activeDeadlineSeconds: 3600
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: runner
          image: ghcr.io/fredrir/infra-runner-buildkit@sha256:4045faa13605053af98949c8e862966c7ba38d0cb2e81e213cf58ac351ac7f08
          imagePullPolicy: IfNotPresent
          command:
          - /home/runner/run.sh
          env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: '1'
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
              - DAC_OVERRIDE
              - FSETID
              - FOWNER
              - MKNOD
              - NET_RAW
              - SETGID
              - SETUID
              - SETFCAP
              - SETPCAP
              - NET_BIND_SERVICE
              - SYS_CHROOT
              - KILL
              - AUDIT_WRITE
              - SYS_ADMIN
              - NET_ADMIN
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
              ephemeral-storage: 10Gi
              infra.fredrir.com/ci-slot: '1'
            limits:
              cpu: '4'
              memory: 8Gi
              ephemeral-storage: 60Gi
              infra.fredrir.com/ci-slot: '1'
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-restriction.kubernetes.io/kata
                  operator: DoesNotExist
