apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
    - selector:
        dnsZones:
        - fredrir.com
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-dns
            key: CLOUDFLARE_API_TOKEN
