apiVersion: v1
kind: ConfigMap
metadata:
  name: attic
  namespace: nix-cache
data:
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["${CACHE_HOST}"]
    api-endpoint = "https://${CACHE_HOST}/"
    require-proof-of-possession = true
    [database]
    url = "sqlite:///data/metadata.db?mode=rwc"
    [storage]
    type = "local"
    path = "/data/nars"
    [chunking]
    nar-size-threshold = 65536
    min-size = 16384
    avg-size = 65536
    max-size = 262144
    [garbage-collection]
    interval = "24 hours"
    default-retention-period = "30 days"
---
apiVersion: v1
kind: Service
metadata:
  name: attic
  namespace: nix-cache
spec:
  selector:
    app: attic
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: attic
  namespace: nix-cache
spec:
  serviceName: attic
  replicas: 0
  selector:
    matchLabels:
      app: attic
  template:
    metadata:
      labels:
        app: attic
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-restriction.kubernetes.io/stateful: 'true'
      priorityClassName: batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: attic
        image: ${ATTIC_IMAGE}
        args:
        - -f
        - /etc/attic/server.toml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: attic-server
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/attic
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          tcpSocket:
            port: 8080
      volumes:
      - name: config
        configMap:
          name: attic
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: ${STORAGE_CLASS}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attic
  namespace: nix-cache
spec:
  ingressClassName: platform
  rules:
  - host: ${CACHE_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: attic
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: attic-ingress
  namespace: nix-cache
spec:
  podSelector:
    matchLabels:
      app: attic
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8080
      protocol: TCP
