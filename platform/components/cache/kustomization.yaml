apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cache
resources:
- attic.yaml
- server.secret.sops.yaml
- tunnel.secret.sops.yaml
- reader.secret.sops.yaml
- backup.yaml
- backup.secret.sops.yaml
- backup-network.yaml
components:
- ../backup-job
namespace: nix-cache
patches:
- target:
    kind: CronJob
    name: data-backup|repository-maintenance
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom
      value:
      - prefix: PRIMARY_
        secretRef:
          name: backup-repository
- target:
    kind: CronJob
    name: data-backup
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: data-backup
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: backup
                env:
                - name: PRIMARY_BACKUP_INITIALIZE
                  value: 'true'
                - name: BACKUP_REPOSITORIES
                  value: primary
                - name: PRIMARY_RESTIC_CACERT
                  value: /usr/local/share/object-store/ca.crt
- target:
    kind: CronJob
    name: repository-maintenance
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: repository-maintenance
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: maintenance
                env:
                - name: BACKUP_REPOSITORIES
                  value: primary
                - name: PRIMARY_RESTIC_CACERT
                  value: /usr/local/share/object-store/ca.crt
