apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailnet
  namespace: llm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailnet-state
  namespace: llm
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - tailnet-state
  verbs:
  - get
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailnet-state
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailnet-state
subjects:
- kind: ServiceAccount
  name: tailnet
  namespace: llm
---
apiVersion: v1
kind: Secret
metadata:
  name: tailnet-state
  namespace: llm
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailnet-serve
  namespace: llm
data:
  serve.json: '{"TCP":{"80":{"TCPForward":"litellm.llm.svc.cluster.local:4000"}}}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet
      app.kubernetes.io/part-of: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet
        app.kubernetes.io/part-of: llm
    spec:
      serviceAccountName: tailnet
      automountServiceAccountToken: true
      enableServiceLinks: false
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      nodeSelector:
        kubernetes.io/hostname: fredrir-04
        kubernetes.io/arch: amd64
      priorityClassName: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tailscale
        image: ghcr.io/tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
        imagePullPolicy: IfNotPresent
        env:
        - name: TS_KUBE_SECRET
          value: tailnet-state
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailnet-auth
              key: TS_AUTHKEY
        - name: TS_AUTH_ONCE
          value: 'true'
        - name: TS_HOSTNAME
          value: llm
        - name: TS_EXTRA_ARGS
          value: --advertise-tags=tag:llm-gateway
        - name: TS_USERSPACE
          value: 'true'
        - name: TS_ACCEPT_DNS
          value: 'false'
        - name: TS_SOCKET
          value: /tmp/tailscaled.sock
        - name: TS_SERVE_CONFIG
          value: /etc/tailscale/serve.json
        - name: TS_ENABLE_HEALTH_CHECK
          value: 'true'
        - name: TS_LOCAL_ADDR_PORT
          value: '[::]:9002'
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: health
          containerPort: 9002
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: serve
          mountPath: /etc/tailscale
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: serve
        configMap:
          name: tailnet-serve
