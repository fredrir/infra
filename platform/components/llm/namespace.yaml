apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    infra.fredrir.com/tier: platform
    infra.fredrir.com/managed: 'true'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: llm
spec:
  hard:
    requests.cpu: '6'
    requests.memory: 10Gi
    limits.memory: 18Gi
    pods: '10'
    requests.storage: 35Gi
