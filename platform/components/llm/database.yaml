apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: llm
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: llm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      nodeSelector:
        kubernetes.io/hostname: fredrir-04
        kubernetes.io/arch: amd64
      priorityClassName: production
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: docker.io/library/postgres@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: database
        env:
        - name: POSTGRES_USER
          value: litellm
        - name: POSTGRES_DB
          value: litellm
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: database
          mountPath: /var/lib/postgresql/data
        - name: shm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /var/run/postgresql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - litellm
            - -d
            - litellm
          periodSeconds: 5
          timeoutSeconds: 5
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - litellm
            - -d
            - litellm
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: run
        emptyDir:
          sizeLimit: 64Mi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: database
    spec:
      storageClassName: local-retain
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
