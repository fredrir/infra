apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paddleocr-cache
  namespace: llm
spec:
  storageClassName: local-ci
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paddleocr
  namespace: llm
  labels:
    app.kubernetes.io/name: paddleocr
    app.kubernetes.io/part-of: llm
spec:
  selector:
    app.kubernetes.io/name: paddleocr
    app.kubernetes.io/part-of: llm
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddleocr
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paddleocr
      app.kubernetes.io/part-of: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paddleocr
        app.kubernetes.io/part-of: llm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      nodeSelector:
        kubernetes.io/hostname: fredrir-04
        kubernetes.io/arch: amd64
      priorityClassName: production
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        args:
        - --model
        - /var/cache/llama/model.gguf
        - --mmproj
        - /var/cache/llama/mmproj.gguf
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --model-url
        - https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF.gguf
        - --mmproj-url
        - https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
        - --alias
        - PaddlePaddle/PaddleOCR-VL-1.6
        - --ctx-size
        - '8192'
        - --parallel
        - '1'
        - --threads
        - '4'
        - --threads-batch
        - '4'
        - --temp
        - '0'
        - --no-webui
        - --metrics
        - --api-key-file
        - /etc/llama/api-key
        env:
        - name: HOME
          value: /tmp
        - name: LLAMA_CACHE
          value: /var/cache/llama
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 4Gi
        volumeMounts:
        - name: model-cache
          mountPath: /var/cache/llama
        - name: tmp
          mountPath: /tmp
        - name: credentials
          mountPath: /etc/llama
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: paddleocr-cache
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: credentials
        secret:
          secretName: model-credentials
          items:
          - key: PADDLEOCR_API_KEY
            path: api-key
