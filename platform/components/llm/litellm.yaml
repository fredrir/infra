include:
- ntnu-models.yaml
- deepseek-models.yaml
- codex-models.yaml
model_list:
- model_name: ibm-granite/granite-docling-258M
  litellm_params:
    model: openai/ibm-granite/granite-docling-258M
    api_base: http://granite:8080/v1
    api_key: os.environ/GRANITE_API_KEY
    max_parallel_requests: 2
  model_info:
    mode: chat
    supports_vision: true
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_input_tokens: 8192
    max_output_tokens: 4096
- model_name: PaddlePaddle/PaddleOCR-VL-1.6
  litellm_params:
    model: openai/PaddlePaddle/PaddleOCR-VL-1.6
    api_base: http://paddleocr:8080/v1
    api_key: os.environ/PADDLEOCR_API_KEY
    max_parallel_requests: 2
  model_info:
    mode: chat
    supports_vision: true
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_input_tokens: 16384
    max_output_tokens: 4096
- model_name: vertex_ai/*
  litellm_params:
    model: vertex_ai/*
    vertex_project: llunde
    vertex_location: global
    vertex_credentials: os.environ/AGENT_PLATFORM_CREDENTIALS
- model_name: qwencloud/*
  litellm_params:
    model: qwencloud/*
    api_key: os.environ/QWENCLOUD_API_KEY
- model_name: mistral/*
  litellm_params:
    model: mistral/*
    api_key: os.environ/MISTRAL_API_KEY
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 5
  proxy_batch_write_at: 60
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_error_logs: true
  health_check_details: false
  trusted_proxy_ranges: []
  pass_through_endpoints:
  - path: /pp-structure
    target: http://pp-structure:8012
    include_subpath: true
    auth: true
    methods:
    - GET
    - POST
    timeout: 180
litellm_settings:
  request_timeout: 600
  num_retries: 0
  set_verbose: false
  json_logs: true
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  timeout: 600
