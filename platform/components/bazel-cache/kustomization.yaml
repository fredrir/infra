apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: bazel-cache
namespace: bazel-cache
resources:
- bazel-cache.yaml
configMapGenerator:
- name: bazel-cache-filter
  files:
  - nginx.conf
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
