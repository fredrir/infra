apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-heartbeat-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-backup
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 100.86.241.75/32
    ports:
    - protocol: TCP
      port: 8080
