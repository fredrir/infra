apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  clusterIP: ${LOKI_CLUSTER_IP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: observability
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /data
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          endpoint: ${S3_ENDPOINT}
          region: ${S3_REGION}
          bucketnames: ${LOKI_BUCKET}
          access_key_id: $${S3_ACCESS_KEY_ID}
          secret_access_key: $${S3_SECRET_ACCESS_KEY}
          s3forcepathstyle: true
          insecure: false
    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /data/index
        cache_location: /data/cache
    compactor:
      working_directory: /data/compactor
      retention_enabled: true
      delete_request_store: s3
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      max_query_series: 1000
      max_entries_limit_per_query: 5000
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-restriction.kubernetes.io/stateful: 'true'
      priorityClassName: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: loki
        image: docker.io/grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
        args:
        - -config.file=/etc/loki/config.yaml
        - -config.expand-env=true
        - -target=all
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        ports:
        - name: http
          containerPort: 3100
        envFrom:
        - secretRef:
            name: loki-storage
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/loki
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: loki
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: ${STORAGE_CLASS}
      resources:
        requests:
          storage: 10Gi
