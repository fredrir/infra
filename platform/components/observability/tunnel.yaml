apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-tunnel
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-tunnel
  template:
    metadata:
      labels:
        app: grafana-tunnel
    spec:
      automountServiceAccountToken: false
      priorityClassName: production
      nodeSelector:
        node-restriction.kubernetes.io/critical: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: docker.io/cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
        args: [tunnel, --protocol, http2, --no-autoupdate, --metrics, '0.0.0.0:2000', run]
        envFrom:
        - secretRef:
            name: grafana-tunnel
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 2000
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-tunnel
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: grafana-tunnel
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock:
        cidr: 198.41.192.0/24
    - ipBlock:
        cidr: 198.41.200.0/24
    ports:
    - port: 7844
      protocol: TCP
    - port: 7844
      protocol: UDP
