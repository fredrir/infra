apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: build-vm
  namespace: observability
  labels:
    release: monitoring
spec:
  jobName: build-vm
  kubernetesSDConfigs:
  - role: Node
    selectors:
    - role: Node
      field: metadata.name=fredrir-09
  relabelings:
  - sourceLabels:
    - __meta_kubernetes_node_address_InternalIP
    replacement: $1:9101
    targetLabel: __address__
  - replacement: infra-build-09
    targetLabel: instance
  - sourceLabels:
    - __meta_kubernetes_node_name
    targetLabel: node
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-vm-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 100.87.168.66/32
    ports:
    - port: 9101
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: build-vm
  namespace: observability
spec:
  groups:
  - name: build-vm
    rules:
    - alert: BuildVmMetricsMissing
      expr: up{job="build-vm"} == 0 or absent(up{job="build-vm"})
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Build VM node exporter is unreachable
    - alert: BuildVmCgroupCollectorFailing
      expr: |
        up{job="build-vm"} == 1 unless on(job, instance) infra_cgroup_collector_last_success_timestamp_seconds
        or time() - infra_cgroup_collector_last_success_timestamp_seconds{job="build-vm"} > 300
        or infra_cgroup_collector_read_errors{job="build-vm"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Build VM cgroup metric writer is failing; journalctl -u infra-cgroup-metrics in the guest names the cause
    - alert: BuildEngineCgroupMissing
      expr: |
        absent(infra_cgroup_memory_max_bytes{job="build-vm",cgroup="infra-engine.slice"})
        and on() time() - infra_cgroup_collector_last_success_timestamp_seconds{job="build-vm"} < 300
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Build VM reports no Dagger engine container in infra-engine.slice
    - alert: BuildVmCgroupOomKilled
      expr: increase(infra_cgroup_memory_events_total{job="build-vm",event="oom_kill"}[30m]) > 0
      labels:
        severity: warning
      annotations:
        summary: Build VM cgroup {{ $labels.cgroup }} had a process OOM-killed
    - alert: BuildVmCgroupMemoryNearLimit
      expr: |
        infra_cgroup_memory_working_set_bytes{job="build-vm"}
        / infra_cgroup_memory_max_bytes{job="build-vm"} > 0.9
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Build VM cgroup {{ $labels.cgroup }} working set is above 90% of its memory limit
