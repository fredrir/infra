apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: tempo
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    tempo:
      tag: 3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
      reportingEnabled: false
      retention: 168h
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      receivers:
        jaeger:
          protocols:
            grpc:
              endpoint: ''
            thrift_http:
              endpoint: ''
            thrift_compact:
              endpoint: ''
            thrift_binary:
              endpoint: ''
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      overrides:
        defaults:
          ingestion:
            rate_limit_bytes: 5000000
            burst_size_bytes: 10000000
          global:
            max_bytes_per_trace: 5000000
    persistence:
      enabled: true
      storageClassName: local-retain
      size: 20Gi
    nodeSelector:
      node-restriction.kubernetes.io/stateful: 'true'
      kubernetes.io/hostname: fredrir-09
    priorityClassName: production
    serviceAccount:
      automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  releaseName: tempo
  dependsOn:
  - name: monitoring
