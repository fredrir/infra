apiVersion: batch/v1
kind: CronJob
metadata:
  name: object-store-provisioner
  namespace: object-store
spec:
  schedule: '7 * * * *'
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: object-store-provisioner
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: fredrir-04
            kubernetes.io/arch: amd64
          priorityClassName: batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: provision
              image: ghcr.io/fredrir/platform-backup-tools@sha256:677c7d34afabc19b697b88ea6b39ff85707ddcba7fe18160f3b31b072e34da3d
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/infra
              args:
                - platform
                - provision-object-store
              env:
                - name: OBJECT_STORE_SPEC
                  value: /etc/object-store/buckets.yaml
                - name: OBJECT_STORE_CA_FILE
                  value: /etc/object-store/ca.crt
                - name: HEL1_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-hel1-identities
                      key: PROVISIONER_ACCESS_KEY_ID
                - name: HEL1_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-hel1-identities
                      key: PROVISIONER_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: spec
                  mountPath: /etc/object-store
                  readOnly: true
          volumes:
            - name: spec
              projected:
                sources:
                  - configMap:
                      name: object-store-buckets
                      items:
                        - key: buckets.yaml
                          path: buckets.yaml
                  - configMap:
                      name: seaweedfs-pki
                      items:
                        - key: ca.crt
                          path: ca.crt
