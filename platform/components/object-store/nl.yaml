apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-nl
  namespace: object-store
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: nl
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: nl
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: metrics
      port: 9327
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-nl
  namespace: object-store
spec:
  serviceName: seaweedfs-nl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: nl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: nl
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: fredrir-09
        node-restriction.kubernetes.io/stateful: 'true'
      priorityClassName: production
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          command:
            - /bin/sh
            - /etc/seaweedfs/entrypoint/weed.sh
          args:
            - -logtostderr=true
            - server
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -dataCenter=nl
            - -rack=fredrir-09
            - -dir=/data
            - -master.dir=/data
            - -master.volumeSizeLimitMB=1024
            - -master.defaultReplication=000
            - -master.telemetry=false
            - -volume.max=200
            - -volume.minFreeSpace=15
            - -volume.index=memory
            - -filer
            - -s3
            - -s3.ip.bind=127.0.0.1
            - -s3.port=8334
            - -s3.config=/etc/seaweedfs/identities/identities.json
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -metricsIp=0.0.0.0
            - -metricsPort=9327
          envFrom:
            - configMapRef:
                name: seaweedfs-server
            - configMapRef:
                name: seaweedfs-internal-tls
            - secretRef:
                name: seaweedfs-nl-identities
          env:
            - name: GOMEMLIMIT
              value: 320MiB
            - name: WEED_GRPC_COMPONENTS
              value: MASTER VOLUME FILER S3 CLIENT
            - name: WEED_GRPC_SERVED
              value: MASTER VOLUME FILER S3
            - name: WEED_GRPC_MASTER_ALLOWED_COMMONNAMES
              value: seaweedfs-nl-internal
            - name: WEED_GRPC_VOLUME_ALLOWED_COMMONNAMES
              value: seaweedfs-nl-internal
            - name: WEED_GRPC_FILER_ALLOWED_COMMONNAMES
              value: seaweedfs-nl-internal
            - name: WEED_GRPC_S3_ALLOWED_COMMONNAMES
              value: seaweedfs-nl-internal
            - name: WEED_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl
                  key: WEED_JWT_SIGNING_KEY
            - name: WEED_JWT_SIGNING_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl
                  key: WEED_JWT_SIGNING_READ_KEY
            - name: WEED_JWT_FILER_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl
                  key: WEED_JWT_FILER_SIGNING_KEY
            - name: WEED_S3_SSE_KEK
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl
                  key: WEED_S3_SSE_KEK
            - name: WEED_S3_SSE_KEK_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl
                  key: WEED_S3_SSE_KEK_PASSPHRASE
          ports:
            - name: metrics
              containerPort: 9327
          resources:
            requests:
              cpu: 50m
              memory: 224Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: entrypoint
              mountPath: /etc/seaweedfs/entrypoint
              readOnly: true
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/seaweedfs/tls
              readOnly: true
            - name: identities
              mountPath: /etc/seaweedfs/identities
              readOnly: true
            - name: tmp
              mountPath: /tmp
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - for attempt in $(seq 120); do nc -z 127.0.0.1 18888 && exit 0; sleep 1; done; exit 1
          startupProbe:
            exec:
              command:
                - nc
                - -z
                - 127.0.0.1
                - '8334'
            periodSeconds: 5
            failureThreshold: 60
        - name: s3-filter
          image: ghcr.io/fredrir/platform-caddy@sha256:b03ceb80193dea33aa4812a190a08465dbe56f6a6aec364a47c15df1f56c8106
          command:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: GOMEMLIMIT
              value: 96MiB
            - name: HOME
              value: /caddy
            - name: XDG_CONFIG_HOME
              value: /caddy
            - name: XDG_DATA_HOME
              value: /caddy
            - name: PROVISIONER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-nl-identities
                  key: PROVISIONER_ACCESS_KEY_ID
          ports:
            - name: s3
              containerPort: 8333
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: '1'
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: s3-filter
              mountPath: /etc/caddy
              readOnly: true
            - name: tls
              mountPath: /etc/seaweedfs/tls
              readOnly: true
            - name: caddy
              mountPath: /caddy
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
              scheme: HTTPS
            periodSeconds: 10
        - name: meta-backup
          image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          command:
            - /bin/sh
            - /etc/seaweedfs/entrypoint/weed.sh
          args:
            - -logtostderr=true
            - filer.meta.backup
            - -filer=127.0.0.1:8888
            - -config=/etc/seaweedfs/meta-backup/backup_filer.toml
          envFrom:
            - configMapRef:
                name: seaweedfs-internal-tls
          env:
            - name: GOMEMLIMIT
              value: 96MiB
            - name: WEED_GRPC_COMPONENTS
              value: CLIENT
            - name: WEED_GRPC_SERVED
              value: ''
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: entrypoint
              mountPath: /etc/seaweedfs/entrypoint
              readOnly: true
            - name: tls
              mountPath: /etc/seaweedfs/tls
              readOnly: true
            - name: meta-backup-config
              mountPath: /etc/seaweedfs/meta-backup
              readOnly: true
            - name: meta
              mountPath: /meta
      volumes:
        - name: entrypoint
          configMap:
            name: seaweedfs-entrypoint
        - name: s3-filter
          configMap:
            name: seaweedfs-s3-filter
            items:
              - key: s3-filter.caddyfile
                path: Caddyfile
        - name: caddy
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tls
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: object-store-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
              - configMap:
                  name: seaweedfs-pki
                  items:
                    - key: nl-s3.crt
                      path: s3.crt
                    - key: nl-internal.crt
                      path: internal.crt
              - secret:
                  name: seaweedfs-nl
                  items:
                    - key: s3.key
                      path: s3.key
                    - key: internal.key
                      path: internal.key
        - name: identities
          configMap:
            name: seaweedfs-nl-identities
        - name: meta-backup-config
          configMap:
            name: seaweedfs-meta-backup
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 250Gi
    - metadata:
        name: meta
      spec:
        storageClassName: local-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
