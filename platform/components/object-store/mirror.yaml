apiVersion: batch/v1
kind: CronJob
metadata:
  name: parser-dataset-mirror
  namespace: object-store
spec:
  schedule: '23 * * * *'
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: parser-dataset-mirror
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: fredrir-04
            kubernetes.io/arch: amd64
          priorityClassName: batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              imagePullPolicy: IfNotPresent
              args:
                - sync
                - store:parser-dataset
                - aws:llunde-pyparser-bucket
                - --include=/files/**
                - --include=/extract/**
                - --include=/assets/**
                - --include=/convert/**
                - --checksum
                - --fast-list
                - --max-delete=1000
                - --log-level=NOTICE
              env:
                - name: HOME
                  value: /tmp
                - name: GOMEMLIMIT
                  value: 192MiB
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs:/etc/object-store
                - name: RCLONE_CONFIG_STORE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_STORE_PROVIDER
                  value: SeaweedFS
                - name: RCLONE_CONFIG_STORE_ENDPOINT
                  value: https://seaweedfs-nl.object-store.svc.cluster.local:8333
                - name: RCLONE_CONFIG_STORE_REGION
                  value: nl
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-nl-identities
                      key: PARSER_MIRROR_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-nl-identities
                      key: PARSER_MIRROR_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_AWS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_AWS_PROVIDER
                  value: AWS
                - name: RCLONE_CONFIG_AWS_REGION
                  value: eu-north-1
                - name: RCLONE_CONFIG_AWS_NO_CHECK_BUCKET
                  value: 'true'
                - name: RCLONE_CONFIG_AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: parser-dataset-aws
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: parser-dataset-aws
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: '1'
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: authority
                  mountPath: /etc/object-store
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: authority
              configMap:
                name: object-store-ca
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
