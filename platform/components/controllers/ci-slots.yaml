apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-slots
  namespace: arc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-slots
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ''
    resources:
      - nodes/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-slots
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-slots
subjects:
  - kind: ServiceAccount
    name: ci-slots
    namespace: arc-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-slots
  namespace: arc-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ci-slots
  template:
    metadata:
      labels:
        app: ci-slots
    spec:
      serviceAccountName: ci-slots
      priorityClassName: batch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-restriction.kubernetes.io/critical
                    operator: In
                    values:
                      - 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciler
          image: ghcr.io/fredrir/platform-backup-tools@sha256:215414b6a1bba8200014d8d139100d0c20ada5e7e3654167d8eb270b8fe469d7
          command:
            - /usr/local/bin/infra
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args:
            - platform
            - ci-slots
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
