apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: controllers
resources:
- releases.yaml
- ci-slots.yaml
configMapGenerator:
- name: ci-slots
  namespace: arc-system
  files:
  - ci-slots.sh
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
