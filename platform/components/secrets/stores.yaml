apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-recovery
  namespace: platform-backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: runtime
  target:
    name: restic-recovery
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: repository
    remoteRef:
      key: RESTIC_REPOSITORY
  - secretKey: password
    remoteRef:
      key: RESTIC_PASSWORD
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: BACKUP_S3_ACCESS_KEY_ID
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: BACKUP_S3_SECRET_ACCESS_KEY
