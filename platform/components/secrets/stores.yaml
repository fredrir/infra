apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: runtime
  namespace: ingress-system
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: dopplerToken
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: ingress-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: runtime
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: credentials.json
    remoteRef:
      key: CLOUDFLARED_CREDENTIALS_JSON
---
