apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress-system
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: 41.5.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 2
    service:
      type: ClusterIP
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: platform
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: platform
      kubernetesCRD:
        allowCrossNamespace: false
      kubernetesGateway:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        expose:
          default: false
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        cpu: '1'
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    priorityClassName: production
    nodeSelector:
      node-restriction.kubernetes.io/critical: 'true'
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
        queryParameters:
          defaultMode: drop
    metrics:
      prometheus:
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: monitoring
        service:
          enabled: true
  releaseName: traefik
