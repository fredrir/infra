apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
scheduling:
  nodeSelector:
    node-restriction.kubernetes.io/gvisor: 'true'
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 200m
    memory: 256Mi
scheduling:
  nodeSelector:
    node-restriction.kubernetes.io/kata: 'true'
