  - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
    message: Host paths are forbidden
  - expression: >-
      object.spec.containers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation)
