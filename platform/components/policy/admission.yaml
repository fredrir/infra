---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: project-network-boundary
spec:
  policyName: project-network-boundary
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: project-baseline-owner
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - networkpolicies
    namespaceSelector:
      matchExpressions:
      - key: infra.fredrir.com/tier
        operator: In
        values:
        - project
  validations:
  - expression: 'request.userInfo.username in ["system:serviceaccount:flux-system:platform-reconciler", "system:serviceaccount:flux-system:kustomize-controller"]
      || (request.operation == "DELETE" ? !(oldObject.metadata.name in ["default-deny","dns"]) : !(object.metadata.name
      in ["default-deny","dns"]))'
    message: Namespace baseline policies belong to the platform
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: project-baseline-owner
spec:
  policyName: project-baseline-owner
  validationActions:
  - Deny
