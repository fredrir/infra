      || (has(p.namespaceSelector) && has(p.namespaceSelector.matchLabels) && "kubernetes.io/metadata.name"
      in p.namespaceSelector.matchLabels && !has(p.namespaceSelector.matchExpressions)
      && p.namespaceSelector.matchLabels["kubernetes.io/metadata.name"] in ["ingress-system","observability"])))'
    message: Project ingress must select project pods, ingress or monitoring
