apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    namespaceSelector:
      matchExpressions:
      - key: infra.fredrir.com/tier
        operator: In
        values:
        - project
        - ci
  validations:
  - expression: '!has(object.spec.hostNetwork) || !object.spec.hostNetwork'
    message: Host networking is forbidden
  - expression: '!has(object.spec.hostPID) || !object.spec.hostPID'
    message: Host PID namespace is forbidden
  - expression: '!has(object.spec.hostIPC) || !object.spec.hostIPC'
    message: Host IPC namespace is forbidden
  - expression: '!has(object.spec.nodeName) || (request.operation == "UPDATE" && has(oldObject.spec.nodeName) &&
      object.spec.nodeName == oldObject.spec.nodeName)'
    message: Direct node assignment is forbidden
  - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
    message: Host paths are forbidden
  - expression: >-
      object.spec.containers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation)
      && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation))
      && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation))
    message: Privilege escalation is forbidden
  - expression: '!has(object.spec.tolerations) || object.spec.tolerations.all(t, has(t.key) && t.key != "node-role.kubernetes.io/control-plane")'
    message: Control-plane tolerations are forbidden
  - expression: >-
      object.spec.containers.all(c, has(c.resources) && has(dyn(c.resources).requests) && has(dyn(c.resources).limits) && "cpu" in dyn(c.resources).requests && "memory" in dyn(c.resources).requests && "cpu" in dyn(c.resources).limits && "memory" in dyn(c.resources).limits)
      && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.resources) && has(dyn(c.resources).requests) && has(dyn(c.resources).limits) && "cpu" in dyn(c.resources).requests && "memory" in dyn(c.resources).requests && "cpu" in dyn(c.resources).limits && "memory" in dyn(c.resources).limits))
    message: CPU and memory requests and limits are required
---
