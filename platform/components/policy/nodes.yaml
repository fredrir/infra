apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-registration
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - nodes
  matchConditions:
  - name: kubelet
    expression: "'system:nodes' in request.userInfo.groups"
  variables:
  - name: declared
    expression: "['fredrir-04', 'fredrir-05', 'fredrir-07', 'fredrir-08', 'fredrir-09', 'fredrir-10']"
  - name: volatile
    expression: "['fredrir-10']"
  validations:
  - expression: object.metadata.name in variables.declared
    message: Only inventory nodes may register
  - expression: >-
      !(object.metadata.name in variables.volatile) || (has(object.spec.taints) && object.spec.taints.exists(t,
      t.key == 'node-restriction.kubernetes.io/volatile' && has(t.value) && t.value == 'true' && t.effect == 'NoSchedule'))
    message: Volatile nodes must carry their volatile taint
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-registration
spec:
  policyName: node-registration
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-flannel-writer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - nodes
      - nodes/status
  matchConditions:
  - name: shared-flannel-identity
    expression: "request.userInfo.username == 'system:k3s-controller'"
  variables:
  - name: labels
    expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  - name: oldLabels
    expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
  - name: annotations
    expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  - name: oldAnnotations
    expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  - name: addresses
    expression: "has(object.status.addresses) ? object.status.addresses.map(a, a.address) : []"
  - name: writeOnce
    expression: "['flannel.alpha.coreos.com/backend-type', 'flannel.alpha.coreos.com/backend-data', 'flannel.alpha.coreos.com/backend-v6-data']"
  - name: ownAddress
    expression: "['flannel.alpha.coreos.com/public-ip', 'flannel.alpha.coreos.com/public-ip-overwrite', 'flannel.alpha.coreos.com/public-ipv6', 'flannel.alpha.coreos.com/public-ipv6-overwrite']"
  - name: conditions
    expression: "has(object.status.conditions) ? object.status.conditions.filter(c, c.type != 'NetworkUnavailable') : []"
  - name: oldConditions
    expression: "has(oldObject.status.conditions) ? oldObject.status.conditions.filter(c, c.type != 'NetworkUnavailable') : []"
  validations:
  - expression: variables.labels == variables.oldLabels
    message: The shared flannel identity may not change node labels
  - expression: >-
      (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])
    message: The shared flannel identity may not change node owners or finalizers
  - expression: object.spec == oldObject.spec
    message: The shared flannel identity may not change the node spec
  - expression: >-
      variables.annotations.all(k, k.startsWith('flannel.alpha.coreos.com/') || (k in variables.oldAnnotations && variables.annotations[k] == variables.oldAnnotations[k]))
      && variables.oldAnnotations.all(k, k in variables.annotations || k.startsWith('flannel.alpha.coreos.com/'))
    message: The shared flannel identity may change only flannel annotations
  - expression: >-
      variables.writeOnce.all(k, !(k in variables.oldAnnotations) || (k in variables.annotations && variables.annotations[k] == variables.oldAnnotations[k]))
    message: Flannel backend annotations are write-once for the shared identity; an administrator clears them to change the backend or key
  - expression: >-
      variables.ownAddress.all(k, !(k in variables.annotations) || (k in variables.oldAnnotations && variables.annotations[k] == variables.oldAnnotations[k])
      || variables.annotations[k] in variables.addresses)
    message: Flannel public addresses must be one of the node's own addresses
  - expression: >-
      (has(object.status.addresses) ? object.status.addresses : []) == (has(oldObject.status.addresses) ? oldObject.status.addresses : [])
      && (has(dyn(object.status).capacity) ? dyn(object.status).capacity : {}) == (has(dyn(oldObject.status).capacity) ? dyn(oldObject.status).capacity : {})
      && (has(dyn(object.status).allocatable) ? dyn(object.status).allocatable : {}) == (has(dyn(oldObject.status).allocatable) ? dyn(oldObject.status).allocatable : {})
      && variables.conditions == variables.oldConditions
    message: The shared flannel identity may change only the NetworkUnavailable condition of the node status
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-flannel-writer
spec:
  policyName: node-flannel-writer
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-no-static-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  matchConditions:
  - name: kubelet
    expression: "'system:nodes' in request.userInfo.groups"
  validations:
  - expression: 'false'
    message: Nodes may not create mirror or static pods
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-no-static-pods
spec:
  policyName: node-no-static-pods
  validationActions:
  - Deny
