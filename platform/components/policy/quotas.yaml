apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: ingress-system
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 2Gi
    pods: '12'
    requests.storage: 200Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ingress-system
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: '1'
      memory: 512Mi
---
