apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: build-cache
resources:
  - garage.yaml
  - garage.secret.sops.yaml
  - provisioner.yaml
  - provisioner.secret.sops.yaml
  - alerts.yaml
  - projects
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
namespace: build-cache
