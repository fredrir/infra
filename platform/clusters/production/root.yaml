apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/components/sources
  prune: true
  wait: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: platform-settings
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
