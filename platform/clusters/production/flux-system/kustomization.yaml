apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
- target:
    kind: Deployment
  patch: |
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-restriction.kubernetes.io/critical
                operator: In
                values:
                - 'true'
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --requeue-dependency=5s
- target:
    kind: Deployment
    name: helm-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 60m, memory: 160Mi}
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 70m, memory: 224Mi}
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 25m, memory: 128Mi}
- target:
    kind: Deployment
    name: source-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 25m, memory: 192Mi}
