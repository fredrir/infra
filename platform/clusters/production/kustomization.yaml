apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: production
resources:
- flux-system
- settings.yaml
- artifacts
- source-watcher
patches:
- target:
    kind: Deployment
    name: kustomize-controller
    namespace: flux-system
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=ExternalArtifact=true,AdditiveCELDependencyCheck=true
