modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4


  http_2xx_cfray:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_header_not_matches:
        - header: CF-Ray
          regexp: ".+"

  http_403:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [403]
      preferred_ip_protocol: ip4
