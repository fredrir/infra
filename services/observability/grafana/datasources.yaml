# Datasources as code (O2: provisioned from the repo, not clicked). Fixed
# uids — the dashboard JSON and the provisioned alert rules reference them.
# URLs use container names on the shared observability network (aardvark DNS).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://observability-prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s # matches prometheus.yml scrape_interval

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://observability-loki:3100
