# Grafana-managed alerting as code: contact point, root policy and the rules in
# one provisioning file. Delivery is EMAIL via SES; SMTP creds arrive via sops
# as GF_SMTP_* env, never this file — the public ntfy topic it replaced was a
# capability URL committed to git, i.e. burned. Rule shape: query A against the
# prometheus datasource (fixed uid), then threshold expression B — non-zero B
# fires; `for` debounces (5 m on the reachability rules).
apiVersion: 1

# File-provisioned resources survive removal from this file, so the old ntfy
# contact point needs an explicit deletion to leave Grafana's DB.
deleteContactPoints:
  - orgId: 1
    uid: ntfy-webhook

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: ses-email
        type: email
        settings:
          addresses: fhansteen@gmail.com

policies:
  - orgId: 1
    receiver: email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: llunde
    folder: llunde
    interval: 1m
    rules:
      - uid: instance-down
        title: InstanceDown
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "node_exporter unreachable on {{ $labels.host }} for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="node"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: ready-probe-failed
        title: ReadyProbeFailed
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "backend /ready failing (blackbox via the Caddy :9101 listener) for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox-ready"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: public-edge-down
        title: PublicEdgeDown
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "public probe {{ $labels.instance }} failing through the CF edge for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job=~"blackbox-public.*"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: disk-high
        title: DiskHigh
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} above 80% used"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      # The only watch on Caddy's OWN certificates: production never sees them
      # (cloudflared dials plain HTTP, and the `probe_ssl_earliest_cert_expiry`
      # the blackbox-public jobs report is Cloudflare's edge cert), so a DNS-01
      # renewal failure stays silent until break-glass needs a warm certificate.
      # modules/ingress stamps the metric hourly. 21 days: Let's Encrypt issues
      # for 90 and Caddy renews at ~30 left, so crossing 21 means renewal has
      # failed for over a week — late enough that healthy renewal never trips it,
      # early enough to fix by hand (runbook §13.5). noDataState Alerting, unlike
      # every other rule here: SILENCE IS THE FAILURE. `for: 6h` absorbs reboots
      # and the gap before the first hourly stamp; the metric is an absolute
      # deadline, so a stale stamp still counts down correctly.
      - uid: cert-expiry
        title: OriginCertExpiring
        condition: B
        for: 6h
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "origin certificate for {{ $labels.name }} expires in under 21 days — DNS-01 renewal is not working (runbook §13.5)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (caddy_cert_expiry_timestamp - time()) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [21] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      # Freshness in days from the stamps modules/backups writes on every
      # SUCCESSFUL restic run. noDataState OK, softer than the rest: the stamp
      # appears only after the first weekly run, and a dead exporter is already
      # InstanceDown's job.
      - uid: restic-stale
        title: ResticStale
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "restic job {{ $labels.job }} last succeeded over 8 days ago"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (time() - restic_last_success_timestamp) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: gt, params: [8] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
