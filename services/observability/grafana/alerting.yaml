# Grafana-managed alerting as code (O5): contact point, root notification
# policy and the five contract rules in one provisioning file. Delivery is
# EMAIL via SES (the plan's default, restored at the owner's call — the
# interim public ntfy topic was a capability URL committed to git, i.e.
# burned; SMTP creds arrive via sops as GF_SMTP_* env, never this file).
#
# Rule shape: query A against the prometheus datasource (fixed uid), then a
# threshold expression B — non-zero B fires. `for` debounces per contract
# (5 m on the reachability rules).
apiVersion: 1

# The interim ntfy contact point survives in Grafana's DB even after leaving
# this file (file-provisioned resources need explicit deletion): remove it.
deleteContactPoints:
  - orgId: 1
    uid: ntfy-webhook

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: ses-email
        type: email
        settings:
          addresses: fhansteen@gmail.com

policies:
  - orgId: 1
    receiver: email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: llunde
    folder: llunde
    interval: 1m
    rules:
      - uid: instance-down
        title: InstanceDown
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "node_exporter unreachable on {{ $labels.host }} for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="node"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: ready-probe-failed
        title: ReadyProbeFailed
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "backend /ready failing (blackbox via the Caddy :9101 listener) for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="blackbox-ready"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: public-edge-down
        title: PublicEdgeDown
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "public probe {{ $labels.instance }} failing through the CF edge for 5m"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job=~"blackbox-public.*"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: disk-high
        title: DiskHigh
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} above 80% used"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      # Origin-certificate expiry (phase-4 closeout). The only watch on Caddy's
      # OWN certificates: production traffic never sees them (cloudflared dials
      # plain HTTP, and the `probe_ssl_earliest_cert_expiry` the blackbox-public
      # jobs report is Cloudflare's edge certificate), so a DNS-01 renewal
      # failure would otherwise stay silent until break-glass needed a warm
      # certificate. Stamp written hourly by modules/ingress.
      #
      # 21 days: Let's Encrypt issues for 90 and Caddy starts renewing at ~30
      # days remaining, so crossing 21 means renewal has been failing for over a
      # week — late enough that a healthy renewal never trips it, early enough
      # to fix by hand (runbook §13.5) with three weeks of runway left.
      #
      # noDataState Alerting, unlike every other rule in this file: for this one
      # SILENCE IS THE FAILURE. `for: 6h` absorbs reboots and the gap between a
      # fresh switch and the first hourly stamp. The metric is an absolute
      # deadline, so even a stale stamp keeps counting down correctly.
      - uid: cert-expiry
        title: OriginCertExpiring
        condition: B
        for: 6h
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "origin certificate for {{ $labels.name }} expires in under 21 days — DNS-01 renewal is not working (runbook §13.5)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (caddy_cert_expiry_timestamp - time()) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: lt, params: [21] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      # Freshness in days from the textfile stamps modules/backups writes on
      # every SUCCESSFUL restic run. noDataState OK, deliberately softer than
      # the rest: the stamp only exists after the first post-deploy weekly
      # run, and a dead exporter is already InstanceDown's job.
      - uid: restic-stale
        title: ResticStale
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "restic job {{ $labels.job }} last succeeded over 8 days ago"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (time() - restic_last_success_timestamp) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator: { type: gt, params: [8] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
