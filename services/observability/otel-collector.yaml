# OTel collector (ADR 018: exists from day one; wiring the backend's Java agent
# to 4317/4318 is a backend-repo follow-up), mounted over the contrib image's
# default --config path (/etc/otelcol-contrib/config.yaml). Minimal by design:
# receive OTLP, batch, log basic counts — a real trace backend (Tempo, or
# traces-to-Loki) waits until traces flow. memory_limiter sits under the unit's
# MemoryMax=256M, so the collector refuses data instead of being OOM-killed.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
