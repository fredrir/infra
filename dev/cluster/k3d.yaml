apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: infra-dev
servers: 1
agents: 2
image: docker.io/rancher/k3s:v1.36.3-k3s1@sha256:d0f79175794edd9694b4a12bafc5c52ae1977369a2f7cf256264e7bd2dae0be9
registries:
  create:
    name: infra-dev-registry
    host: 127.0.0.1
    hostPort: "5111"
options:
  k3d:
    wait: true
    timeout: 3m
  k3s:
    extraArgs:
    - arg: --disable=traefik
      nodeFilters:
      - server:*
    - arg: --disable=servicelb
      nodeFilters:
      - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
