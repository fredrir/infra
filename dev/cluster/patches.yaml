- target:
    kind: Deployment
  patch: |
    - op: add
      path: /spec/replicas
      value: 0
- target:
    kind: StatefulSet
  patch: |
    - op: add
      path: /spec/replicas
      value: 0
- target:
    kind: CronJob
  patch: |
    - op: add
      path: /spec/suspend
      value: true
- target:
    kind: Job
  patch: |
    - op: add
      path: /spec/suspend
      value: true
