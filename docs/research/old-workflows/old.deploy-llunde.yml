name: Deploy llunde

on:
  push:
    branches: [main]
    # llunde.no app only — pyparser has its own workflow (deploy-pyparser.yml).
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/deploy-llunde.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fredrir/llunde-backend

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - uses: dopplerhq/cli-action@v3

      - name: Build (VITE_TURNSTILE_SITE_KEY from Doppler llunde / ci)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_LLUNDE_CI }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          # The public Turnstile site key is baked into the static bundle at build
          # time. It lives in Doppler (config `ci`) now, not a GitHub secret.
          export VITE_TURNSTILE_SITE_KEY="$(doppler secrets get VITE_TURNSTILE_SITE_KEY --plain)"
          test -n "$VITE_TURNSTILE_SITE_KEY"
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push prod image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrate
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}-migrate:${{ github.sha }}
            ${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - uses: dopplerhq/cli-action@v3

      - name: Setup SSH (deploy creds from Doppler llunde / ci)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_LLUNDE_CI }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          doppler secrets get LINODE_SSH_KEY --plain > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          host="$(doppler secrets get LINODE_HOST --plain)"
          echo "LINODE_HOST=$host" >> "$GITHUB_ENV"
          echo "LINODE_USER=$(doppler secrets get LINODE_USER --plain)" >> "$GITHUB_ENV"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts

      - name: Rsync frontend dist
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend-dist/ \
            "${{ env.LINODE_USER }}@${{ env.LINODE_HOST }}:/opt/llunde/frontend-dist/"

      - name: Rsync deploy assets (compose, nginx, scripts)
        run: |
          # Deploy assets live in backend/infra/. .env is rendered on the host from
          # Doppler (config `prd`) by the deploy step below — never rsync it, so the
          # exclude stays. CI never handles the app's runtime secrets.
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.env*' \
            backend/infra/ \
            "${{ env.LINODE_USER }}@${{ env.LINODE_HOST }}:/opt/llunde/"

      - name: Pull and restart
        run: |
          # The host renders /opt/llunde/.env from Doppler using its OWN read-only
          # prd service token (configured on the host, scoped to /opt/llunde); the
          # CI runner never sees the app runtime secrets. Atomic write so a failed
          # fetch leaves the last-good .env in place. Compose then auto-loads .env.
          ssh -i ~/.ssh/id_ed25519 \
            "${{ env.LINODE_USER }}@${{ env.LINODE_HOST }}" \
            "cd /opt/llunde && \
             ( umask 077; doppler secrets download --no-file --format docker > .env.new ) && mv .env.new .env && \
             IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull backend migrate && \
             IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 120 && \
             docker image prune -f"
