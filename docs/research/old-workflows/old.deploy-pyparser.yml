name: Deploy pyparser

on:
  push:
    branches: [main]
    # pyparser only — llunde.no has its own workflow (deploy-llunde.yml).
    paths:
      - "pyparser/**"
      - ".github/workflows/deploy-pyparser.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing ghcr.io/fredrir/pyparser-review tag to deploy.
          Empty = build from this ref.
        required: false
        default: ""

concurrency:
  group: deploy-pyparser
  cancel-in-progress: false

jobs:
  build-pyparser-review:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push review-serve image
        uses: docker/build-push-action@v6
        with:
          context: pyparser
          target: review-serve
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/fredrir/pyparser-review:${{ github.sha }}
            ghcr.io/fredrir/pyparser-review:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-hetzner:
    needs: [build-pyparser-review]
    if: always() && !cancelled() && (needs.build-pyparser-review.result == 'success' || needs.build-pyparser-review.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dopplerhq/cli-action@v3

      - name: Fetch deploy secrets from Doppler (pyparser / ci)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PYPARSER_CI }}
        run: |
          set -euo pipefail
          # SSH key + host now live in Doppler (config `ci`), not GitHub secrets.
          # Write the key straight to a file (avoids multiline env splitting) and
          # export the host for later steps. Nothing is echoed to the log.
          install -m 600 /dev/null ssh_key
          doppler secrets get PYPARSER_HETZNER_SSH_KEY --plain > ssh_key
          echo "SSH_HOST=$(doppler secrets get PYPARSER_HETZNER_HOST --plain)" >> "$GITHUB_ENV"

      - name: Ship compose file + deploy script to host (/opt/pyparser/)
        run: |
          set -euo pipefail
          # The host runs bare `docker compose`, i.e. /opt/pyparser/docker-compose.yml.
          # Ship the repo's prod compose so service/env/resource changes actually
          # deploy, plus the remote deploy script the next step runs by path.
          # secrets.env on the host is never touched.
          scp -i ssh_key -o StrictHostKeyChecking=accept-new \
            pyparser/docker-compose.prod.yml \
            "leploy@${SSH_HOST}:/opt/pyparser/docker-compose.yml"
          scp -i ssh_key -o StrictHostKeyChecking=accept-new \
            pyparser/deploy-remote.sh \
            "leploy@${SSH_HOST}:/opt/pyparser/deploy-remote.sh"

      - name: Deploy over SSH (backup, drain, migrate, restart, rollback-on-failure)
        env:
          # SSH_HOST is exported to $GITHUB_ENV by the Doppler fetch step above.
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          # Run the deploy script as a real file on the host. The previous
          # `bash -s <<'REMOTE'` heredoc form silently delivered an empty stdin
          # in the runner, so deploys exited 0 without doing anything. Executing
          # a shipped file by path removes the stdin dependency and fails loudly
          # if the script is missing or errors. IMAGE_TAG is injected via the
          # command prefix; the host script reads it from the environment.
          ssh -i ssh_key -o StrictHostKeyChecking=accept-new \
            "leploy@${SSH_HOST}" "IMAGE_TAG='${IMAGE_TAG}' bash /opt/pyparser/deploy-remote.sh"

  prune-ghcr:
    needs: [deploy-hetzner]
    if: needs.deploy-hetzner.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Best-effort: keep the 10 newest images (each is a viable rollback
      # target) and prune the rest. Never blocks a deploy. `packages: write` is
      # the max a workflow token grants (there is no `delete` level) and it
      # authorizes version deletion because this repo publishes pyparser-review,
      # so the package inherits this repo's access. Only if the package were
      # unlinked from the repo would you need a classic PAT (`delete:packages`).
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: pyparser-review
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
