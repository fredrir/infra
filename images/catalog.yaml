- image: ghcr.io/fredrir/infra-runner-check
  dockerfile: images/runner-check/Containerfile
  inputs:
  - images/runner-check
  - cmd
  - internal
  - go.mod
  - go.sum
  - build/toolchain.json
  - build/dagger-embed.patch
  - build/BUILD.bazel
  - MODULE.bazel
  - MODULE.bazel.lock
  - .bazelversion
  - .bazelrc
  - BUILD.bazel
  - pyproject.toml
  - uv.lock
  excludes:
  - internal/dev
  check: >-
    /home/runner/run.sh --version | grep -x 2.337.0;
    kubectl version --client; kustomize version; helm version --short; actionlint -version; tofu version;
    ansible-playbook --version | head -n1; sops --version; age --version;
    /opt/venv/bin/python -c 'import ansible, jinja2, yaml'
- image: ghcr.io/fredrir/infra-runner-dagger
  dockerfile: images/runner-dagger/Containerfile
  inputs:
  - images/runner-dagger
  - cmd
  - internal
  - go.mod
  - go.sum
  - build/toolchain.json
  - build/dagger-embed.patch
  - build/BUILD.bazel
  - MODULE.bazel
  - MODULE.bazel.lock
  - .bazelversion
  - .bazelrc
  - BUILD.bazel
  excludes:
  - internal/dev
  check: /home/runner/run.sh --version | grep -x 2.337.0; dagger version; infra version
- image: ghcr.io/fredrir/infra-runner-rust
  dockerfile: images/runner-rust/Containerfile
  inputs:
  - images/runner-rust
  - cmd
  - internal
  - go.mod
  - go.sum
  - build/toolchain.json
  - build/dagger-embed.patch
  - build/BUILD.bazel
  - MODULE.bazel
  - MODULE.bazel.lock
  - .bazelversion
  - .bazelrc
  - BUILD.bazel
  excludes:
  - internal/dev
  check: >-
    /home/runner/run.sh --version | grep -x 2.337.0;
    rustc --version | grep '^rustc 1\.98\.1 ';
    cargo +1.95.0 --version | grep '^cargo 1\.95\.0 ';
    zig version | grep -x 0.16.0;
    cargo-zigbuild -V | grep -F 0.23.4;
    sccache --version | grep -F 0.18.0;
    cargo nextest --version | grep -F 0.9.145;
    cargo audit --version | grep -F 0.22.2;
    /usr/lib/postgresql/16/bin/initdb --version | grep -F ' 16.';
    pkg-config --exists openssl zlib;
    printf test > /tmp/probe && nix-hash --type sha256 --flat --base32 /tmp/probe | grep -x 020ay2q1av2xs4n842rb3d7vz8qms1dcb87a5yd6azaci20x11lz;
    infra version
- image: ghcr.io/fredrir/platform-caddy
  dockerfile: images/caddy/Containerfile
  inputs:
  - images/caddy
  check: caddy version | grep -E '^v2\.11\.4 '; caddy list-modules | grep -x http.handlers.file_server
  shell: '["/bin/sh", "-euc"]'
- image: ghcr.io/fredrir/platform-backup-tools
  dockerfile: platform/components/backups/tools.Dockerfile
  inputs:
  - platform/components/backups/tools.Dockerfile
  - cmd
  - internal
  - go.mod
  - go.sum
  - build/toolchain.json
  - build/dagger-embed.patch
  - build/BUILD.bazel
  - MODULE.bazel
  - MODULE.bazel.lock
  - .bazelversion
  - .bazelrc
  - BUILD.bazel
  excludes:
  - internal/dev
  check: restic version; mongodump --version; pg_dump --version; kubectl version --client; sqlite3 --version
