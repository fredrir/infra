[project]
name            = "fredrir-infra"
version         = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies    = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.scripts]
infra = "infra.cli:main"

[build-system]
requires      = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/infra"]

[dependency-groups]
ci = ["ansible-core>=2.21,<2.22", "cel-python==0.4.0", "jinja2>=3.1.6,<4"]