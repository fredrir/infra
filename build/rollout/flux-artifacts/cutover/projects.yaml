apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-llunde
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: platform-policy
      readyExpr: dep.spec.sourceRef.kind == 'ExternalArtifact' && dep.spec.sourceRef.name == 'platform-policy-95ec2fca6f8c2675459bbc41c21af122e9310580' && dep.metadata.generation == dep.status.observedGeneration && dep.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
  interval: 10m
  path: ./platform/projects/llunde
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-settings
  prune: true
  retryInterval: 1m
  serviceAccountName: platform-reconciler
  sourceRef:
    kind: ExternalArtifact
    name: project-llunde
  timeout: 15m
  wait: false
