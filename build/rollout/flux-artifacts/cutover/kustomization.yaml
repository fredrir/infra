apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../platform/clusters/production
patches:
- target:
    kind: Kustomization
    name: flux-system
    namespace: flux-system
  patch: |
    - op: replace
      path: /spec/path
      value: ./build/rollout/flux-artifacts/cutover
