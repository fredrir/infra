name: Prepare reconciliation
description: Install reconciliation tools and session credentials.
inputs:
  network:
    description: Enable private infrastructure access.
    default: 'false'
  identity:
    description: Scoped network identity.
    default: plan
  tailscale-client-id:
    description: Federated network identity.
    required: false
runs:
  using: composite
  steps:
  - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: |
        ${{ runner.temp }}/tofu-providers
        ~/.cache/uv
      key: reconciliation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tofu/.terraform.lock.hcl', 'uv.lock') }}
  - shell: bash
    run: |
      infra ci install-tools tofu flux kubectl helm actionlint sops uv
  - shell: bash
    run: |
      uv sync --frozen --group ci --no-install-project
      printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      mkdir -p "$RUNNER_TEMP/tofu-providers"
      printf 'TF_PLUGIN_CACHE_DIR=%s\n' "$RUNNER_TEMP/tofu-providers" >> "$GITHUB_ENV"
  - if: inputs.network == 'true'
    shell: bash
    env:
      RECONCILE_IDENTITY: ${{ inputs.identity }}
    run: |
      for required in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN TF_VAR_hcloud_token TF_VAR_platform_mail_recipient KUBE_CONFIG; do
        if [ -z "${!required}" ]; then echo "Missing $required in infrastructure-$RECONCILE_IDENTITY" >&2; exit 1; fi
      done
      identity=$(aws sts get-caller-identity --query Arn --output text)
      case "$identity" in
        arn:aws:iam::*:user/automation/infra-reconciliation-"$RECONCILE_IDENTITY") ;;
        *) echo 'Unexpected AWS reconciliation identity' >&2; exit 1 ;;
      esac
      umask 077
      printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/reconcile-kubeconfig"
      printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/reconcile-kubeconfig" >> "$GITHUB_ENV"
  - if: inputs.network == 'true'
    uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
    with:
      version: 1.102.4
      sha256sum: 50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9
      oauth-client-id: ${{ inputs.tailscale-client-id }}
      audience: infra-reconciliation-${{ inputs.identity }}
      tags: tag:infra-${{ inputs.identity }}
      hostname: infra-${{ inputs.identity }}-${{ github.run_id }}
      args: --accept-dns=false
