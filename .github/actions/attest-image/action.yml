name: Attest public image
description: Publish GitHub provenance for a verified public image.
inputs:
  image:
    description: Published image repository.
    required: true
  digest:
    description: Published immutable image digest.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
