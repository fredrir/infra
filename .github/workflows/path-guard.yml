# Advisory network/deploy-plane path guard — a PR comment, never a veto, on
# purpose: path lists are both under- and over-inclusive, and a same-repo guard
# can always be edited by the same PR it guards. It makes the author pause.
#
# A merge to main IS a deploy to both hosts (llunde-01 ~5min, llunde-parser
# +30min), and these paths can sever the management plane or the deploy loop.
# The deadman self-heals a severed activation, but a deliberate pause is cheaper.
name: Path guard

on:
  pull_request:

concurrency:
  group: path-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Comment when the diff touches plane-sensitive paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # No checkout: the file list AND the patches come from the API.
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename')
          MATCHED=$(echo "$FILES" | grep -E \
            '^(modules/(tailscale|profiles|secrets|gitops-pull)/|secrets/|tailscale/|hosts/[^/]+/secrets\.nix$|flake\.lock$|\.github/workflows/)' \
            || true)

          # Reconcile-check guard. A reconcile `check` runs from the RUNNING
          # generation (modules/gitops-pull sets restartIfChanged = false — the
          # self-deploying-deployer guard), so a rev changing a check AND the
          # config it validates grades the NEW config with the OLD check: restart
          # skipped, reconcile_failed sticky, deploy stalled on the old container.
          #
          # Matched on the PATCH, not the file list: check strings live in
          # hosts/*/default.nix and modules/ingress/default.nix, which change
          # constantly for innocent reasons. Only a changed +/- line carrying a
          # `check =` assignment (or the caddyfileCheck that renders one) counts;
          # +++/--- headers are excluded so a path containing "check" cannot
          # trip it.
          CHECKS=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '
            .[]
            | .filename as $f
            | ((.patch // "") | split("\n")[])
            | select(startswith("+") or startswith("-"))
            | select((startswith("+++") or startswith("---")) | not)
            | select(test("check[[:space:]]*=|caddyfileCheck"))
            | $f' | sort -u || true)

          MARKER='<!-- path-guard -->'
          if [ -z "$MATCHED" ] && [ -z "$CHECKS" ]; then
            echo "nothing to flag"
            exit 0
          fi
          {
            printf '%s\n' "$MARKER"
            if [ -n "$MATCHED" ]; then
              printf '⚠️ **Network/deploy-plane change** — this PR touches:\n\n```\n%s\n```\n\nUnder pull auto-apply, merging deploys this to llunde-01 within ~5min and llunde-parser +30min. If this can sever tailscale/sshd or the pull loop itself, consider:\n- watching the first apply (`journalctl -fu gitops-pull` on the host), or\n- pausing first: disable the *Promote to deploy* workflow, merge, verify manually, re-enable.\n\nThe deadman rolls back a severed activation in ≤10min; a deliberate pause is still cheaper.\n' "$MATCHED"
            fi
            if [ -n "$MATCHED" ] && [ -n "$CHECKS" ]; then printf '\n---\n\n'; fi
            if [ -n "$CHECKS" ]; then
              printf '🧊 **A reconcile `check` changed** — in:\n\n```\n%s\n```\n\n**The check that will grade this deploy is the OLD one.** gitops-pull runs from the *running* generation, so a new check string only takes effect on the NEXT rev. If this PR also changes a config that this check validates, the new config gets graded by the old check — restart skipped, sticky `reconcile_failed`, deploy stalled.\n\n**Land the check change in its own rev first** — against the old config it is a no-op — then the config change. See `modules/gitops-pull/default.nix` header and runbook §6.\n' "$CHECKS"
            fi
            printf '\n*(Advisory only — see ADR 020.)*\n'
          } > guard-body.md
          BODY=$(cat guard-body.md)
          # Upsert: one comment per PR, edited in place on subsequent pushes.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "updated existing guard comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "posted guard comment"
          fi
