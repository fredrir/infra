name: Apply infrastructure
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      verify:
        type: boolean
        default: false
      repair:
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  INFRA_RECONCILE_TAILNET: 'true'
concurrency:
  group: infrastructure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: infrastructure-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-reconciliation-cli
    - uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
      if: github.event.pull_request.head.repo.full_name == github.repository
      id: doppler
      with:
        doppler-token: ${{ secrets.DOPPLER_TOKEN }}
    - uses: ./.github/actions/setup-reconciliation
      with:
        network: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        tailscale-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        KUBE_CONFIG: ${{ steps.doppler.outputs.KUBE_CONFIG }}
    - name: Validate affected declarations
      env:
        BEFORE: ${{ github.event.pull_request.base.sha }}
      run: |
        infra ci prepare-validation
        infra ci validate
    - name: Plan affected infrastructure
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
      run: |
        set -o pipefail
        infra reconcile plan --base "$BASE" | tee "$RUNNER_TEMP/infrastructure-plan.txt"
    - name: Require a trusted branch for the live plan
      if: github.event.pull_request.head.repo.full_name != github.repository
      run: |
        echo 'Live planning requires a branch in fredrir/infra; fork code receives no infrastructure credentials.' >> "$GITHUB_STEP_SUMMARY"
        exit 1
    - name: Summarize plan
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/infrastructure-plan.txt" ]; then
          {
            printf '```text\n'
            tail -c 900000 "$RUNNER_TEMP/infrastructure-plan.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Remove session credentials
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/reconcile-kubeconfig"
  apply:
    if: ${{ !cancelled() && github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: infrastructure-apply
    timeout-minutes: 130
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
    env:
      VERIFICATION: ${{ inputs.verify }}
    outputs:
      reconciliation: ${{ steps.reconcile.outcome }}
      differences: ${{ steps.verification.outputs.differences }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install provenance gate
      env:
        GATE_RELEASE: infra-v0.2.11
        GATE_SHA256: a2ed770151bcca5feb94b0f85341be202a454e6c894aa4aeb9110f89048bfb9f
      run: |
        gate="$RUNNER_TEMP/provenance-gate/infra"
        mkdir -p "$(dirname "$gate")"
        curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/fredrir/infra/releases/download/$GATE_RELEASE/infra-linux-amd64" --output "$gate"
        printf '%s  %s\n' "$GATE_SHA256" "$gate" | sha256sum --check --strict
        chmod 755 "$gate"
        "$gate" ci install-tools gh cosign
    - uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
      id: doppler
      with:
        doppler-token: ${{ secrets.DOPPLER_TOKEN }}
    - name: Verify commit provenance
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        PROVENANCE_TOKEN: ${{ github.token }}
      run: |
        "$RUNNER_TEMP/provenance-gate/infra" reconcile provenance --report "$RUNNER_TEMP/reconciliation/provenance.json"
    - uses: ./.github/actions/setup-reconciliation-cli
    - uses: ./.github/actions/setup-reconciliation
      id: setup
      with:
        network: 'true'
        identity: apply
        full: ${{ env.VERIFICATION == 'true' || inputs.full }}
        tailscale-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        KUBE_CONFIG: ${{ steps.doppler.outputs.KUBE_CONFIG }}
    - name: Configure host identity
      if: steps.setup.outputs.hosts == 'true'
      env:
        SSH_PRIVATE_KEY: ${{ steps.doppler.outputs.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ steps.doppler.outputs.SSH_KNOWN_HOSTS }}
      run: |
        test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
        umask 077
        mkdir -p "$HOME/.ssh"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
    - name: Validate affected declarations
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        infra ci prepare-validation
        infra ci validate
    - name: Read declared runner fleet
      if: steps.setup.outputs.hosts == 'true'
      id: runner-fleet
      run: |
        owner=$(jq -r '.owner' build/runners.json)
        repositories=$(jq -r '.repositories | keys_unsorted | join(",")' build/runners.json)
        test -n "$owner" && test "$owner" != null && test -n "$repositories"
        printf 'owner=%s\nrepositories=%s\n' "$owner" "$repositories" >> "$GITHUB_OUTPUT"
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      if: steps.setup.outputs.hosts == 'true' && env.VERIFICATION == 'true'
      id: observer-token
      with:
        app-id: ${{ steps.doppler.outputs.OBSERVER_APP_ID }}
        private-key: ${{ steps.doppler.outputs.OBSERVER_APP_PRIVATE_KEY }}
        owner: ${{ steps.runner-fleet.outputs.owner }}
        repositories: ${{ steps.runner-fleet.outputs.repositories }}
        permission-administration: read
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      if: steps.setup.outputs.hosts == 'true' && env.VERIFICATION != 'true'
      id: runner-token
      with:
        app-id: ${{ steps.doppler.outputs.RUNNER_APP_ID }}
        private-key: ${{ steps.doppler.outputs.RUNNER_APP_PRIVATE_KEY }}
        owner: ${{ steps.runner-fleet.outputs.owner }}
        repositories: ${{ steps.runner-fleet.outputs.repositories }}
        permission-administration: write
    - name: Write publisher key
      if: env.VERIFICATION != 'true'
      env:
        PUBLISHER_APP_PRIVATE_KEY: ${{ steps.doppler.outputs.PUBLISHER_APP_PRIVATE_KEY }}
      run: |
        umask 077
        mkdir -p "$RUNNER_TEMP/publisher"
        printf '%s\n' "$PUBLISHER_APP_PRIVATE_KEY" > "$RUNNER_TEMP/publisher/key.pem"
    - name: Reconcile merged revision
      id: reconcile
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        SOPS_AGE_KEY: ${{ steps.doppler.outputs.SOPS_AGE_KEY }}
        GH_TOKEN: ${{ steps.runner-token.outputs.token || steps.observer-token.outputs.token }}
        PROVENANCE_TOKEN: ${{ github.token }}
        PUBLISHER_APP_PRIVATE_KEY_FILE: ${{ env.VERIFICATION != 'true' && format('{0}/publisher/key.pem', runner.temp) || '' }}
        FULL: ${{ inputs.full }}
        STRATEGY_OVERRIDE: ${{ vars.INFRA_ANSIBLE_STRATEGY }}
      run: |
        if [ -n "$STRATEGY_OVERRIDE" ]; then export ANSIBLE_STRATEGY="$STRATEGY_OVERRIDE"; fi
        if [ "$VERIFICATION" = true ]; then
          infra ci measure --stage drift-verification --budget 10m --report-dir "$RUNNER_TEMP/reconciliation" -- infra reconcile verify --deep --report="$RUNNER_TEMP/reconciliation/verification.json"
        else
          code=0
          infra reconcile apply --wait=11m --full="$FULL" --report="$RUNNER_TEMP/reconciliation/status.json" || code=$?
          if [ "$code" -eq 75 ]; then
            echo 'retry=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
        fi
    - name: Require a newer reconciliation of main
      if: steps.reconcile.outputs.retry == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # shellcheck disable=SC2016
        newer=$(gh run list --workflow reconcile.yml --event push --branch main --json databaseId,status --jq '.[] | select(.databaseId > ($ENV.GITHUB_RUN_ID | tonumber) and .status != "completed") | .databaseId')
        for run in $newer; do
          applied=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "reconcile / apply" and .status == "completed") | .status')
          if [ -z "$applied" ]; then
            echo "::notice::Reconciliation deferred to run $run"
            exit 0
          fi
        done
        echo "::error::Reconciliation must be retried and no newer push reconciliation of main has a pending apply"
        exit 1
    - name: Read declared differences
      id: verification
      if: always() && inputs.verify && inputs.repair
      run: |
        report="$RUNNER_TEMP/reconciliation/verification.json"
        differences=false
        if [ -f "$report" ] && jq -e 'any(.differences[]; .system != "rulesets")' "$report" >/dev/null; then
          differences=true
        fi
        printf 'differences=%s\n' "$differences" >> "$GITHUB_OUTPUT"
    - name: Record workflow timing
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/reconciliation"
        gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '{created_at, run_started_at, start_delay_seconds: ((.run_started_at | fromdateiso8601) - (.created_at | fromdateiso8601))}' > "$RUNNER_TEMP/reconciliation/workflow-timing.json"
    - name: Summarize reconciliation
      if: always()
      run: |
        for report in provenance status verification; do
          if [ -f "$RUNNER_TEMP/reconciliation/$report.json" ]; then
            {
              printf '```json\n'
              cat "$RUNNER_TEMP/reconciliation/$report.json"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/reconciliation/*.json
        if-no-files-found: warn
        retention-days: 30
    - name: Remove session credentials
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/reconcile-kubeconfig" "$RUNNER_TEMP/publisher/key.pem" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/known_hosts"
  repair:
    needs: apply
    if: ${{ !cancelled() && needs.apply.result == 'failure' && inputs.verify && inputs.repair && needs.apply.outputs.reconciliation == 'failure' && needs.apply.outputs.differences == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Request full reconciliation
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        pushed=$(gh run list --workflow reconcile.yml --event push --branch main --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId')
        for run in $pushed; do
          applied=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "reconcile / apply" and .status == "completed") | .status')
          if [ -z "$applied" ]; then
            echo "::warning::Push reconciliation run $run has not completed its apply; not dispatching a repair"
            exit 0
          fi
        done
        previous=$(gh run list --workflow reconcile.yml --event workflow_dispatch --user 'github-actions[bot]' --commit "$GITHUB_SHA" --limit 1 --json conclusion,createdAt --jq '.[] | if (.conclusion | IN("failure", "timed_out", "startup_failure")) then "ended in \(.conclusion)" elif .conclusion != "cancelled" and now - (.createdAt | fromdateiso8601) < 21600 then "started within six hours" else empty end')
        if [ -n "$previous" ]; then
          echo "::warning::The dispatched full reconciliation of $GITHUB_SHA $previous; not dispatching another"
          exit 0
        fi
        gh workflow run reconcile.yml --ref main -f full=true
