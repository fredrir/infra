name: Plan infrastructure
on:
  workflow_call:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  INFRA_RECONCILE_TAILNET: 'true'
concurrency:
  group: infrastructure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: infrastructure-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-reconciliation-cli
    - uses: ./.github/actions/setup-reconciliation
      with:
        network: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        tailscale-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ secrets.PLATFORM_MAIL_RECIPIENT }}
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    - name: Validate affected declarations
      env:
        BEFORE: ${{ github.event.pull_request.base.sha }}
      run: |
        infra ci prepare-validation
        infra ci validate
    - name: Plan affected infrastructure
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ secrets.PLATFORM_MAIL_RECIPIENT }}
      run: |
        set -o pipefail
        infra reconcile plan --base "$BASE" --full | tee "$RUNNER_TEMP/infrastructure-plan.txt"
    - name: Require a trusted branch for the live plan
      if: github.event.pull_request.head.repo.full_name != github.repository
      run: |
        echo 'Live planning requires a branch in fredrir/infra; fork code receives no infrastructure credentials.' >> "$GITHUB_STEP_SUMMARY"
        exit 1
    - name: Summarize plan
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/infrastructure-plan.txt" ]; then
          {
            printf '```text\n'
            tail -c 900000 "$RUNNER_TEMP/infrastructure-plan.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Remove session credentials
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/reconcile-kubeconfig"
