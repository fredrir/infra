name: Apply infrastructure
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  INFRA_RECONCILE_TAILNET: 'true'
  SCOPE_HOSTS: ${{ vars.INFRA_SCOPE_HOSTS == 'true' }}
  SCOPE_PROJECTS: ${{ vars.INFRA_SCOPE_PROJECTS == 'true' }}
  VERIFY_ARTIFACTS: ${{ vars.INFRA_VERIFY_ARTIFACTS == 'true' }}
concurrency:
  group: infrastructure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: infrastructure-plan
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-reconciliation-cli
    - uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
      if: github.event.pull_request.head.repo.full_name == github.repository
      id: doppler
      with:
        doppler-token: ${{ secrets.DOPPLER_TOKEN }}
    - uses: ./.github/actions/setup-reconciliation
      with:
        network: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        tailscale-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        KUBE_CONFIG: ${{ steps.doppler.outputs.KUBE_CONFIG }}
    - name: Validate affected declarations
      env:
        BEFORE: ${{ github.event.pull_request.base.sha }}
      run: |
        infra ci prepare-validation
        infra ci validate
    - name: Plan affected infrastructure
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
      run: |
        set -o pipefail
        infra reconcile plan --base "$BASE" --scope-hosts="$SCOPE_HOSTS" --scope-projects="$SCOPE_PROJECTS" --verify-artifacts="$VERIFY_ARTIFACTS" | tee "$RUNNER_TEMP/infrastructure-plan.txt"
    - name: Require a trusted branch for the live plan
      if: github.event.pull_request.head.repo.full_name != github.repository
      run: |
        echo 'Live planning requires a branch in fredrir/infra; fork code receives no infrastructure credentials.' >> "$GITHUB_STEP_SUMMARY"
        exit 1
    - name: Summarize plan
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/infrastructure-plan.txt" ]; then
          {
            printf '```text\n'
            tail -c 900000 "$RUNNER_TEMP/infrastructure-plan.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Remove session credentials
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/reconcile-kubeconfig"
  apply:
    if: ${{ !cancelled() && github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: infrastructure-apply
    timeout-minutes: 100
    permissions:
      contents: write
      id-token: write
      actions: read
    outputs:
      reconciliation: ${{ steps.reconcile.outcome }}
      differences: ${{ steps.verification.outputs.differences }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-reconciliation-cli
    - uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
      id: doppler
      with:
        doppler-token: ${{ secrets.DOPPLER_TOKEN }}
    - uses: ./.github/actions/setup-reconciliation
      id: setup
      with:
        network: 'true'
        identity: apply
        full: ${{ github.event_name == 'schedule' || inputs.full }}
        tailscale-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        KUBE_CONFIG: ${{ steps.doppler.outputs.KUBE_CONFIG }}
    - name: Configure host identity
      if: steps.setup.outputs.hosts == 'true'
      env:
        SSH_PRIVATE_KEY: ${{ steps.doppler.outputs.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ steps.doppler.outputs.SSH_KNOWN_HOSTS }}
      run: |
        test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
        umask 077
        mkdir -p "$HOME/.ssh"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
    - name: Validate affected declarations
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        infra ci prepare-validation
        infra ci validate
    - name: Read declared runner fleet
      if: steps.setup.outputs.hosts == 'true'
      id: runner-fleet
      run: |
        owner=$(jq -r '.owner' build/runners.json)
        repositories=$(jq -r '.repositories | join(",")' build/runners.json)
        test -n "$owner" && test "$owner" != null && test -n "$repositories"
        printf 'owner=%s\nrepositories=%s\n' "$owner" "$repositories" >> "$GITHUB_OUTPUT"
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      if: steps.setup.outputs.hosts == 'true'
      id: runner-token
      with:
        app-id: ${{ steps.doppler.outputs.RUNNER_APP_ID }}
        private-key: ${{ steps.doppler.outputs.RUNNER_APP_PRIVATE_KEY }}
        owner: ${{ steps.runner-fleet.outputs.owner }}
        repositories: ${{ steps.runner-fleet.outputs.repositories }}
        permission-administration: ${{ github.event.schedule == '47 * * * *' && 'read' || 'write' }}
    - name: Reconcile merged revision
      id: reconcile
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.doppler.outputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.AWS_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
        TF_VAR_hcloud_token: ${{ steps.doppler.outputs.HCLOUD_TOKEN }}
        TF_VAR_platform_mail_recipient: ${{ steps.doppler.outputs.PLATFORM_MAIL_RECIPIENT }}
        SOPS_AGE_KEY: ${{ steps.doppler.outputs.SOPS_AGE_KEY }}
        GH_TOKEN: ${{ steps.runner-token.outputs.token }}
        FULL: ${{ github.event.schedule == '17 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        SCHEDULED: ${{ github.event.schedule == '17 */6 * * *' }}
        DRIFT_ONLY: ${{ github.event.schedule == '47 * * * *' }}
        STRATEGY_OVERRIDE: ${{ vars.INFRA_ANSIBLE_STRATEGY }}
      run: |
        if [ -n "$STRATEGY_OVERRIDE" ]; then export ANSIBLE_STRATEGY="$STRATEGY_OVERRIDE"; fi
        if [ "$DRIFT_ONLY" = true ]; then
          infra ci measure --stage drift-verification --budget 10m --report-dir "$RUNNER_TEMP/reconciliation" -- infra reconcile verify --deep --verify-artifacts="$VERIFY_ARTIFACTS" --report="$RUNNER_TEMP/reconciliation/verification.json"
        else
          infra reconcile apply --full="$FULL" --scheduled="$SCHEDULED" --scope-hosts="$SCOPE_HOSTS" --scope-projects="$SCOPE_PROJECTS" --verify-artifacts="$VERIFY_ARTIFACTS" --report="$RUNNER_TEMP/reconciliation/status.json"
        fi
    - name: Read declared differences
      id: verification
      if: always() && github.event.schedule == '47 * * * *'
      run: |
        report="$RUNNER_TEMP/reconciliation/verification.json"
        differences=false
        if [ -f "$report" ] && jq -e '.differences | length > 0' "$report" >/dev/null; then
          differences=true
        fi
        printf 'differences=%s\n' "$differences" >> "$GITHUB_OUTPUT"
    - name: Record workflow timing
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/reconciliation"
        gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '{created_at, run_started_at, start_delay_seconds: ((.run_started_at | fromdateiso8601) - (.created_at | fromdateiso8601))}' > "$RUNNER_TEMP/reconciliation/workflow-timing.json"
    - name: Summarize reconciliation
      if: always()
      run: |
        for report in status verification; do
          if [ -f "$RUNNER_TEMP/reconciliation/$report.json" ]; then
            {
              printf '```json\n'
              cat "$RUNNER_TEMP/reconciliation/$report.json"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/reconciliation/*.json
        if-no-files-found: warn
        retention-days: 30
    - name: Remove session credentials
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/reconcile-kubeconfig" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/known_hosts"
  repair:
    needs: apply
    if: ${{ !cancelled() && needs.apply.result == 'failure' && github.event.schedule == '47 * * * *' && needs.apply.outputs.reconciliation == 'failure' && needs.apply.outputs.differences == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Request full reconciliation
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        previous=$(gh run list --workflow reconcile.yml --event workflow_dispatch --user 'github-actions[bot]' --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')
        case "$previous" in
        failure|timed_out|startup_failure)
          echo "::warning::The dispatched full reconciliation of $GITHUB_SHA ended in $previous; not dispatching another"
          exit 0
          ;;
        esac
        gh workflow run reconcile.yml --ref main -f full=true
