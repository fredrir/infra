name: Deploy
on:
  workflow_dispatch:
    inputs:
      repository-id:
        required: true
        type: string
      image:
        required: true
        type: string
      digest:
        required: true
        type: string
      source-revision:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.image }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: deploy-amd64
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-infra
        with:
          root: .
      - name: Install tools
        run: |
          infra ci install-tools gh cosign
          command -v kustomize >/dev/null || infra ci install-tools kustomize
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        id: deployment-token
        with:
          scope: fredrir/infra
          identity: deploy
      - name: Verify and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TOKEN: ${{ steps.deployment-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY_ID: ${{ inputs.repository-id }}
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          SOURCE_REVISION: ${{ inputs.source-revision }}
        run: infra ci measure --stage promotion --budget 30s --report-dir "$RUNNER_TEMP/performance" -- infra ci deploy "$GITHUB_WORKSPACE"
      - name: Reconcile
        run: infra ci reconcile http://webhook-receiver.flux-system.svc.cluster.local/hook/273de0d9e70f699a6815cac41ac0e847b0ed56918dfff9301840383ef2760306
      - name: Verify served frontend revision
        if: inputs.image == 'ghcr.io/fredrir/llunde-frontend'
        env:
          REVISION: ${{ inputs.source-revision }}
        run: infra ci measure --stage readiness --budget 20s --report-dir "$RUNNER_TEMP/performance" -- infra ci wait-revision --url https://llunde.no/.well-known/revision --revision "$REVISION" --budget 19s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: deployment-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore
          retention-days: 14
