name: Deploy
run-name: Deploy ${{ inputs.repository-id }} ${{ inputs.image }} ${{ inputs.source-revision }}
on:
  workflow_dispatch:
    inputs:
      repository-id:
        required: true
        type: string
      image:
        required: true
        type: string
      digest:
        required: true
        type: string
      source-revision:
        required: true
        type: string
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.image }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: deploy-amd64
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Fetch current deployment configuration
        run: |
          test ! -e .git && test ! -L .git
          git init --quiet
          git remote add origin https://github.com/fredrir/infra
          git -c credential.helper= -c http.extraHeader= fetch --quiet --depth=1 origin refs/heads/main
          git -c core.hooksPath=/dev/null checkout --quiet -B main FETCH_HEAD
      - uses: ./.github/actions/setup-infra
        with:
          root: .
      - name: Install tools
        run: |
          infra ci install-tools gh cosign
          command -v kustomize >/dev/null || infra ci install-tools kustomize
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        id: deployment-token
        with:
          scope: fredrir/infra
          identity: deploy
      - name: Verify and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TOKEN: ${{ steps.deployment-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY_ID: ${{ inputs.repository-id }}
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          SOURCE_REVISION: ${{ inputs.source-revision }}
        run: infra ci measure --stage promotion --budget 30s --report-dir "$RUNNER_TEMP/performance" -- infra ci deploy "$GITHUB_WORKSPACE"
      - name: Verify served frontend revision
        if: inputs.image == 'ghcr.io/fredrir/llunde-frontend'
        env:
          SOURCE_REVISION: ${{ inputs.source-revision }}
        run: |
          GITHUB_SHA="$SOURCE_REVISION" infra ci measure --stage served-revision --budget 65s --report-dir "$RUNNER_TEMP/performance" -- \
            infra ci wait-revision --url https://llunde.no/.well-known/revision --revision "$SOURCE_REVISION" --budget 60s
      - name: Report desired revision
        run: |
          printf 'Desired infrastructure revision: %s\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'The Reconcile infrastructure workflow applies and verifies production.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: deployment-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore
          retention-days: 14
