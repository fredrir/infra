name: Reconcile infrastructure
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "build/evidence/*.json"
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        type: boolean
        default: false
      repair:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: infra-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    if: (inputs.verify || github.triggering_actor != 'fredrir-infra-verification[bot]')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infra-cli.yml
  check:
    if: ${{ !inputs.verify && github.triggering_actor != 'fredrir-infra-verification[bot]' }}
    needs: cli
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/check.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
  reconcile:
    if: (inputs.verify || github.triggering_actor != 'fredrir-infra-verification[bot]') && github.event_name != 'push'
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/reconcile-job.yml
    secrets: inherit
    with:
      verify: ${{ inputs.verify || false }}
  images:
    needs: cli
    if: github.event_name == 'push' && github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected && (inputs.verify || github.triggering_actor != 'fredrir-infra-verification[bot]')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
      cli-revision: ${{ needs.cli.outputs.revision }}
