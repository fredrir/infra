name: Reconcile infrastructure
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "build/evidence/*.json"
  pull_request:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true
      verify:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: infra-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    uses: ./.github/workflows/infra-cli.yml
  check:
    if: github.event_name != 'schedule' && !inputs.verify
    needs: cli
    uses: ./.github/workflows/check.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
  reconcile:
    permissions:
      contents: write
      id-token: write
      actions: write
    uses: ./.github/workflows/reconcile-job.yml
    secrets: inherit
    with:
      full: ${{ inputs.full || false }}
      verify: ${{ inputs.verify || false }}
  images:
    needs: cli
    if: github.event_name == 'push' && github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
      cli-revision: ${{ needs.cli.outputs.revision }}
