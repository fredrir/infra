name: Reconcile infrastructure
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "build/evidence/*.json"
  pull_request:
permissions:
  contents: read
concurrency:
  group: infra-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infra-cli.yml
  check:
    needs: cli
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/check.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
  reconcile:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/reconcile-job.yml
    secrets: inherit
  images:
    needs: cli
    if: github.event_name == 'push' && github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      cli-artifact: ${{ needs.cli.outputs.artifact }}
      cli-sha256: ${{ needs.cli.outputs.sha256 }}
      cli-revision: ${{ needs.cli.outputs.revision }}
