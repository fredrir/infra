name: Bazel cache filter
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bazel-cache-filter.yml
      - platform/components/bazel-cache/**
  pull_request:
    paths:
      - .github/workflows/bazel-cache-filter.yml
      - platform/components/bazel-cache/**
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-pinned native Bazel
        run: |
          version=$(jq -er '.bazel' build/toolchain.json)
          checksum=$(jq -er '.bazel_sha256' build/toolchain.json)
          mkdir -p "$RUNNER_TEMP/bazel/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64" --output "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/bazel/bin/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s\n' "$RUNNER_TEMP/bazel/bin" >> "$GITHUB_PATH"
      - name: Serve reads and refuse every write through the shipped nginx filter in front of bazel-remote
        env:
          GOTOOLCHAIN: local
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: bazel run @rules_go//go -- -C platform/components/bazel-cache/filtertest test ./... -count=1
