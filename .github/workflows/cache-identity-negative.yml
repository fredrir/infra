name: Reject other cache writer workflows
on:
  workflow_call:
permissions:
  contents: read
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  deny:
    if: github.repository_id == '1328085692' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject writer identities outside their reusable workflows
        env:
          CHECK_CLIENT_ID: ${{ vars.TAILSCALE_BAZEL_CACHE_CHECK_WRITER_CLIENT_ID }}
          CLI_CLIENT_ID: ${{ vars.TAILSCALE_BAZEL_CACHE_CLI_WRITER_CLIENT_ID }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'cache_identity_qualification_test.py'
          python3 -B .github/scripts/cache_identity_qualification.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cache-identity-negative-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-identity-negative.json
          retention-days: 30
          if-no-files-found: error
