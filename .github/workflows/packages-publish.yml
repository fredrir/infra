name: Package publisher
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
      smoke-scope:
        type: string
        default: quick
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'fredrir/packages' && github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ${{ github.repository == 'fredrir/packages' && github.ref == 'refs/heads/main' && github.ref_protected && vars.INFRA_VM_POOL_QUALIFIED == 'true' && 'dagger-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    environment: publish
    permissions:
      contents: read
    steps:
    - name: Require the bounded CI smoke scope
      env:
        SCOPE: ${{ inputs.smoke-scope }}
      run: |
        if [ "$SCOPE" != quick ]; then
          echo 'The full distribution matrix is local-only; CI requires quick.' >&2
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: |
          build
          .bazelversion
          .github/actions/setup-infra
          .github/rust-projects.yaml
    - uses: ./.infra/.github/actions/setup-infra
      with:
        root: .infra
    - name: Install release tools
      run: infra ci install-tools gh nfpm
    - name: Start isolated Dagger engine
      if: runner.environment == 'github-hosted'
      run: docker run --detach --name infra-dagger --volume /var/lib/dagger --privileged --cpus=2 --memory=5g --memory-swap=5g --pids-limit=512 registry.dagger.io/engine:v0.21.9@sha256:3c4e0cedaea400d7e30155e050f94910ea5f381b6f5942dd2172382657628cb4
    - name: Build signed repositories
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        PACKAGES_APK_KEY: ${{ secrets.PACKAGES_APK_KEY }}
        _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
      run: infra packages build --root .infra --infra-binary "$INFRA_BINARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: site
        path: ${{ runner.temp }}/packages/site
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 3
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: channels
        path: ${{ runner.temp }}/packages/channels
        if-no-files-found: error
        retention-days: 3
    - name: Stop Dagger engine
      if: always() && runner.environment == 'github-hosted'
      run: docker rm --force --volumes infra-dagger
  smoke:
    needs: build
    runs-on: ${{ github.repository == 'fredrir/packages' && github.ref == 'refs/heads/main' && github.ref_protected && vars.INFRA_VM_POOL_QUALIFIED == 'true' && 'dagger-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: |
          build
          .bazelversion
          .github/actions/setup-infra
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: site
        path: ${{ runner.temp }}/site
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: channels
        path: ${{ runner.temp }}/channels
    - uses: ./.infra/.github/actions/setup-infra
      with:
        root: .infra
    - name: Start isolated Dagger engine
      if: runner.environment == 'github-hosted'
      run: docker run --detach --name infra-dagger --volume /var/lib/dagger --privileged --cpus=2 --memory=5g --memory-swap=5g --pids-limit=512 registry.dagger.io/engine:v0.21.9@sha256:3c4e0cedaea400d7e30155e050f94910ea5f381b6f5942dd2172382657628cb4
    - name: Install from the new repositories
      env:
        SCOPE: ${{ inputs.smoke-scope }}
        _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
      run: infra ci measure --stage package-install --budget 10s --report-dir "$RUNNER_TEMP/performance" -- infra packages smoke --root .infra --infra-binary "$INFRA_BINARY" "$RUNNER_TEMP/site" "$RUNNER_TEMP/channels" "$SCOPE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: package-check-performance
        path: ${{ runner.temp }}/performance
        if-no-files-found: warn
        retention-days: 14
    - name: Stop Dagger engine
      if: always() && runner.environment == 'github-hosted'
      run: docker rm --force --volumes infra-dagger
  publish:
    needs: smoke
    if: '!inputs.dry-run'
    runs-on: ${{ github.repository == 'fredrir/packages' && github.ref == 'refs/heads/main' && github.ref_protected && vars.INFRA_VM_POOL_QUALIFIED == 'true' && 'dagger-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: |
          build
          .bazelversion
          .github/actions/setup-infra
    - uses: ./.infra/.github/actions/setup-infra
      with:
        root: .infra
    - name: Install release tools
      run: infra ci install-tools gh
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: site
        path: ${{ runner.temp }}/site
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: channels
        path: ${{ runner.temp }}/channels
    - name: Publish the package site
      env:
        GH_TOKEN: ${{ github.token }}
      run: infra packages publish-pages "$RUNNER_TEMP/site"
    - name: Publish Homebrew, Nix and AUR packages
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: infra packages publish-channels --channels "$RUNNER_TEMP/channels"
