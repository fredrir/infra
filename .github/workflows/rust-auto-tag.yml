name: Rust release tag
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  cli:
    uses: ./.github/workflows/infra-cli.yml
  tag:
    needs: cli
    if: github.repository_owner_id == '114402558' && github.ref == 'refs/heads/main' && github.ref_protected && !startsWith(github.event.head_commit.message, 'release:')
    runs-on: rust-amd64
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: rust-auto-tag-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
      id: token
      with:
        scope: ${{ github.repository }}
        identity: auto-tag
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src
        fetch-depth: 0
        token: ${{ steps.token.outputs.token }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: scripts/ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ needs.cli.outputs.artifact }}
        path: ${{ runner.temp }}/infra-cli
    - name: Verify infrastructure CLI
      env:
        CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        CLI_REVISION: ${{ needs.cli.outputs.revision }}
        WORKFLOW_REVISION: ${{ job.workflow_sha }}
      run: |
        test "$CLI_REVISION" = "$WORKFLOW_REVISION"
        printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
        chmod 755 "$RUNNER_TEMP/infra-cli/infra"
        printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
    - name: Install release tools
      run: infra ci install-tools git-cliff
    - name: Tag the next release
      working-directory: src
      run: infra release tag --cliff-config ../.infra/scripts/ci/cliff.toml
