name: Rust release
on:
  workflow_call: {}
permissions:
  contents: read
env:
  MACOS_SDK_OBJECT: MacOSX27.0.sdk.tar.zst
  MACOS_SDK_SHA256: 206f0ccf404784e98b1d1040fef4dbefce00273b1a4a668f4483c8b0370b52ab
jobs:
  cli:
    uses: ./.github/workflows/infra-cli.yml
  build:
    needs: cli
    if: github.repository_owner_id == '114402558' && github.ref_protected && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: rust-release-amd64
    timeout-minutes: 80
    permissions:
      contents: read
    outputs:
      name: ${{ steps.render.outputs.name }}
      prerelease: ${{ steps.render.outputs.prerelease }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: scripts/ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ needs.cli.outputs.artifact }}
        path: ${{ runner.temp }}/infra-cli
    - name: Verify infrastructure CLI
      env:
        CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        CLI_REVISION: ${{ needs.cli.outputs.revision }}
        WORKFLOW_REVISION: ${{ job.workflow_sha }}
      run: |
        test "$CLI_REVISION" = "$WORKFLOW_REVISION"
        printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
        chmod 755 "$RUNNER_TEMP/infra-cli/infra"
        printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
    - name: Install release tools
      run: infra ci install-tools goreleaser git-cliff
    - name: Fetch the macOS SDK
      run: infra ci fetch-macos-sdk
    - name: Render the release configuration
      id: render
      working-directory: src
      run: infra release prepare --cliff-config ../.infra/scripts/ci/cliff.toml
    - name: Build every target
      working-directory: src
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SNAPSHOT: ${{ github.ref_type != 'tag' }}
      run: infra release build
    - name: Verify and bundle the artifacts
      run: infra release bundle "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/bundle"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-bundle
        path: ${{ runner.temp }}/bundle
        if-no-files-found: error
        retention-days: 7
    - name: Cache report
      if: always()
      run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY" || true
  publish:
    needs: [cli, build]
    if: github.repository_owner_id == '114402558' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    runs-on: rust-release-amd64
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-bundle
        path: ${{ runner.temp }}/bundle
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra
        persist-credentials: false
        sparse-checkout: scripts/ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ needs.cli.outputs.artifact }}
        path: ${{ runner.temp }}/infra-cli
    - name: Verify infrastructure CLI
      env:
        CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        CLI_REVISION: ${{ needs.cli.outputs.revision }}
        WORKFLOW_REVISION: ${{ job.workflow_sha }}
      run: |
        test "$CLI_REVISION" = "$WORKFLOW_REVISION"
        printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
        chmod 755 "$RUNNER_TEMP/infra-cli/infra"
        printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
    - name: Install release tools
      run: infra ci install-tools gh
    - name: Draft the release
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      run: infra release draft --bundle "$RUNNER_TEMP/bundle"
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-checksums: ${{ runner.temp }}/bundle/assets/checksums.txt
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: needs.build.outputs.prerelease != 'true'
      with:
        path: src
        persist-credentials: false
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      if: needs.build.outputs.prerelease != 'true'
      id: crates
    - name: Publish the crate
      if: needs.build.outputs.prerelease != 'true'
      working-directory: src
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        PACKAGE: ${{ needs.build.outputs.name }}
      run: cargo publish --locked --no-verify --package "$PACKAGE"
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
      id: packages
      with:
        scope: fredrir/packages
        identity: dispatch-${{ github.repository_id }}
    - name: Refresh the package repositories
      env:
        GH_TOKEN: ${{ steps.packages.outputs.token }}
      run: gh workflow run publish.yml --repo fredrir/packages --ref main
