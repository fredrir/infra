name: Infrastructure images
on:
  workflow_call:
    inputs:
      cli-artifact:
        type: string
        required: true
      cli-sha256:
        type: string
        required: true
      cli-revision:
        type: string
        required: true
  schedule:
    - cron: 0 4 * * 1
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
jobs:
  cli:
    if: inputs.cli-artifact == '' && github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref_protected
    uses: ./.github/workflows/infra-cli.yml
  plan:
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') }}
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Plan
        id: plan
        env:
          REFRESH: ${{ github.event_name != 'push' }}
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          "$RUNNER_TEMP/infra-cli/infra" ci plan-images
  image:
    needs: [cli, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      deploy: false
      scan-skip-dirs: ${{ matrix.scan-skip-dirs || '' }}
      verified-tag: ${{ matrix.tag }}
      image-test-command: ${{ matrix.check }}
      image-test-shell: ${{ matrix.shell == '["/bin/sh", "-euc"]' && 'sh' || 'bash' }}
      cli-artifact: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
      cli-sha256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
      cli-revision: ${{ inputs.cli-revision || needs.cli.outputs.revision }}
