name: Infrastructure images
on:
  push:
    branches: [main]
    paths:
    - .dockerignore
    - .github/workflows/images.yml
    - images/runner-buildkit/**
    - images/runner-nix/**
    - images/caddy/**
    - platform/components/backups/tools.Dockerfile
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: ghcr.io/fredrir/infra-runner-buildkit
          dockerfile: images/runner-buildkit/Containerfile
          check: /home/runner/run.sh --version | grep -x 2.337.0; buildctl --version; buildkitd --version
        - image: ghcr.io/fredrir/infra-runner-nix
          dockerfile: images/runner-nix/Containerfile
          check: /home/runner/run.sh --version | grep -x 2.337.0; nix --version; nix config show | grep -x 'sandbox = true'
        - image: ghcr.io/fredrir/platform-caddy
          dockerfile: images/caddy/Containerfile
          check: caddy version | grep -E '^v2\.11\.4 '; caddy list-modules | grep -x http.handlers.file_server
          shell: '["/bin/sh", "-euc"]'
        - image: ghcr.io/fredrir/platform-backup-tools
          dockerfile: platform/components/backups/tools.Dockerfile
          check: restic version; mongodump --version; pg_dump --version; kubectl version --client; sqlite3 --version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@bf2b35e076ba54dbf50bfd8f750deaa78157dcfc
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      deploy: false
      test-command: |
        cp '${{ matrix.dockerfile }}' "$RUNNER_TEMP/Containerfile"
        cat <<'CHECK' >> "$RUNNER_TEMP/Containerfile"

        SHELL ${{ matrix.shell || '["/bin/bash", "-euo", "pipefail", "-c"]' }}
        RUN ${{ matrix.check }}
        CHECK
        export BUILDKITD_FLAGS="$BUILDKITD_FLAGS --oci-worker-net=host"
        buildctl-daemonless.sh build --frontend dockerfile.v0 \
          --local context=. --local "dockerfile=$RUNNER_TEMP" \
          --opt filename=Containerfile --opt platform=linux/amd64
