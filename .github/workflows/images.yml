name: Infrastructure images
on:
  push:
    branches: [main]
    paths:
    - .dockerignore
    - .github/workflows/images.yml
    - images/catalog.yaml
    - images/runner-buildkit/**
    - images/runner-nix/**
    - images/runner-rust/**
    - images/runner-check/**
    - flake.nix
    - flake.lock
    - pyproject.toml
    - uv.lock
    - images/caddy/**
    - platform/components/backups/tools.Dockerfile
  schedule:
  - cron: 0 4 * * 1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref_protected
    runs-on: check-amd64
    timeout-minutes: 10
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Plan
      id: plan
      env:
        REFRESH: ${{ github.event_name != 'push' }}
      run: bash scripts/ci/plan-images.sh
  image:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: fredrir/infra/.github/workflows/build-image.yml@1f2eecbc81ba184252f9ed85f893fa5eb3b5150a
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      deploy: false
      scan-skip-dirs: ${{ matrix.scan-skip-dirs || '' }}
      verified-tag: ${{ matrix.tag }}
      test-command: |
        cp '${{ matrix.dockerfile }}' "$RUNNER_TEMP/Containerfile"
        cat <<'CHECK' >> "$RUNNER_TEMP/Containerfile"

        SHELL ${{ matrix.shell || '["/bin/bash", "-euo", "pipefail", "-c"]' }}
        RUN ${{ matrix.check }}
        CHECK
        export BUILDKITD_FLAGS="$BUILDKITD_FLAGS --oci-worker-net=host"
        IMAGE='${{ matrix.image }}' source scripts/ci/build-cache-args.sh
        buildctl-daemonless.sh build --frontend dockerfile.v0 "${cache_import_args[@]}" \
          --local context=. --local "dockerfile=$RUNNER_TEMP" \
          --opt filename=Containerfile --opt platform=linux/amd64
