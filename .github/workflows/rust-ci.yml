name: Rust CI
on:
  workflow_call:
    inputs:
      cli-artifact:
        type: string
        default: ''
      cli-sha256:
        type: string
        default: ''
      cli-revision:
        type: string
        default: ''
      clippy-args:
        type: string
        default: --all-features
      test-args:
        type: string
        default: ''
      fast-test-args:
        type: string
        default: ''
      minimal-build:
        type: boolean
        default: true
      postgres:
        type: boolean
        default: false
      postgres-url-env:
        type: string
        default: DATABASE_URL
      timeout-minutes:
        type: number
        default: 45
      build-output-cache:
        type: boolean
        default: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
jobs:
  cli:
    if: inputs.cli-artifact == ''
    uses: ./.github/workflows/project-cli.yml
  check:
    needs: cli
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') && github.repository_owner_id == '114402558' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.event_name == 'pull_request' && 'rust-pr-amd64' || 'rust-amd64' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra-build-recipe
        persist-credentials: false
    - uses: ./.infra-build-recipe/.github/actions/use-cli
      with:
        artifact: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
        sha256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        revision: ${{ inputs.cli-revision || needs.cli.outputs.revision }}
    - name: Prepare
      env:
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
        TEST_ARGS: ${{ inputs.test-args }}
        FAST_TEST_ARGS: ${{ inputs.fast-test-args }}
      run: infra ci measure --stage rust-environment --budget '${{ inputs.timeout-minutes }}m' --report-dir "$RUNNER_TEMP/performance" -- infra ci rust prepare
    - name: Restore build outputs
      if: inputs.build-output-cache
      run: infra ci measure --stage rust-cache-restore --budget '${{ inputs.timeout-minutes }}m' --report-dir "$RUNNER_TEMP/performance" -- infra ci rust cache restore
    - name: Start test database
      if: inputs.postgres
      env:
        URL_ENV: ${{ inputs.postgres-url-env }}
      run: infra ci postgres start
    - name: Prepare changed test executables
      run: infra ci measure --stage rust-preparation --budget '${{ inputs.timeout-minutes }}m' --report-dir "$RUNNER_TEMP/performance" -- infra ci rust check prepare-fast
    - name: Check within aggregate budget
      run: infra ci measure --stage checks --budget 10s --report-dir "$RUNNER_TEMP/performance" -- infra ci rust check fast
    - name: Check Rust analysis and integration tests
      run: |
        infra ci rust check lint
        infra ci rust check test
        infra ci rust check docs
    - name: Check minimal feature build
      if: inputs.minimal-build
      run: infra ci rust check minimal
    - name: Stop test database
      if: always() && inputs.postgres
      run: infra ci postgres stop
    - name: Save build outputs
      if: inputs.build-output-cache
      run: infra ci measure --stage rust-cache-save --budget '${{ inputs.timeout-minutes }}m' --report-dir "$RUNNER_TEMP/performance" -- infra ci rust cache save
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rust-performance
        path: ${{ runner.temp }}/performance
        if-no-files-found: ignore
    - name: Cache report
      if: always()
      run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY" || true
