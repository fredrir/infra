name: Rust CI
on:
  workflow_call:
    inputs:
      clippy-args:
        type: string
        default: --all-features
      test-args:
        type: string
        default: ''
      fast-test-args:
        type: string
        default: ''
      minimal-build:
        type: boolean
        default: true
      postgres:
        type: boolean
        default: false
      postgres-url-env:
        type: string
        default: DATABASE_URL
      timeout-minutes:
        type: number
        default: 45
permissions:
  contents: read
jobs:
  check:
    if: github.repository_owner_id == '114402558' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.event_name == 'pull_request' && 'rust-pr-amd64' || 'rust-amd64' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .infra-build-recipe
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github/actions/setup-infra
          build/cli-release.json
    - uses: ./.infra-build-recipe/.github/actions/setup-infra
      with:
        root: .infra-build-recipe
    - name: Prepare
      env:
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
        TEST_ARGS: ${{ inputs.test-args }}
        FAST_TEST_ARGS: ${{ inputs.fast-test-args }}
      run: infra ci rust prepare
    - name: Restore build outputs
      run: infra ci rust cache restore
    - name: Prepare changed test executables
      run: infra ci rust check prepare-fast
    - name: Check within aggregate budget
      run: infra ci measure --stage checks --budget 10s --report-dir "$RUNNER_TEMP/performance" -- infra ci rust check fast
    - name: Save build outputs
      run: infra ci rust cache save
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: rust-performance
        path: ${{ runner.temp }}/performance
        if-no-files-found: ignore
    - name: Cache report
      if: always()
      run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY" || true
