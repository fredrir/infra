name: Build caddy image
'on':
  push:
    branches:
    - main
    paths:
    - images/caddy/**
    - .github/workflows/build-caddy.yml
    - .github/workflows/project-ci.yml
    - scripts/ci/**
permissions:
  contents: read
jobs:
  build:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.event_name ==
      'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && startsWith(vars.INFRA_CI_IMAGE,
      'ghcr.io/fredrir/infra-ci@sha256:') && contains(fromJSON(vars.INFRA_CI_ARCHITECTURES || '[]'), 'amd64')
    uses: ./.github/workflows/project-ci.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      project: caddy
      platforms: '["linux/amd64","linux/arm64"]'
      context: images/caddy
      dockerfile: images/caddy/Containerfile
      test-command: python3 -m unittest discover -s tests/ci -v
      request-release: false
