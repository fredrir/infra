name: Build infrastructure CLI
on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
      revision:
        value: ${{ jobs.build.outputs.revision }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      revision: ${{ steps.bundle.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: binary-cache
        with:
          path: ${{ runner.temp }}/infra-cli
          key: infra-cli-linux-amd64-bazel9.2.0-go1.27.1-${{ job.workflow_sha }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/infra-bazel-actions
            ~/.cache/infra-bazel-repository
          key: bazel-linux-amd64-9.2.0-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            bazel-linux-amd64-9.2.0-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.sum') }}-
      - name: Install pinned Bazel
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          BAZEL_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
        run: |
          curl --fail --location --retry 3 https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64 --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel"
      - name: Build CLI
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/bazel" --batch build --config=ci --disk_cache="$HOME/.cache/infra-bazel-actions" --repository_cache="$HOME/.cache/infra-bazel-repository" --@rules_go//go/config:pure //cmd/infra:infra'
      - name: Store binary identity
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          REVISION: ${{ job.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/infra-cli"
          cp bazel-bin/cmd/infra/infra_/infra "$RUNNER_TEMP/infra-cli/infra"
          sha256sum "$RUNNER_TEMP/infra-cli/infra" | cut -d' ' -f1 > "$RUNNER_TEMP/infra-cli/sha256"
          printf '%s\n' "$REVISION" > "$RUNNER_TEMP/infra-cli/revision"
      - name: Verify binary identity
        id: bundle
        env:
          REVISION: ${{ job.workflow_sha }}
        run: |
          test "$(cat "$RUNNER_TEMP/infra-cli/revision")" = "$REVISION"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/infra-cli/sha256")" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          printf 'sha256=%s\nrevision=%s\nartifact=infra-cli-%s-%s\n' "$(cat "$RUNNER_TEMP/infra-cli/sha256")" "$REVISION" "$REVISION" "$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
          if-no-files-found: error
          retention-days: 7
