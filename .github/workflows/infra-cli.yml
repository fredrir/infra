name: Build infrastructure CLI
on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
      revision:
        value: ${{ jobs.build.outputs.revision }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      revision: ${{ steps.bundle.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Identify CLI inputs
        id: inputs
        run: |
          sources=(cmd internal go.mod go.sum MODULE.bazel MODULE.bazel.lock BUILD.bazel .bazelrc .bazelversion build/toolchain.json build/dagger-embed.patch build/BUILD.bazel)
          while IFS= read -r path; do
            case "$path" in
              cmd/*|internal/*) ;;
              build/rollout/flux-artifacts/generate/*.go|tests/infra/*.go|ansible/tests/*.go)
                if grep -qx 'package main' "$path"; then
                  continue
                fi
                sources=(.); break ;;
              *) sources=(.); break ;;
            esac
          done < <(git ls-files -- '*.go')
          digest=$(git ls-tree -r HEAD -- "${sources[@]}" | sha256sum | cut -d' ' -f1)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          if [ "$digest" = "$(jq -r '.inputs_sha256 // ""' build/cli-release.json)" ]; then
            printf 'released=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: binary-cache
        with:
          path: ${{ runner.temp }}/infra-cli
          key: infra-cli-inputs-v2-${{ steps.inputs.outputs.digest }}
      - uses: ./.github/actions/setup-infra
        if: steps.inputs.outputs.released == 'true'
        with:
          root: .
      - name: Reuse released CLI for matching source inputs
        if: steps.inputs.outputs.released == 'true'
        env:
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/infra-cli"
          cp --remove-destination "$INFRA_BINARY" "$RUNNER_TEMP/infra-cli/infra"
          jq -er '.sha256' build/cli-release.json > "$RUNNER_TEMP/infra-cli/sha256"
          jq -er '.revision' build/cli-release.json > "$RUNNER_TEMP/infra-cli/source-revision"
          printf '%s\n' "$INPUT_DIGEST" > "$RUNNER_TEMP/infra-cli/inputs"
      - name: Reuse verified native CLI
        id: cached
        env:
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          bundle="$RUNNER_TEMP/infra-cli"
          if [ -f "$bundle/inputs" ] && [ "$(cat "$bundle/inputs")" = "$INPUT_DIGEST" ] && printf '%s  %s\n' "$(cat "$bundle/sha256")" "$bundle/infra" | sha256sum --check --strict --status; then
            printf 'hit=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.cached.outputs.hit != 'true'
        with:
          path: |
            ~/.cache/infra-bazel-actions
            ~/.cache/infra-bazel-repository
          key: infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-cli-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-check-
            infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-
      - name: Install pinned Bazel
        if: steps.cached.outputs.hit != 'true'
        env:
          BAZEL_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
        run: |
          curl --fail --location --retry 3 https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64 --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel"
      - name: Build CLI
        if: steps.cached.outputs.hit != 'true'
        run: |
          "$RUNNER_TEMP/bazel" --batch build --config=ci --platforms=@rules_go//go/toolchain:linux_amd64 --disk_cache="$HOME/.cache/infra-bazel-actions" --repository_cache="$HOME/.cache/infra-bazel-repository" --@rules_go//go/config:pure //cmd/infra:infra
      - name: Store binary identity
        if: steps.cached.outputs.hit != 'true'
        env:
          REVISION: ${{ job.workflow_sha }}
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/infra-cli"
          cp bazel-bin/cmd/infra/infra_/infra "$RUNNER_TEMP/infra-cli/infra"
          sha256sum "$RUNNER_TEMP/infra-cli/infra" | cut -d' ' -f1 > "$RUNNER_TEMP/infra-cli/sha256"
          printf '%s\n' "$REVISION" > "$RUNNER_TEMP/infra-cli/source-revision"
          printf '%s\n' "$INPUT_DIGEST" > "$RUNNER_TEMP/infra-cli/inputs"
      - name: Verify binary identity
        id: bundle
        env:
          REVISION: ${{ job.workflow_sha }}
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          test "$(cat "$RUNNER_TEMP/infra-cli/inputs")" = "$INPUT_DIGEST"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/infra-cli/sha256")" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          printf 'sha256=%s\nrevision=%s\nartifact=infra-cli-%s-%s\n' "$(cat "$RUNNER_TEMP/infra-cli/sha256")" "$REVISION" "$REVISION" "$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
