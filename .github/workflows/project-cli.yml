name: Project CI binary
on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
      revision:
        value: ${{ jobs.build.outputs.revision }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      revision: ${{ steps.bundle.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Build shared CLI
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/infra-cli/infra" ./cmd/infra
      - id: bundle
        env:
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/infra-cli/infra" | cut -d' ' -f1)
          printf 'sha256=%s\nrevision=%s\nartifact=project-cli-%s-%s\n' "$digest" "$WORKFLOW_REVISION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
          retention-days: 7
          if-no-files-found: error
