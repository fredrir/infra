name: Release qualified CI
on:
  workflow_run:
    workflows: [Qualify shared CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ci-promotion
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'fredrir/infra' && github.ref_protected && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'fredrir/infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Publish qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RELEASE: ci-v1.0.${{ github.event.workflow_run.run_number }}
          CANDIDATE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: go run ./cmd/infra ci channel release --release "$CI_RELEASE" --revision "$CANDIDATE_REVISION"
      - name: Propose channel promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/infra ci channel propose
