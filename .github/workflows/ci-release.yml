name: Release shared CI
on:
  workflow_run:
    workflows: [Reconcile infrastructure]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ci-promotion
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'fredrir/infra' && github.ref_protected && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'fredrir/infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select shared CI changes
        id: changes
        env:
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          base=$(jq -er '.revision | select(test("^[a-f0-9]{40}$"))' build/ci-channel.json)
          git cat-file -e "$base^{commit}"
          git cat-file -e "$CI_REVISION^{commit}"
          changed=false
          if ! git diff --quiet "$base" "$CI_REVISION" -- internal/ cmd/infra/ go.mod go.sum build/toolchain.json build/projects/ .github/workflows/ .github/actions/ platform/projects/y/*.Dockerfile platform/projects/y/Caddyfile; then
            changed=true
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - name: Select the checked CI revision
        if: steps.changes.outputs.changed == 'true'
        env:
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: git checkout --detach "$CI_REVISION"
      - uses: ./.github/actions/cli-inputs
        id: cli-inputs
        if: steps.changes.outputs.changed == 'true'
      - name: Require a matching released CLI
        if: steps.changes.outputs.changed == 'true'
        env:
          CLI_RELEASED: ${{ steps.cli-inputs.outputs.released }}
        run: |
          test "$CLI_RELEASED" = true
          version=$(jq -er '.tag' build/cli-release.json)
          checksum=$(jq -er '.sha256' build/cli-release.json)
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/fredrir/infra/releases/download/$version/infra-linux-amd64" --output "$RUNNER_TEMP/infra-release"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/infra-release" | sha256sum --check --strict
      - name: Restore the channel checkout
        if: steps.changes.outputs.changed == 'true'
        run: git checkout main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version-file: go.mod
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        if: steps.changes.outputs.changed == 'true'
        id: release-token
        with:
          scope: fredrir/infra
          identity: ci-release
      - name: Publish shared CI release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          CI_RELEASE: ci-v1.0.${{ github.run_id }}
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: go run ./cmd/infra ci channel release --release "$CI_RELEASE" --revision "$CI_REVISION"
      - name: Propose channel promotion
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          CI_RELEASE: ci-v1.0.${{ github.run_id }}
        run: |
          gh auth setup-git
          go run ./cmd/infra ci channel prepare --release "$CI_RELEASE"
          go run ./cmd/infra ci channel propose
