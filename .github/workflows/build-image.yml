name: Build image
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      target:
        type: string
        default: ''
      check-target:
        type: string
        default: ''
      dependency-image:
        type: string
        default: ''
      build-args:
        type: string
        default: ''
      recipe:
        type: string
        default: ''
      test-command:
        type: string
        default: ''
      image-test-command:
        type: string
        default: ''
      image-test-shell:
        type: string
        default: bash
      hosted:
        type: boolean
        default: false
      release-cli:
        type: boolean
        default: false
      cli-artifact:
        type: string
        default: ''
      cli-sha256:
        type: string
        default: ''
      cli-revision:
        type: string
        default: ''
      deploy:
        type: boolean
        default: true
      layer-cache:
        type: boolean
        default: true
      scanner-java:
        type: boolean
        default: false
      scan-skip-dirs:
        type: string
        default: ''
      verified-tag:
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 45
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
concurrency:
  group: image-${{ github.repository }}-${{ inputs.image }}
  cancel-in-progress: true
jobs:
  cli:
    if: inputs.cli-artifact == '' && github.repository == 'fredrir/infra' && !inputs.release-cli
    uses: ./.github/workflows/infra-cli.yml
  build:
    needs: cli
    if: ${{ !cancelled() && (needs.cli.result == 'success' || (needs.cli.result == 'skipped' && ((github.repository == 'fredrir/infra' && inputs.cli-artifact != '') || (github.repository != 'fredrir/infra' && inputs.cli-artifact == '') || (github.repository == 'fredrir/infra' && inputs.release-cli)))) && (!inputs.release-cli || (github.repository == 'fredrir/infra' && contains(fromJSON('["ghcr.io/fredrir/infra-runner-deploy","ghcr.io/fredrir/infra-source-watcher"]'), inputs.image) && inputs.cli-artifact == '')) && github.repository_owner_id == '114402558' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ${{ !inputs.hosted && contains(fromJSON('["fredrir/infra","fredrir/Y","fredrir/portfolio","fredrir/llunde-frontend","fredrir/llunde-backend","fredrir/llunde-pyparser"]'), github.repository) && github.ref == 'refs/heads/main' && github.ref_protected && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && vars.INFRA_VM_POOL_QUALIFIED == 'true' && 'dagger-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable public infrastructure recipe
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
        run: |
          test "$WORKFLOW_REPOSITORY" = fredrir/infra
          [[ "$WORKFLOW_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test ! -e .infra-build-recipe && test ! -L .infra-build-recipe
          git init --quiet .infra-build-recipe
          git -C .infra-build-recipe -c credential.helper= -c http.extraHeader= fetch --quiet --depth=1 https://github.com/fredrir/infra.git "$WORKFLOW_REVISION"
          git -C .infra-build-recipe -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
          test "$(git -C .infra-build-recipe rev-parse HEAD)" = "$WORKFLOW_REVISION"
      - uses: ./.infra-build-recipe/.github/actions/setup-infra
        if: github.repository != 'fredrir/infra' || inputs.release-cli
        with:
          root: .infra-build-recipe
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: github.repository == 'fredrir/infra' && !inputs.release-cli
        with:
          name: ${{ github.repository == 'fredrir/infra' && inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        if: github.repository == 'fredrir/infra' && !inputs.release-cli
        env:
          CLI_SHA256: ${{ github.repository == 'fredrir/infra' && inputs.cli-sha256 || needs.cli.outputs.sha256 }}
          CLI_REVISION: ${{ github.repository == 'fredrir/infra' && inputs.cli-revision || needs.cli.outputs.revision }}
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
        run: |
          test "$CLI_REVISION" = "$WORKFLOW_REVISION"
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
          printf 'INFRA_BINARY=%s/infra\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_ENV"
      - name: Select affected image
        id: affected
        env:
          BASE: ${{ github.event.before }}
          IMAGE: ${{ inputs.image }}
        run: |
          printf 'report-id=%s-%s\n' "${IMAGE##*/}" "$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
          printf '/.infra-build-recipe/\n' >> .git/info/exclude
          if [ -f ci/targets.json ]; then
            infra ci affected-project --base "$BASE" --target "${IMAGE##*/}"
          else
            printf 'changed=true\nreason=unconfigured\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: steps.affected.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start isolated Dagger engine
        if: steps.affected.outputs.changed == 'true' && (runner.environment == 'github-hosted')
        run: docker run --detach --name infra-dagger --volume /var/lib/dagger --privileged --cpus=2 --memory=5g --memory-swap=5g --pids-limit=512 registry.dagger.io/engine:v0.21.9@sha256:3c4e0cedaea400d7e30155e050f94910ea5f381b6f5942dd2172382657628cb4
      - name: Verify dedicated engine
        if: steps.affected.outputs.changed == 'true' && (runner.environment == 'self-hosted')
        run: infra doctor --root .infra-build-recipe --engine-only
      - name: Select shared recipe
        if: steps.affected.outputs.changed == 'true' && (inputs.recipe != '')
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          case "$RECIPE" in
            y-api|y-web) ;;
            *) exit 1 ;;
          esac
          mkdir -p containers
          cp .infra-build-recipe/platform/projects/y/Caddyfile containers/Caddyfile
          printf 'SHARED_DOCKERFILE=.infra-build-recipe/platform/projects/y/%s.Dockerfile\n' "${RECIPE#y-}" >> "$GITHUB_ENV"
      - name: Validate Dagger cache policy
        if: steps.affected.outputs.changed == 'true'
        env:
          LAYER_CACHE: ${{ inputs.layer-cache }}
        run: |
          if [[ "$LAYER_CACHE" != true ]]; then
            echo 'layer-cache=false is unsupported with Dagger; use an isolated engine for a cold build.' >&2
            exit 1
          fi
      - name: Check inputs
        if: steps.affected.outputs.changed == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/fredrir/[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$CONTEXT" != /* && "$CONTEXT" != -* && "$CONTEXT" != *..* ]]
          [[ "$DOCKERFILE" != /* && "$DOCKERFILE" != -* && "$DOCKERFILE" != *..* ]]
          test -d "$CONTEXT"
          test -f "${SHARED_DOCKERFILE:-$DOCKERFILE}"
          test "$(uname -m)" = x86_64
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
      - name: Test
        if: steps.affected.outputs.changed == 'true' && (inputs.test-command != '')
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          LAYER_CACHE: ${{ inputs.layer-cache }}
        run: infra ci measure-check --stage test-command --budget 10s --report-dir "$RUNNER_TEMP/performance/checks" -- bash -euo pipefail -c "$TEST_COMMAND"
      - name: Install verification tools
        if: steps.affected.outputs.changed == 'true'
        run: infra ci install-tools gh trivy cosign
      - name: Select isolated scanner cache
        if: steps.affected.outputs.changed == 'true'
        id: scanner-cache
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          family="${IMAGE##*/}"
          [[ "$family" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          cache="$HOME/.cache/infra/trivy/$family"
          mkdir -p "$cache"
          chmod 700 "$cache"
          export TRIVY_CACHE_DIR="$cache"
          version=$(trivy --version | sed -n 's/^Version: //p')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'TRIVY_CACHE_DIR=%s\n' "$cache" >> "$GITHUB_ENV"
          printf 'path=%s\nfamily=%s\nversion=%s\n' "$cache" "$family" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.affected.outputs.changed == 'true' && runner.environment == 'github-hosted'
        id: scanner-restore
        with:
          path: ${{ steps.scanner-cache.outputs.path }}
          key: trivy-v1-linux-amd64-${{ steps.scanner-cache.outputs.version }}-${{ steps.scanner-cache.outputs.family }}-${{ github.sha }}
          restore-keys: |
            trivy-v1-linux-amd64-${{ steps.scanner-cache.outputs.version }}-${{ steps.scanner-cache.outputs.family }}-
      - name: Report scanner cache state
        if: steps.affected.outputs.changed == 'true'
        run: |
          if [ -f "$TRIVY_CACHE_DIR/fanal/fanal.db" ]; then
            echo 'Scanner package analysis cache retained; vulnerability data is refreshed before checks.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scanner package analysis cache is cold; extraction cost remains inside the strict check budget.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare verification data
        if: steps.affected.outputs.changed == 'true'
        env:
          SCANNER_JAVA: ${{ inputs.scanner-java }}
          PUBLIC_PROVENANCE: ${{ !github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          infra ci measure --stage scanner-preparation --budget 5m --report-dir "$RUNNER_TEMP/performance/preparation" -- bash -euo pipefail -c '
            trivy image --download-db-only --no-progress --timeout 2m
            if [[ "$SCANNER_JAVA" == true ]]; then
              trivy image --download-java-db-only --no-progress --timeout 2m
            fi
            if [[ "$PUBLIC_PROVENANCE" == true ]]; then
              umask 077
              gh attestation trusted-root > "$RUNNER_TEMP/github-trusted-root.jsonl"
              test -s "$RUNNER_TEMP/github-trusted-root.jsonl"
            fi
          '
      - name: Build and publish
        if: steps.affected.outputs.changed == 'true'
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REGISTRY_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          DEPENDENCY_IMAGE: ${{ inputs.dependency-image }}
          CHECK_TARGET: ${{ inputs.check-target }}
          BUILD_ARGS: ${{ inputs.build-args }}
          IMAGE_TEST_COMMAND: ${{ inputs.image-test-command }}
          IMAGE_TEST_SHELL: ${{ inputs.image-test-shell }}
          BUILD_TIMEOUT: ${{ inputs.timeout-minutes }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
        run: |
          if [[ -n "$DEPENDENCY_IMAGE" ]]; then
            [[ "$DEPENDENCY_IMAGE" =~ ^ghcr\.io/fredrir/pyparser-dependencies@sha256:[a-f0-9]{64}$ ]]
            export BUILD_ARGS="$BUILD_ARGS"$'\n'"PARSER_DEPENDENCIES=$DEPENDENCY_IMAGE"
          fi
          infra pipeline image --root .infra-build-recipe --context "$CONTEXT" --dockerfile "${SHARED_DOCKERFILE:-$DOCKERFILE}" \
            --target "$TARGET" --check-target "$CHECK_TARGET" --check-report-dir "$RUNNER_TEMP/performance/checks" --infra-binary "$INFRA_BINARY" --image "$IMAGE:$GITHUB_SHA" --build-args "$(infra ci build-args)" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" \
            --test-command "$IMAGE_TEST_COMMAND" --test-shell "$IMAGE_TEST_SHELL" --timeout "${BUILD_TIMEOUT}m"
          printf 'report-id=%s-%s\n' "${IMAGE##*/}" "$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Scan published image
        if: steps.affected.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          skip=()
          if [[ -n "$SKIP_DIRS" ]]; then
            [[ "$SKIP_DIRS" =~ ^/[a-z/]+$ ]]
            skip=(--skip-dirs "$SKIP_DIRS")
          fi
          infra ci measure-check --stage vulnerability-scan --budget 10s --report-dir "$RUNNER_TEMP/performance/checks" -- \
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update --skip-java-db-update --timeout 10s "${skip[@]}" "$IMAGE"
      - uses: ./.infra-build-recipe/.github/actions/attest-image
        id: provenance
        if: steps.affected.outputs.changed == 'true' && (!github.event.repository.private)
        with:
          image: ${{ inputs.image }}
          digest: ${{ steps.build.outputs.digest }}
      - name: Verify published provenance
        if: steps.affected.outputs.changed == 'true' && (!github.event.repository.private)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.build.outputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$ATTESTATION_BUNDLE"
          infra ci measure-check --stage provenance-verification --budget 10s --report-dir "$RUNNER_TEMP/performance/checks" -- \
            gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" --bundle "$ATTESTATION_BUNDLE" \
            --custom-trusted-root "$RUNNER_TEMP/github-trusted-root.jsonl" \
            --signer-workflow fredrir/infra/.github/workflows/build-image.yml \
            --signer-digest "$WORKFLOW_SHA" --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"
      - name: Sign and verify private image provenance
        if: steps.affected.outputs.changed == 'true' && (github.event.repository.private)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/signature-registry"
          mkdir -m700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          umask 077
          jq -n '{auths:{"ghcr.io":{username:env.GITHUB_ACTOR,password:env.REGISTRY_TOKEN}}}' > "$DOCKER_CONFIG/config.json"
          unset REGISTRY_TOKEN
          cosign sign --yes --timeout 5m \
            --annotations "source-repository=$GITHUB_REPOSITORY" \
            --annotations "source-revision=$GITHUB_SHA" \
            --annotations "workflow-revision=$WORKFLOW_SHA" \
            --annotations "source-run-id=$GITHUB_RUN_ID" \
            --annotations "source-run-attempt=$GITHUB_RUN_ATTEMPT" "$IMAGE"
          infra ci measure-check --stage provenance-verification --budget 10s --report-dir "$RUNNER_TEMP/performance/checks" -- \
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/fredrir/infra/.github/workflows/build-image.yml@$WORKFLOW_SHA" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
            --annotations "source-repository=$GITHUB_REPOSITORY" \
            --annotations "source-revision=$GITHUB_SHA" \
            --annotations "workflow-revision=$WORKFLOW_SHA" "$IMAGE"
      - name: Enforce aggregate check budget
        if: steps.affected.outputs.changed == 'true'
        run: infra ci check-budget --budget 10s --report-dir "$RUNNER_TEMP/performance/checks" > "$RUNNER_TEMP/performance/check-budget.json"
      - name: Tag verified image
        if: steps.affected.outputs.changed == 'true' && (inputs.verified-tag != '')
        env:
          IMAGE: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          TAG: ${{ inputs.verified-tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: infra ci tag-image
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        if: steps.affected.outputs.changed == 'true' && (inputs.deploy)
        id: deployment-token
        with:
          scope: fredrir/infra
          identity: deploy-${{ github.repository_id }}
      - name: Request deployment
        if: steps.affected.outputs.changed == 'true' && (inputs.deploy)
        env:
          GH_TOKEN: ${{ steps.deployment-token.outputs.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh workflow run deploy.yml --repo fredrir/infra --ref main -f "repository-id=$GITHUB_REPOSITORY_ID" \
            -f "image=$IMAGE" -f "digest=$DIGEST" -f "source-revision=$GITHUB_SHA"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always() && runner.environment == 'github-hosted' && steps.scanner-restore.outputs.cache-primary-key != '' && steps.scanner-restore.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.scanner-cache.outputs.path }}
          key: ${{ steps.scanner-restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-${{ steps.affected.outputs.report-id || github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop Dagger engine
        if: always() && runner.environment == 'github-hosted' && steps.affected.outputs.changed == 'true'
        run: docker rm --force --volumes infra-dagger
