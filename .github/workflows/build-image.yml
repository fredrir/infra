name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: "Full image name, e.g. ghcr.io/fredrir/llunde-backend"
        required: true
        type: string
      context:
        description: "Build context directory"
        type: string
        default: "."
      containerfile:
        description: "Containerfile path relative to the context"
        type: string
        default: "Containerfile"
      push:
        description: "Push to GHCR (PRs typically build without pushing)"
        type: boolean
        default: true
      platforms:
        description: "Target platforms"
        type: string
        default: "linux/amd64"
      doppler-build-args:
        description: "Space-separated Doppler secret NAMES to pass as build args"
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        description: "Doppler service token; only needed with doppler-build-args"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dopplerhq/cli-action@v3
        if: inputs.doppler-build-args != ''

      - name: Collect Doppler build args
        id: doppler-args
        if: inputs.doppler-build-args != ''
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOPPLER_TOKEN" || { echo "doppler-build-args set but DOPPLER_TOKEN secret missing" >&2; exit 1; }
          {
            echo 'args<<EOF'
            for name in ${{ inputs.doppler-build-args }}; do
              value="$(doppler secrets get "$name" --plain)"
              echo "::add-mask::$value"
              echo "$name=$value"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.containerfile }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:latest
          build-args: ${{ steps.doppler-args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
