name: Build image
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      build-args:
        type: string
        default: ''
      recipe:
        type: string
        default: ''
      test-command:
        type: string
        default: ''
      image-test-command:
        type: string
        default: ''
      image-test-shell:
        type: string
        default: bash
      cli-artifact:
        type: string
        default: ''
      cli-sha256:
        type: string
        default: ''
      cli-revision:
        type: string
        default: ''
      deploy:
        type: boolean
        default: true
      layer-cache:
        type: boolean
        default: true
      scan-skip-dirs:
        type: string
        default: ''
      verified-tag:
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 45
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
permissions:
  contents: read
concurrency:
  group: image-${{ github.repository }}-${{ inputs.image }}
  cancel-in-progress: false
jobs:
  cli:
    if: inputs.cli-artifact == ''
    uses: ./.github/workflows/infra-cli.yml
  build:
    needs: cli
    if: always() && (needs.cli.result == 'success' || inputs.cli-artifact != '') && github.repository_owner_id == '114402558' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .infra-build-recipe
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
          CLI_REVISION: ${{ inputs.cli-revision || needs.cli.outputs.revision }}
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
        run: |
          test "$CLI_REVISION" = "$WORKFLOW_REVISION"
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start isolated Dagger engine
        run: docker run --detach --name infra-dagger --privileged --cpus=2 --memory=5g --memory-swap=5g --pids-limit=512 registry.dagger.io/engine:v0.21.9@sha256:3c4e0cedaea400d7e30155e050f94910ea5f381b6f5942dd2172382657628cb4
      - name: Select shared recipe
        if: inputs.recipe != ''
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          case "$RECIPE" in
            y-api|y-web) ;;
            *) exit 1 ;;
          esac
          mkdir -p containers
          cp .infra-build-recipe/platform/projects/y/Caddyfile containers/Caddyfile
          printf 'SHARED_DOCKERFILE=.infra-build-recipe/platform/projects/y/%s.Dockerfile\n' "${RECIPE#y-}" >> "$GITHUB_ENV"
      - name: Check inputs
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/fredrir/[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$CONTEXT" != /* && "$CONTEXT" != -* && "$CONTEXT" != *..* ]]
          [[ "$DOCKERFILE" != /* && "$DOCKERFILE" != -* && "$DOCKERFILE" != *..* ]]
          test -d "$CONTEXT"
          test -f "${SHARED_DOCKERFILE:-$DOCKERFILE}"
          test "$(uname -m)" = x86_64
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
      - name: Test
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          LAYER_CACHE: ${{ inputs.layer-cache }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
      - name: Install verification tools
        run: infra ci install-tools gh trivy cosign
      - name: Build and publish
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REGISTRY_TOKEN: ${{ github.token }}
          BUILD_ARGS: ${{ inputs.build-args }}
          IMAGE_TEST_COMMAND: ${{ inputs.image-test-command }}
          IMAGE_TEST_SHELL: ${{ inputs.image-test-shell }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
        run: |
          infra pipeline image --root .infra-build-recipe --context "$CONTEXT" --dockerfile "${SHARED_DOCKERFILE:-$DOCKERFILE}" \
            --infra-binary "$RUNNER_TEMP/infra-cli/infra" --image "$IMAGE:$GITHUB_SHA" --build-args "$(infra ci build-args)" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" \
            --test-command "$IMAGE_TEST_COMMAND" --test-shell "$IMAGE_TEST_SHELL"
      - name: Scan published image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          SKIP_DIRS: ${{ inputs.scan-skip-dirs }}
        run: |
          skip=()
          if [[ -n "$SKIP_DIRS" ]]; then
            [[ "$SKIP_DIRS" =~ ^/[a-z/]+$ ]]
            skip=(--skip-dirs "$SKIP_DIRS")
          fi
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 10m "${skip[@]}" "$IMAGE"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        if: '!github.event.repository.private'
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Verify published provenance
        if: '!github.event.repository.private'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.build.outputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow fredrir/infra/.github/workflows/build-image.yml \
            --signer-digest "$WORKFLOW_SHA" --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"
      - name: Sign and verify private image provenance
        if: github.event.repository.private
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/signature-registry"
          mkdir -m700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          umask 077
          jq -n '{auths:{"ghcr.io":{username:env.GITHUB_ACTOR,password:env.REGISTRY_TOKEN}}}' > "$DOCKER_CONFIG/config.json"
          unset REGISTRY_TOKEN
          cosign sign --yes --timeout 5m \
            --annotations "source-repository=$GITHUB_REPOSITORY" \
            --annotations "source-revision=$GITHUB_SHA" \
            --annotations "workflow-revision=$WORKFLOW_SHA" "$IMAGE"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/fredrir/infra/.github/workflows/build-image.yml@$WORKFLOW_SHA" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-trigger push \
            --annotations "source-repository=$GITHUB_REPOSITORY" \
            --annotations "source-revision=$GITHUB_SHA" \
            --annotations "workflow-revision=$WORKFLOW_SHA" "$IMAGE"
      - name: Tag verified image
        if: inputs.verified-tag != ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TAG: ${{ inputs.verified-tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: infra ci tag-image
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        if: inputs.deploy
        id: deployment-token
        with:
          scope: fredrir/infra
          identity: deploy-${{ github.repository_id }}
      - name: Request deployment
        if: inputs.deploy
        env:
          GH_TOKEN: ${{ steps.deployment-token.outputs.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh workflow run deploy.yml --repo fredrir/infra --ref main -f "repository-id=$GITHUB_REPOSITORY_ID" \
            -f "image=$IMAGE" -f "digest=$DIGEST" -f "source-revision=$GITHUB_SHA"
      - name: Stop Dagger engine
        if: always()
        run: docker rm --force infra-dagger
