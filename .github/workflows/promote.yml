# GitOps PULL substrate (ADR 019): a green Check on a push to main fast-forwards
# the `deploy` pointer to that commit. Hosts pull `deploy`, never `main`, so they
# only apply gate-approved commits — closing the ungated-apply race a raw
# `github:...#<host>` timer on main would have. Kept SEPARATE from check.yml so a
# bug here cannot affect the required gate. The only credential is the ephemeral
# GITHUB_TOKEN, scoped to move one ref: no standing secret reaches the estate.
#
#   Central pause : disable this workflow -> deploy freezes -> both hosts freeze.
#   Rollback      : `git push -f <good-sha>:deploy` from the laptop (works with
#                   the tailnet down; deploy is deliberately UNPROTECTED so the
#                   force-push lever always exists).
name: Promote to deploy

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]

# Serialize promotes; never cancel one mid-flight.
concurrency:
  group: promote-deploy
  cancel-in-progress: false

jobs:
  promote:
    # Only a GREEN gate, on a push to main (never PR runs).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward deploy -> gated main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Check passed on main @ $SHA"
          CUR="$(gh api "repos/$REPO/git/ref/heads/deploy" -q '.object.sha' 2>/dev/null || true)"
          if [ -z "$CUR" ]; then
            echo "deploy ref missing — creating it at $SHA"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/deploy" -f sha="$SHA"
          elif [ "$CUR" = "$SHA" ]; then
            echo "deploy already at $SHA — nothing to do"
          else
            # force=false => FAST-FORWARD ONLY: deploy can never diverge from
            # main's gated history. A non-fast-forward fails loudly instead of
            # clobbering — e.g. after a manual rollback to a non-ancestor.
            echo "fast-forwarding deploy $CUR -> $SHA"
            gh api -X PATCH "repos/$REPO/git/refs/heads/deploy" -f sha="$SHA" -F force=false
          fi
