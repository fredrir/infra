name: Promote shared CI
on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        type: string
  push:
    branches: [main]
    paths: [build/ci-channel.json]
permissions:
  contents: read
concurrency:
  group: ci-promotion
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'fredrir/infra' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Prepare promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: go run ./cmd/infra ci channel prepare --release "$RELEASE"
      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/infra ci channel propose
  promote:
    if: github.event_name == 'push' && github.repository == 'fredrir/infra' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: octo-sts/action@a48df0af0fefd5197a00306a77dd198cdf442a76
        id: channel-token
        with:
          scope: fredrir/infra
          identity: ci-channel
      - name: Advance CI channel
        env:
          GH_TOKEN: ${{ steps.channel-token.outputs.token }}
        run: go run ./cmd/infra ci channel promote
