name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    uses: ./.github/workflows/infra-cli.yml
  check:
    needs: cli
    runs-on: ${{ github.repository == 'fredrir/infra' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request' && vars.INFRA_VM_POOL_QUALIFIED == 'true' && 'dagger-amd64' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        env:
          CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
      - name: Select affected inputs
        id: affected
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=''
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          expression=$(infra pipeline affected --base "$base")
          printf 'expression=%s\n' "$expression" >> "$GITHUB_OUTPUT"
      - name: Start isolated Dagger engine
        if: runner.environment == 'github-hosted' && steps.affected.outputs.expression != 'set()'
        run: docker run --detach --name infra-dagger --volume /var/lib/dagger --privileged --cpus=2 --memory=5g --memory-swap=5g --pids-limit=512 registry.dagger.io/engine:v0.21.9@sha256:3c4e0cedaea400d7e30155e050f94910ea5f381b6f5942dd2172382657628cb4
      - name: Prepare cold hosted check artifacts
        if: runner.environment == 'github-hosted' && steps.affected.outputs.expression != 'set()'
        env:
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
          BASE: ${{ steps.affected.outputs.base }}
        run: |
          echo 'Cold hosted qualification includes artifact preparation and does not meet the warm deployment budget.' >> "$GITHUB_STEP_SUMMARY"
          infra pipeline prepare-check --base "$BASE" --read-only-cache --report-dir dist/reports/preparation
      - name: Check affected targets within aggregate budget
        env:
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://infra-dagger
          BAZEL_REMOTE_CACHE: ${{ runner.environment == 'self-hosted' && 'http://127.0.0.1:9092' || (github.event_name != 'pull_request' && vars.BAZEL_REMOTE_CACHE || '') }}
          BASE: ${{ steps.affected.outputs.base }}
        run: infra pipeline check-fast --base "$BASE" --read-only-cache=${{ github.event_name == 'pull_request' }} --local=${{ runner.environment == 'self-hosted' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: build-reports-${{ github.sha }}
          path: dist/reports
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Dagger engine
        if: always() && runner.environment == 'github-hosted' && steps.affected.outputs.expression != 'set()'
        run: docker rm --force --volumes infra-dagger
  validate:
    needs: cli
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref_protected && github.actor != 'octo-sts[bot]'
    runs-on: check-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Validate infrastructure declarations
        env:
          CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
          BEFORE: ${{ github.event.before }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          "$RUNNER_TEMP/infra-cli/infra" ci validate
