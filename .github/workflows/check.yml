name: Check
'on':
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: infra-check-main
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.event_name ==
      'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && startsWith(vars.INFRA_CI_IMAGE,
      'ghcr.io/fredrir/infra-ci@sha256:') && contains(fromJSON(vars.INFRA_CI_ARCHITECTURES || '[]'), 'amd64')
    runs-on: ${{ format('infra-{0}-{1}', github.repository_id, 'amd64') }}
    container: &id001
      image: ${{ vars.INFRA_CI_IMAGE }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
    - &id002
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: availability
      env:
        CI_AVAILABLE_ARCHITECTURES: ${{ vars.INFRA_CI_ARCHITECTURES }}
      run: python3 scripts/ci/policy.py available
    - run: 'uv sync --frozen --group ci

        uv run --frozen --group ci python scripts/ci/policy.py check

        uv run --frozen --group ci python -m unittest discover -s tests/ci -v

        uv run --frozen --group ci python -m unittest discover -s tests/infra -v

        uv run --frozen --group ci python -m unittest discover -s ansible/tests -v

        uv run --frozen --group ci ansible-playbook -i localhost, ansible/site.yml --syntax-check

        uv run --frozen --group ci python -m tools.infra.cli validate

        uv run --frozen --group ci python -m tools.infra.cli render --check

        uv run --frozen --group ci python scripts/operations/platform_cli.py check

        uv run --frozen --group ci python -m unittest discover -s tests/operations -v

        actionlint

        nix shell --inputs-from . nixpkgs#kubernetes-helm nixpkgs#kubectl nixpkgs#kubeconform --command uv run --frozen
        --group ci python scripts/operations/validate_manifests.py'
    - run: 'nix run --inputs-from . nixpkgs#opentofu -- -chdir=tofu fmt -check -recursive

        nix run --inputs-from . nixpkgs#opentofu -- -chdir=tofu init -backend=false -lockfile=readonly -input=false

        nix run --inputs-from . nixpkgs#opentofu -- -chdir=tofu validate

        nix run --inputs-from . nixpkgs#opentofu -- -chdir=tofu test -filter=tests/platform-mail.tftest.hcl

        nix shell --inputs-from . nixpkgs#opentofu --command python3 scripts/operations/test_mail_module.py --provider-directory tofu/.terraform/providers'
    - env:
        GHCR_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/check_releases.py
    outputs:
      architectures: ${{ steps.availability.outputs.architectures }}
  promote:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.event_name ==
      'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && startsWith(vars.INFRA_CI_IMAGE,
      'ghcr.io/fredrir/infra-ci@sha256:') && contains(fromJSON(vars.INFRA_CI_ARCHITECTURES || '[]'), 'amd64')
    runs-on: ${{ format('infra-{0}-{1}', github.repository_id, 'amd64') }}
    container:
      image: ${{ vars.INFRA_CI_IMAGE }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/promote.py
    needs:
    - validate
    - native
  native:
    if: github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.event_name ==
      'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && startsWith(vars.INFRA_CI_IMAGE,
      'ghcr.io/fredrir/infra-ci@sha256:') && contains(fromJSON(vars.INFRA_CI_ARCHITECTURES || '[]'), 'amd64')
    container: *id001
    timeout-minutes: 45
    runs-on: ${{ format('infra-{0}-{1}', github.repository_id, matrix.architecture) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: ${{ fromJSON(needs.validate.outputs.architectures) }}
    steps:
    - *id002
    - run: python3 scripts/ci/check_nix.py
    needs: validate
