name: Check
on:
  workflow_call:
    inputs:
      cli-artifact:
        type: string
        required: true
      cli-sha256:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      qualify-cold-cache:
        type: boolean
        default: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
concurrency:
  group: infra-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    if: inputs.cli-artifact == ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infra-cli.yml
  check:
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') }}
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN bash -e {0}
    env:
      BAZEL_CACHE_IDENTITY: ${{ github.repository == 'fredrir/infra' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && github.ref_protected && 'bazel-cache-check-writer' || github.repository == 'fredrir/infra' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'bazel-cache-reader' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
      - name: Select affected inputs
        id: affected
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=''
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          expression=$(infra pipeline affected --base "$base")
          printf 'expression=%s\n' "$expression" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: repository-cache
        if: steps.affected.outputs.expression != 'set()'
        with:
          path: ~/.cache/infra-bazel-repository
          key: infra-bazel-repository-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel.lock', 'go.sum') }}
      - uses: ./.github/actions/bazel-cache
        id: bazel-cache
        if: env.BAZEL_CACHE_IDENTITY != '' && steps.affected.outputs.expression != 'set()'
        with:
          identity: ${{ env.BAZEL_CACHE_IDENTITY }}
          client-id: ${{ env.BAZEL_CACHE_IDENTITY == 'bazel-cache-check-writer' && vars.TAILSCALE_BAZEL_CACHE_CHECK_WRITER_CLIENT_ID || vars.TAILSCALE_BAZEL_CACHE_READER_CLIENT_ID }}
      - name: Withhold OIDC token requests from later steps
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL-}${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}"
      - name: Verify pull request cache role
        if: github.event_name == 'pull_request'
        env:
          CACHE_ENDPOINT: ${{ steps.bazel-cache.outputs.endpoint }}
        run: |
          test "$BAZEL_CACHE_IDENTITY" = bazel-cache-reader
          test "$CACHE_ENDPOINT" = grpc://100.87.168.66:9092
      - name: Qualify cache identity and RPC access
        if: vars.BAZEL_CACHE_QUALIFICATION_NONCE != '' && env.BAZEL_CACHE_IDENTITY != '' && steps.affected.outputs.expression != 'set()'
        env:
          ENDPOINT: ${{ steps.bazel-cache.outputs.endpoint }}
          NONCE: ${{ vars.BAZEL_CACHE_QUALIFICATION_NONCE }}
        run: |
          role=reader
          port=9092
          if [ "$BAZEL_CACHE_IDENTITY" = bazel-cache-check-writer ]; then
            role=writer
            port=9093
          fi
          test "$ENDPOINT" = "grpc://100.87.168.66:$port"
          python3 -B .github/scripts/cache_qualification.py "$role" --nonce "$NONCE" --report "$RUNNER_TEMP/cache-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && vars.BAZEL_CACHE_QUALIFICATION_NONCE != '' && env.BAZEL_CACHE_IDENTITY != '' && steps.affected.outputs.expression != 'set()'
        with:
          name: cache-qualification-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-qualification.json
          retention-days: 30
          if-no-files-found: error
      - name: Install checksum-pinned native Bazel
        if: steps.affected.outputs.expression != 'set()'
        run: |
          version=$(jq -er '.bazel' build/toolchain.json)
          checksum=$(jq -er '.bazel_sha256' build/toolchain.json)
          mkdir -p "$RUNNER_TEMP/bazel/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64" --output "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/bazel/bin/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s\n' "$RUNNER_TEMP/bazel/bin" >> "$GITHUB_PATH"
      - name: Prepare affected check artifacts
        if: steps.affected.outputs.expression != 'set()'
        env:
          BAZEL_REMOTE_CACHE: ${{ steps.bazel-cache.outputs.endpoint }}
          BASE: ${{ steps.affected.outputs.base }}
        run: |
          echo 'Artifact preparation is measured separately from the check budget.' >> "$GITHUB_STEP_SUMMARY"
          infra pipeline prepare-check --local --base "$BASE" --read-only-cache=${{ env.BAZEL_CACHE_IDENTITY != 'bazel-cache-check-writer' }} --report-dir dist/reports/preparation
      - name: Require uncached test execution
        id: cold
        if: inputs.qualify-cold-cache == true
        env:
          ENDPOINT: ${{ steps.bazel-cache.outputs.endpoint }}
          BASE: ${{ steps.affected.outputs.base }}
        run: |
          test "$BAZEL_CACHE_IDENTITY" = bazel-cache-check-writer
          test "$ENDPOINT" = grpc://100.87.168.66:9093
          test -z "$BASE"
          python3 -B .github/scripts/cache_cold_qualification.py prepare "$RUNNER_TEMP/bazel-cold"
          printf 'bazel=%s\n' "$RUNNER_TEMP/bazel-cold" >> "$GITHUB_OUTPUT"
      - name: Check affected targets within aggregate budget
        env:
          BAZEL_REMOTE_CACHE: ${{ steps.bazel-cache.outputs.endpoint }}
          BASE: ${{ steps.affected.outputs.base }}
        run: infra ci measure --stage infra-fast --budget 10s --report-dir dist/reports/check-ledger -- infra pipeline check-fast --base "$BASE" --read-only-cache=${{ env.BAZEL_CACHE_IDENTITY != 'bazel-cache-check-writer' }} --local --bazel "${{ steps.cold.outputs.bazel || 'bazel' }}"
      - name: Verify uncached test evidence
        if: always() && inputs.qualify-cold-cache == true
        run: python3 -B .github/scripts/cache_cold_qualification.py verify dist/reports
      - name: Diagnose failed cold tests
        if: failure() && inputs.qualify-cold-cache == true && steps.cold.outputs.bazel != ''
        env:
          ENDPOINT: ${{ steps.bazel-cache.outputs.endpoint }}
        run: |
          mkdir -p dist/reports/cold-diagnostic
          env -i HOME="$HOME" PATH="$PATH" TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-C.UTF-8}" \
            timeout --kill-after=10s 120s bazel test --config=ci \
            --action_env="INFRA_BUILD_IMAGE=$(jq -er '.image' build/toolchain.json)" \
            --repository_cache="$HOME/.cache/infra-bazel-repository" \
            --remote_cache="$ENDPOINT" --remote_cache_compression --remote_timeout=10s --jobs=100 \
            --remote_upload_local_results=false --experimental_build_event_upload_strategy=local \
            --build_tests_only --nocache_test_results --test_arg=-test.v --test_output=all \
            --build_event_json_file=dist/reports/cold-diagnostic/events.jsonl \
            --profile=dist/reports/cold-diagnostic/profile.json.gz \
            //internal/contracts:contracts_test //internal/policy:policy_test \
            //internal/platformops:platformops_test //internal/reconcile:reconcile_test \
            //internal/reconciler:reconciler_test
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !cancelled() && env.BAZEL_CACHE_IDENTITY == 'bazel-cache-check-writer' && steps.repository-cache.outputs.cache-primary-key != '' && steps.repository-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/infra-bazel-repository
          key: ${{ steps.repository-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: build-reports-${{ github.sha }}
          path: dist/reports
          if-no-files-found: warn
          retention-days: 14
  host-access:
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') }}
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/infra-bazel-repository
          key: infra-bazel-repository-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel.lock', 'go.sum') }}
      - name: Install checksum-pinned native Bazel
        run: |
          version=$(jq -er '.bazel' build/toolchain.json)
          checksum=$(jq -er '.bazel_sha256' build/toolchain.json)
          mkdir -p "$RUNNER_TEMP/bazel/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64" --output "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/bazel/bin/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s\n' "$RUNNER_TEMP/bazel/bin" >> "$GITHUB_PATH"
      - name: Select the Ansible checks
        id: affected
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=''
          fi
          expression=$(infra pipeline affected --base "$base")
          affected=''
          if [ "$expression" != 'set()' ]; then
            affected=$(bazel query --repository_cache="$HOME/.cache/infra-bazel-repository" "($expression) intersect set(//internal/reconciler:reconciler_test //internal/reconcile:reconcile_test)" --output=label)
          fi
          hosts=false
          playbooks=false
          if grep -qx '//internal/reconciler:reconciler_test' <<< "$affected"; then hosts=true; fi
          if grep -qx '//internal/reconcile:reconcile_test' <<< "$affected"; then playbooks=true; fi
          printf 'hosts=%s\nplaybooks=%s\n' "$hosts" "$playbooks" >> "$GITHUB_OUTPUT"
      - name: Install the Ansible environment and an OpenSSH server
        if: steps.affected.outputs.hosts == 'true' || steps.affected.outputs.playbooks == 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
          HOSTS: ${{ steps.affected.outputs.hosts }}
        run: |
          infra ci install-tools uv
          "$RUNNER_TEMP/tools/uv" sync --frozen --group ci --no-install-project
          if [ "$HOSTS" = true ] && ! test -x /usr/sbin/sshd; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
          fi
      - name: Reach hosts through a real SSH hop and ProxyJump
        if: steps.affected.outputs.hosts == 'true'
        env:
          INFRA_HOST_ACCESS_TEST: required
        run: bazel run --repository_cache="$HOME/.cache/infra-bazel-repository" @rules_go//go -- test ./internal/reconciler/ -run '^TestHostAccessReachesHostsThroughARealSSHHopAndProxyJump$' -count=1 -v
      - name: Keep the reconciler out of fleet playbooks as Ansible lists them
        if: steps.affected.outputs.playbooks == 'true'
        env:
          INFRA_HOST_ACCESS_TEST: required
        run: bazel run --repository_cache="$HOME/.cache/infra-bazel-repository" @rules_go//go -- test ./internal/reconcile/ -run '^TestFleetPlaybooksNeverListADeclaredReconciler$' -count=1 -v
  alerts:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the alert rule test
        id: affected
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          fi
          run=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && git diff --quiet "$base" HEAD -- platform/components/object-store/ platform/versions.yaml internal/policy/objectstore_alerts_test.go internal/policy/testdata/object-store-alerts.yaml .github/workflows/check.yml; then
            run=false
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned native Bazel
        if: steps.affected.outputs.run == 'true'
        run: |
          version=$(jq -er '.bazel' build/toolchain.json)
          checksum=$(jq -er '.bazel_sha256' build/toolchain.json)
          mkdir -p "$RUNNER_TEMP/bazel/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64" --output "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/bazel/bin/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s\n' "$RUNNER_TEMP/bazel/bin" >> "$GITHUB_PATH"
      - name: Take promtool from the pinned Prometheus image
        if: steps.affected.outputs.run == 'true'
        run: |
          image=$(sed -n 's/^  prometheus: //p' platform/versions.yaml)
          [[ "$image" =~ ^docker\.io/prom/prometheus:v[0-9.]+@sha256:[a-f0-9]{64}$ ]]
          container=$(docker create "$image")
          mkdir -p "$RUNNER_TEMP/promtool"
          docker cp "$container:/bin/promtool" "$RUNNER_TEMP/promtool/promtool"
          docker rm "$container"
          printf '%s\n' "$RUNNER_TEMP/promtool" >> "$GITHUB_PATH"
      - name: Fire object store alerts only on their conditions
        if: steps.affected.outputs.run == 'true'
        env:
          GOTOOLCHAIN: local
          INFRA_PROMTOOL_TEST: required
        run: bazel run @rules_go//go -- test ./internal/policy/ -run '^TestObjectStoreAlertsFireOnlyOnTheirConditions$' -count=1 -v
  validate:
    needs: cli
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') && github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref_protected && github.actor != 'octo-sts[bot]' }}
    runs-on: check-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Prepare declaration dependencies
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
          BEFORE: ${{ github.event.before }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          "$RUNNER_TEMP/infra-cli/infra" ci measure --stage declaration-preparation --budget 5m --report-dir "$RUNNER_TEMP/validation-preparation" -- "$RUNNER_TEMP/infra-cli/infra" ci prepare-validation
      - name: Validate declarations within the check budget
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          "$RUNNER_TEMP/infra-cli/infra" ci measure --stage declarations --budget 10s --report-dir "$RUNNER_TEMP/check-ledger" -- "$RUNNER_TEMP/infra-cli/infra" ci validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: declaration-check-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/check-ledger
            ${{ runner.temp }}/validation-preparation
          if-no-files-found: error
          retention-days: 14
  budget:
    needs: [cli, check, validate]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-reports-${{ github.sha }}"
          path: ${{ runner.temp }}/reports
      - name: Enforce the aggregate check budget
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          mkdir "$RUNNER_TEMP/check-ledger"
          cp "$RUNNER_TEMP/reports/build-reports-$GITHUB_SHA"/check-ledger/*.json "$RUNNER_TEMP/reports/declaration-check-reports-$GITHUB_SHA"/check-ledger/*.json "$RUNNER_TEMP/check-ledger/"
          "$RUNNER_TEMP/infra-cli/infra" ci check-budget --budget 10s --report-dir "$RUNNER_TEMP/check-ledger"
