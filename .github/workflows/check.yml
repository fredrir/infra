# The gate (ADR 019 guardrail 1): every PR and every main push evals the flake,
# builds BOTH host closures, and validates the flat tofu root — with zero
# credentials. All actions are SHA-pinned: this gate is what the `deploy`
# pointer trusts, so its supply chain is load-bearing.
name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Flake check (goldens + eval)
        run: nix flake check
      - name: Build llunde-01 closure
        run: nix build .#nixosConfigurations.llunde-01.config.system.build.toplevel --no-link
      - name: Build llunde-parser closure
        run: nix build .#nixosConfigurations.llunde-parser.config.system.build.toplevel --no-link

  tofu:
    runs-on: ubuntu-latest
    # Without this, every `init` re-downloads all three providers from GitHub's
    # release assets — and an outage there is invisible on GitHub's status page,
    # which tracks a different component. A red gate means NO DEPLOYS, so one
    # such outage froze the estate; the cache turns that into a slow run.
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      # Keyed on the lock file: a provider bump misses the cache and refetches,
      # which is right. SHA-pinned like every action here.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.tofu-plugin-cache
          key: tofu-providers-${{ hashFiles('tofu/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-
      - name: fmt
        run: nix run nixpkgs#opentofu -- -chdir=tofu fmt -check -recursive
      - name: validate (no backend, no credentials)
        run: |
          # The cache dir must exist before init or the setting is ignored.
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          nix run nixpkgs#opentofu -- -chdir=tofu init -backend=false -input=false
          nix run nixpkgs#opentofu -- -chdir=tofu validate
