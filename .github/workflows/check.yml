name: Check
on:
  workflow_call:
    inputs:
      cli-artifact:
        type: string
        required: true
      cli-sha256:
        type: string
        required: true
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
concurrency:
  group: infra-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cli:
    if: inputs.cli-artifact == ''
    uses: ./.github/workflows/infra-cli.yml
  check:
    if: ${{ !cancelled() && (needs.cli.result == 'success' || inputs.cli-artifact != '') }}
    needs: cli
    outputs:
      base: ${{ steps.affected.outputs.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - name: Verify CLI
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          printf '%s\n' "$RUNNER_TEMP/infra-cli" >> "$GITHUB_PATH"
      - name: Select affected inputs
        id: affected
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=''
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          expression=$(infra pipeline affected --base "$base")
          printf 'expression=%s\n' "$expression" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: bazel-cache
        if: steps.affected.outputs.expression != 'set()'
        with:
          path: |
            ~/.cache/infra-bazel-actions
            ~/.cache/infra-bazel-repository
          key: infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-check-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-check-
            infra-bazel-linux-amd64-v1-${{ hashFiles('build/toolchain.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'go.sum', '.bazelrc') }}-
      - name: Install checksum-pinned native Bazel
        if: steps.affected.outputs.expression != 'set()'
        run: |
          version=$(jq -er '.bazel' build/toolchain.json)
          checksum=$(jq -er '.bazel_sha256' build/toolchain.json)
          mkdir -p "$RUNNER_TEMP/bazel/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64" --output "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/bazel/bin/bazel" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/bazel/bin/bazel"
          printf '%s\n' "$RUNNER_TEMP/bazel/bin" >> "$GITHUB_PATH"
      - name: Prepare affected check artifacts
        if: steps.affected.outputs.expression != 'set()'
        env:
          BAZEL_REMOTE_CACHE: ''
          BASE: ${{ steps.affected.outputs.base }}
        run: |
          echo 'Artifact preparation is measured separately from the check budget.' >> "$GITHUB_STEP_SUMMARY"
          infra pipeline prepare-check --local --base "$BASE" --read-only-cache=${{ github.event_name == 'pull_request' }} --report-dir dist/reports/preparation
      - name: Check affected targets within aggregate budget
        env:
          BAZEL_REMOTE_CACHE: ''
          BASE: ${{ steps.affected.outputs.base }}
        run: infra ci measure --stage infra-fast --budget 10s --report-dir dist/reports/check-ledger -- infra pipeline check-fast --base "$BASE" --read-only-cache=${{ github.event_name == 'pull_request' }} --local
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.repository == 'fredrir/infra' && github.ref == 'refs/heads/main' && github.ref_protected && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && steps.affected.outputs.expression != 'set()'
        with:
          path: |
            ~/.cache/infra-bazel-actions
            ~/.cache/infra-bazel-repository
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: build-reports-${{ github.sha }}
          path: dist/reports
          if-no-files-found: warn
          retention-days: 14
  validate:
    needs: [cli, check]
    if: ${{ !cancelled() && needs.check.result == 'success' && github.repository_owner_id == '114402558' && github.repository_id == '1328085692' && github.ref_protected && github.actor != 'octo-sts[bot]' }}
    runs-on: check-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.cli-artifact || needs.cli.outputs.artifact }}
          path: ${{ runner.temp }}/infra-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-reports-${{ github.sha }}
          path: ${{ runner.temp }}/build-reports
      - name: Prepare declaration dependencies
        env:
          CLI_SHA256: ${{ inputs.cli-sha256 || needs.cli.outputs.sha256 }}
          BEFORE: ${{ needs.check.outputs.base }}
        run: |
          printf '%s  %s\n' "$CLI_SHA256" "$RUNNER_TEMP/infra-cli/infra" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/infra-cli/infra"
          "$RUNNER_TEMP/infra-cli/infra" ci measure --stage declaration-preparation --budget 5m --report-dir "$RUNNER_TEMP/validation-preparation" -- "$RUNNER_TEMP/infra-cli/infra" ci prepare-validation
      - name: Validate declarations within remaining check budget
        env:
          BEFORE: ${{ needs.check.outputs.base }}
        run: |
          "$RUNNER_TEMP/infra-cli/infra" ci measure-check --stage declarations --budget 10s --report-dir "$RUNNER_TEMP/build-reports/check-ledger" -- "$RUNNER_TEMP/infra-cli/infra" ci validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: declaration-check-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-reports/check-ledger
            ${{ runner.temp }}/validation-preparation
          if-no-files-found: error
          retention-days: 14
