all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o ControlMaster=no -o ControlPath=none -o ConnectTimeout=10
    ubuntu_release: '26.04'
    firewall_admin_ipv4_cidrs:
    - 62.92.106.173/32
    admin_machines:
      fredrir-01: macie
      fredrir-02: archie
    planned_nodes:
      fredrir-03:
        provider: home
        status: unfinished
      fredrir-10:
        provider: home
        status: unprovisioned
      hidencloud-arm:
        provider: hidencloud
        machine_type: SAR-Torrent
        architecture: arm64
        status: unpurchased
        node_number: null
  children:
    infra_cli_targets:
      hosts:
        fredrir-07: {}
    ubuntu:
      children:
        k3s_cluster:
          children:
            server:
              hosts:
                fredrir-07:
                  infra_binary_url: https://github.com/fredrir/infra/releases/download/infra-v0.1.0/infra-linux-amd64
                  infra_binary_revision: 73a5ca2e6b88b40a6f8c55deae12af4a3e058c78
                  infra_binary_sha256: c37acf10dd13009f61374b9fce811877b2a40c33b34a600a67e0c9e9dc39d0c1
                  ansible_host: "{{ tailscale_ip if infra_reconcile_tailnet | default(false) | bool else public_ipv4 }}"
                  private_ip: 10.60.0.7
                  tailscale_ip: 100.115.121.9
                  provider: hetzner
                  provider_id: '165563054'
                  machine_type: cx33
                  architecture: amd64
                  public_ipv4: 89.167.88.128
                fredrir-08:
                  ansible_host: "{{ tailscale_ip if infra_reconcile_tailnet | default(false) | bool else public_ipv4 }}"
                  private_ip: 10.60.0.8
                  tailscale_ip: 100.96.114.53
                  provider: hetzner
                  provider_id: '165563055'
                  machine_type: cx33
                  architecture: amd64
                  public_ipv4: 89.167.93.100
                fredrir-05:
                  ansible_host: 100.107.74.107
                  private_ip: 10.60.0.5
                  tailscale_ip: 100.107.74.107
                  provider: hetzner
                  provider_id: '132168416'
                  machine_type: cpx22
                  architecture: amd64
                  public_ipv4: 46.62.214.182
            agent:
              hosts:
                fredrir-04:
                  ansible_host: 100.66.14.60
                  tailscale_ip: 100.66.14.60
                  provider: hetzner
                  provider_id: '141119325'
                  machine_type: ccx23
                  architecture: amd64
                  k3s_ci_slots: 1
                  public_ipv4: 95.217.135.164
                fredrir-09:
                  ansible_host: "{{ tailscale_ip if infra_reconcile_tailnet | default(false) | bool else public_ipv4 }}"
                  ansible_user: administrator
                  ci_kata_enabled: true
                  k3s_system_reserved_cpu: 4250m
                  k3s_system_reserved_memory: 10Gi
                  k3s_ci_slots: 3
                  tailscale_ip: 100.87.168.66
                  provider: one.com
                  machine_type: Cloud server XXL
                  architecture: amd64
                  public_ipv4: 85.190.100.72
        external:
          hosts:
            fredrir-06:
              ansible_host: 100.86.241.75
              tailscale_ip: 100.86.241.75
              ansible_ssh_common_args: -o HostKeyAlias=fredrir-06 -o StrictHostKeyChecking=yes -o ControlMaster=no -o
                ControlPath=none -o ConnectTimeout=10
              provider: linode
              machine_type: Nanode 1 GB
              architecture: amd64
              public_ipv4: 172.232.145.251

    build_vm_hosts:
      hosts:
        fredrir-09:
          build_vm_enabled: true
          build_vm_cpu_overhead_millicores: 250
          build_vm_ssh_public_key: "{{ lookup('ansible.builtin.file', playbook_dir + '/files/reconciliation.pub') }}"
    build_engines:
      hosts:
        infra-build-09:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: builder
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: -o ProxyJump=administrator@{{ hostvars['fredrir-09'].tailscale_ip if infra_reconcile_tailnet | default(false) | bool else hostvars['fredrir-09'].public_ipv4 }} -o HostKeyAlias=infra-build-09 -o StrictHostKeyChecking=yes -o ConnectTimeout=10
          build_engine_dedicated: true
          build_engine_qualified: true
          build_engine_cpus: 4
          build_engine_memory: 4g
          build_engine_parallelism: 1
          build_runner_cpus_percent: 400
          build_engine_prewarm_memory: 2G
          build_engine_prewarm_commands:
          - [/usr/local/bin/infra, artifact, prune-source, --keep=16, --max-age=168h]
          - [/usr/local/bin/infra, pipeline, cache-gc, --timeout=30s]
          build_runner_repositories: [infra, Y, llunde-frontend, llunde-backend, llunde-pyparser, packages, nsql, portfolio]
          infra_binary_url: 'https://github.com/fredrir/infra/releases/download/{{ build_runner_cli.tag }}/infra-linux-amd64'
          infra_binary_revision: '{{ build_runner_cli.revision }}'
          infra_binary_sha256: '{{ build_runner_cli.sha256 }}'
