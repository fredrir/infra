- name: Verify dedicated build runners
  hosts: build_engines
  become: true
  gather_facts: false
  check_mode: true
  vars:
    build_runner_cli: "{{ lookup('ansible.builtin.file', playbook_dir + '/../build/cli-release.json') | from_json }}"
    build_runner_fleet: "{{ lookup('ansible.builtin.file', playbook_dir + '/../build/runners.json') | from_json }}"
    build_runner_probed_registrations: "{{ build_runner_probe.stdout_lines | select('match', '^runner ') | map('split') | list }}"
    build_runner_state_repositories: "{{ build_runner_instances | map(attribute='name') | list }}"
    build_runner_state_services: "{{ build_runner_probed_registrations | map('last') | list }}"
  tasks:
  - name: Validate declared engine pin
    ansible.builtin.import_role:
      name: build_engine
      tasks_from: pin.yml

  - name: Probe observed runner host
    ansible.builtin.shell: |
      set -eu
      printf 'cli %s\n' "$(sha256sum < /usr/local/bin/infra | cut -d ' ' -f 1)"
      printf 'slice-reload %s\n' "$(systemctl show --property=NeedDaemonReload --value infra-runners.slice)"
      printf 'engine %s\n' "$(docker inspect --format '{{ "{{.State.Running}} {{.Config.Image}}" }}' {{ build_engine_dagger_name | quote }})"
      cd /home/runner
      for root in *; do
        if [ -e "$root/.runner" ]; then
          printf 'runner %s %s\n' "$root" "$(awk 'NR == 1' "$root/.service" 2>/dev/null || echo -)"
        fi
        if [ -e "$root/.infra-runner-pending" ]; then
          printf 'pending %s\n' "$root"
        fi
      done
    register: build_runner_probe
    changed_when: false
    check_mode: false

  - name: Verify observed runner host
    ansible.builtin.assert:
      that:
      - ('cli ' ~ build_runner_cli.sha256) in build_runner_probe.stdout_lines
      - ('engine true ' ~ build_engine_image) in build_runner_probe.stdout_lines
      - build_runner_probe.stdout_lines | select('match', '^pending ') | list == []
      - "'slice-reload no' in build_runner_probe.stdout_lines"
      - build_runner_probed_registrations | length > 0
      - build_runner_probed_registrations | map(attribute='1') | sort == build_runner_instances | map(attribute='name') | sort
      fail_msg: "The build VM differs from its declared runner host:\n{{ build_runner_probe.stdout }}"

  - name: Verify registered runner services
    ansible.builtin.assert:
      that: item | length == 3 and item[2] == 'actions.runner.' ~ build_runner_owner ~ '-' ~ (build_runner_instances | selectattr('name', 'equalto', item[1]) | map(attribute='repository') | first | default('')) ~ '.' ~ inventory_hostname ~ '-' ~ item[1] ~ '.service'
      fail_msg: "{{ item[1] }} is registered as {{ item[2:] | join(' ') }} instead of its own runner service"
    loop: '{{ build_runner_probed_registrations }}'
    loop_control:
      label: '{{ item[1] }}'

  - name: Compare declared runner state
    notify: Reject declared runner state drift
    block:
    - name: Compare declared runner host state
      ansible.builtin.import_role:
        name: build_runner
        tasks_from: state.yml
    - name: Compare declared repository runner directories
      ansible.builtin.import_role:
        name: build_runner
        tasks_from: repository-directories.yml
    - name: Compare declared repository runner services
      ansible.builtin.import_role:
        name: build_runner
        tasks_from: repository-services.yml
    - name: Compare declared build engine state
      ansible.builtin.import_role:
        name: build_engine
        tasks_from: state.yml

  handlers:
  - name: Reject declared runner state drift
    ansible.builtin.fail:
      msg: The build VM differs from its declared runner state
