- name: Configure K3s servers in bootstrap order
  hosts: server
  order: inventory
  serial: "{{ '100%' if ansible_check_mode else 1 }}"
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    k3s_role: server
  roles:
    - k3s

- name: Configure K3s workers
  hosts: agent:!volatile
  serial: "{{ '100%' if ansible_check_mode else 1 }}"
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    k3s_role: agent
  roles:
    - k3s

- name: Remove previous flannel backends
  hosts: k3s_cluster:!volatile
  become: true
  gather_facts: false
  tasks:
  - name: Remove devices of other flannel backends
    ansible.builtin.import_role:
      name: k3s
      tasks_from: flannel-cleanup.yml
