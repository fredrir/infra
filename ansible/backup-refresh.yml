- name: Refresh dormant standalone backup command
  hosts: backup_refresh
  gather_facts: false
  become: true
  serial: 1
  vars:
    backup_refresh_action: stage
  tasks:
    - name: Check fixed target and bundle
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'fredrir-09'
          - backup_refresh_action in ['stage', 'apply', 'verify', 'rollback']
          - backup_refresh_remote is match('^/var/lib/infra-evacuation/llunde/recurring-backup-deploy-[0-9]{8}T[0-9]{6}Z$')
          - backup_refresh_manifest_sha256 is match('^[a-f0-9]{64}$')
          - backup_refresh_helper_sha256 is match('^[a-f0-9]{64}$')
    - name: Verify local immutable bundle before delivery
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -I
          - -B
          - -c
          - |
            import hashlib, importlib.util, os, stat, sys
            from pathlib import Path
            root, expected, helper_sha = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
            for parent in [*reversed(root.parents), root, root / 'helpers']:
                info = parent.lstat()
                assert stat.S_ISDIR(info.st_mode) and info.st_uid in (0, os.geteuid()) and not stat.S_IMODE(info.st_mode) & 0o022
            path = root / 'helpers/recurring_backup_refresh.py'
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
            with os.fdopen(fd, 'rb') as stream:
                info = os.fstat(stream.fileno())
                assert stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid() and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o600 and 0 < info.st_size < 262144
                raw = stream.read(262145)
            assert hashlib.sha256(raw).hexdigest() == helper_sha
            spec = importlib.util.spec_from_file_location('refresh', path)
            module = importlib.util.module_from_spec(spec)
            exec(compile(raw, str(path), 'exec'), module.__dict__)
            module.verify_bundle(root, expected, owner=os.geteuid())
            print('Verified local immutable refresh bundle')
          - "{{ backup_refresh_local }}"
          - "{{ backup_refresh_manifest_sha256 }}"
          - "{{ backup_refresh_helper_sha256 }}"
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Read target hostname
      ansible.builtin.command:
        argv: [/usr/bin/hostname]
      register: backup_refresh_hostname
      changed_when: false
    - name: Read target machine identity
      ansible.builtin.command:
        argv: [/usr/bin/cat, /etc/machine-id]
      register: backup_refresh_machine
      changed_when: false
    - name: Check target identity
      ansible.builtin.assert:
        that:
          - backup_refresh_hostname.stdout == 'cloud-server-10643982'
          - backup_refresh_machine.stdout == '98b6af13dea54f4081903e96458be24f'
    - name: Check staging destination
      ansible.builtin.stat:
        path: "{{ backup_refresh_remote }}"
        follow: false
      register: backup_refresh_destination
      when: backup_refresh_action == 'stage'
    - name: Refuse existing staging destination
      ansible.builtin.assert:
        that: not backup_refresh_destination.stat.exists
      when: backup_refresh_action == 'stage'
    - name: Create fresh private bundle directory
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -c
          - |
            import os, stat, sys
            path = sys.argv[1]
            fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY)
            try:
                for part in path.split('/')[1:-1]:
                    child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                    os.close(fd)
                    fd = child
                    info = os.fstat(fd)
                    assert info.st_uid == 0 and not stat.S_IMODE(info.st_mode) & 0o022
                os.mkdir(path.split('/')[-1], 0o700, dir_fd=fd)
                os.fsync(fd)
            finally:
                os.close(fd)
          - "{{ backup_refresh_remote }}"
      when: backup_refresh_action == 'stage'
      changed_when: true
    - name: Deliver immutable backup refresh bundle
      ansible.builtin.copy:
        src: "{{ backup_refresh_local }}/"
        dest: "{{ backup_refresh_remote }}/"
        owner: root
        group: root
        mode: "0600"
        directory_mode: "0700"
      when: backup_refresh_action == 'stage'
    - name: Verify helper and complete bundle before dependency import
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import hashlib, importlib.util, os, stat, sys
            from pathlib import Path
            root, expected, helper_sha = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
            for parent in [*reversed(root.parents), root, root / 'helpers']:
                info = parent.lstat()
                assert stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not stat.S_IMODE(info.st_mode) & 0o022
            path = root / 'helpers/recurring_backup_refresh.py'
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
            with os.fdopen(fd, 'rb') as stream:
                info = os.fstat(stream.fileno())
                assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o600 and 0 < info.st_size < 262144
                raw = stream.read(262145)
            assert hashlib.sha256(raw).hexdigest() == helper_sha
            spec = importlib.util.spec_from_file_location('refresh', path)
            module = importlib.util.module_from_spec(spec)
            exec(compile(raw, str(path), 'exec'), module.__dict__)
            module.verify_bundle(root, expected)
            print('Verified immutable refresh bundle')
          - "{{ backup_refresh_remote }}"
          - "{{ backup_refresh_manifest_sha256 }}"
          - "{{ backup_refresh_helper_sha256 }}"
      changed_when: false
    - name: Execute bounded dormant refresh operation
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - -i
          - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          - HOME=/root
          - LC_ALL=C
          - PYTHONDONTWRITEBYTECODE=1
          - /usr/bin/systemd-run
          - --collect
          - --wait
          - --pipe
          - --service-type=exec
          - "--unit=infra-backup-refresh-{{ backup_refresh_action }}-{{ backup_refresh_manifest_sha256[:12] }}"
          - --property=RuntimeMaxSec=120s
          - --property=TimeoutStopSec=15s
          - --property=KillMode=control-group
          - --property=MemoryMax=256M
          - --property=MemorySwapMax=0
          - --property=CPUQuota=100%
          - --property=TasksMax=64
          - --property=NoNewPrivileges=true
          - /usr/bin/python3
          - -B
          - "{{ backup_refresh_remote }}/helpers/recurring_backup_refresh.py"
          - "{{ backup_refresh_action }}"
          - --bundle
          - "{{ backup_refresh_remote }}"
          - --manifest-sha256
          - "{{ backup_refresh_manifest_sha256 }}"
      when: backup_refresh_action != 'stage'
      changed_when: backup_refresh_action in ['apply', 'rollback']
