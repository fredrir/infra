all:
  children:
    build_vm_hosts:
      hosts:
        fredrir-09:
          build_vm_enabled: false
          build_vm_ssh_public_key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
          k3s_system_reserved_cpu: 4250m
          k3s_system_reserved_memory: 10Gi
    build_engines:
      hosts:
        infra-build-09:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: builder
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: -o ProxyJump=administrator@85.190.100.72 -o HostKeyAlias=infra-build-09 -o StrictHostKeyChecking=yes -o ConnectTimeout=10
          build_engine_dedicated: true
          build_engine_qualified: false
          build_engine_cpus: 4
          build_engine_memory: 4g
          build_engine_parallelism: 2
          build_engine_prewarm_memory: 512M
          build_engine_prewarm_commands:
          - [/usr/local/bin/infra, pipeline, cache-gc, --timeout=30s]
          - [/usr/local/bin/infra, pipeline, prepare-check, --local, --timeout=5m, --report-dir=/home/runner/prewarm-reports]
          build_runner_repositories: [infra, Y, llunde-frontend, llunde-backend, llunde-pyparser, packages, nsql, portfolio]
          infra_binary_url: 'https://github.com/fredrir/infra/releases/download/{{ build_runner_cli.tag }}/infra-linux-amd64'
          infra_binary_revision: '{{ build_runner_cli.revision }}'
          infra_binary_sha256: '{{ build_runner_cli.sha256 }}'
