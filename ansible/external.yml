- name: Configure independent infrastructure monitoring
  hosts: external
  become: true
  gather_facts: true
  vars:
    platform_architecture: "{{ architecture }}"
  roles:
    - ubuntu
  tasks:
    - name: Preserve the enrolled transport
      ansible.builtin.import_role:
        name: tailscale
        tasks_from: enrolled.yml

    - name: Configure host network access
      ansible.builtin.import_role:
        name: firewall

    - name: Configure host secret decryption
      ansible.builtin.import_role:
        name: host_secrets
      tags: [gatus, verification_trigger]

    - name: Configure infrastructure checks
      ansible.builtin.import_role:
        name: gatus
      tags: [gatus]

    - name: Configure hourly verification requests
      ansible.builtin.import_role:
        name: verification_trigger
      tags: [verification_trigger]
