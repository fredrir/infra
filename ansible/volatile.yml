- name: Configure volatile workers
  hosts: volatile
  become: true
  gather_facts: false
  strategy: linear
  vars:
    k3s_role: agent
    platform_architecture: "{{ architecture }}"
  pre_tasks:
  - name: Skip volatile workers without an enrolled address
    ansible.builtin.meta: end_host
    when: tailscale_ip is none
  - name: Gather volatile worker facts
    ansible.builtin.setup:
  - name: Require an enrolled identity
    ansible.builtin.stat:
      path: /var/lib/tailscale/tailscaled.state
      get_checksum: false
    register: volatile_transport_state
    no_log: true
  - name: Preserve enrolled transport
    ansible.builtin.assert:
      that:
      - volatile_transport_state.stat.isreg | default(false)
      - volatile_transport_state.stat.size > 0
  - name: Configure Tailscale
    ansible.builtin.import_role:
      name: tailscale
      tasks_from: install.yml
  - name: Refresh changed transport facts
    ansible.builtin.setup:
      gather_subset: ['!all', '!min', network]
    when: platform_tailscale_start.changed or (platform_tailscale_restart.changed | default(false))
  - name: Read SSH account
    ansible.builtin.getent:
      database: passwd
      key: '{{ ansible_user }}'
  - name: Create SSH directory
    ansible.builtin.file:
      path: '{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh'
      state: directory
      owner: '{{ ansible_user }}'
      mode: '0700'
  - name: Install reconciliation identity
    ansible.builtin.lineinfile:
      path: '{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys'
      line: '{{ lookup("ansible.builtin.file", "files/reconciliation.pub") }}'
      create: true
      owner: '{{ ansible_user }}'
      mode: '0600'
  - name: Read the fleet flannel backends through the administrator API
    ansible.builtin.command:
      argv:
        - /usr/local/bin/k3s
        - kubectl
        - get
        - nodes
        - -l
        - '!node-restriction.kubernetes.io/volatile'
        - '-o=jsonpath={range .items[*]}{.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type}{";"}{.metadata.annotations.flannel\.alpha\.coreos\.com/backend-data}{"\n"}{end}'
        - --request-timeout=10s
    delegate_to: "{{ k3s_registration_server }}"
    changed_when: false
    check_mode: false
    register: volatile_fleet_backends
  - name: Require the fleet on verified WireGuard before enrolling a volatile worker
    ansible.builtin.assert:
      that:
        - k3s_flannel_backend == 'wireguard-native'
        - volatile_fleet_backends.stdout_lines | length > 0
        - (volatile_fleet_backends.stdout_lines | select('search', '^wireguard;.*\"PublicKey\":\"[^\"]+\"') | list | length) == (volatile_fleet_backends.stdout_lines | length)
      fail_msg: >-
        Every fleet node must publish a verified wireguard-native key before fredrir-10 joins;
        complete the flannel WireGuard cutover first, and for any later flannel clear cut fredrir-10
        off the API before clearing (docs/runbook.md).
  roles:
  - ubuntu
  - firewall
  - no_container_engines
  - data_volume
  - k3s
  - ci_runtime
  tasks:
  - name: Remove devices of other flannel backends
    ansible.builtin.import_role:
      name: k3s
      tasks_from: flannel-cleanup.yml
