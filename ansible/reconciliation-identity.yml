- name: Maintain reconciliation host access
  hosts: ubuntu:build_engines:!volatile
  become: true
  gather_facts: false
  tasks:
  - name: Read SSH account
    ansible.builtin.getent:
      database: passwd
      key: '{{ ansible_user }}'
  - name: Create SSH directory
    ansible.builtin.file:
      path: '{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh'
      state: directory
      owner: '{{ ansible_user }}'
      mode: '0700'
  - name: Require the reconciler public key
    ansible.builtin.assert:
      that: lookup('ansible.builtin.file', 'files/reconciliation.pub') is match('^ssh-ed25519 [A-Za-z0-9+/=]+( .*)?$')
      fail_msg: ansible/files/reconciliation.pub must hold fredrir-11's public key
  - name: Install reconciliation identity
    ansible.builtin.lineinfile:
      path: '{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys'
      line: '{{ lookup("ansible.builtin.file", "files/reconciliation.pub") }}'
      create: true
      owner: '{{ ansible_user }}'
      mode: '0600'
  - name: Remove the retired hosted reconciliation identity
    ansible.builtin.lineinfile:
      path: '{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys'
      regexp: '^ssh-ed25519[ \t]+AAAAC3NzaC1lZDI1NTE5AAAAIOJJbFoC1uYIOgoEHEnAbmR2NFIN57yJp3yBjVyZuEiZ([ \t]|$)'
      state: absent
