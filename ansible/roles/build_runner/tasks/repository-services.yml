- name: Create runner resource override directory
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.d'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ build_runner_state_services }}'

- name: Place repository runner in bounded resource slice
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.d/resources.conf'
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Slice=infra-runners.slice
      UMask=0022
      PrivateTmp=true
      ProtectProc=invisible
      ProtectHome=tmpfs
      BindPaths=/home/runner-{{ build_runner_service_slug }}
      NoNewPrivileges=true
      RestrictSUIDSGID=true
      EnvironmentFile=/etc/infra-dagger/{{ build_runner_service_slug }}.env
      Environment=INFRA_SCANNER_DATABASES={{ build_runner_scanner_databases }}
      Environment=INFRA_RUNNER_ADMISSION_SOCKET=/run/infra-runner-admission.d/{{ build_runner_service_slug }}/admission.sock
      Environment=ACTIONS_RUNNER_HOOK_JOB_STARTED=/usr/local/libexec/infra-runner-hook.sh
      {% if build_runner_admission_enabled | bool %}
      Environment=ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/usr/local/libexec/infra-runner-completed.sh
      {% endif %}
      Environment=CI_POOL=main
  vars:
    build_runner_service_slug: "{{ build_runner_instances | selectattr('name', 'equalto', item | regex_replace('^actions[.]runner[.].+[.]' ~ (inventory_hostname | regex_escape) ~ '-', '') | regex_replace('[.]service$', '')) | map(attribute='slug') | first }}"
  loop: '{{ build_runner_state_services }}'
  register: build_runner_service_override

- name: Start registered runner
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    daemon_reload: '{{ build_runner_resource_slice.changed or build_runner_service_install.changed | default(false) or build_runner_service_override.changed }}'
    state: started
  loop: '{{ build_runner_state_services }}'

- name: Find stale runner services
  ansible.builtin.shell: |
    set -eu
    for unit in {{ build_runner_state_services | map('quote') | join(' ') }}; do
      slug=$(sed -n 's|^EnvironmentFile=/etc/infra-dagger/\(.*\)[.]env$|\1|p' "/etc/systemd/system/$unit.d/resources.conf")
      started=$(systemctl show --timestamp=us+utc --property=ActiveEnterTimestamp --value "$unit")
      if [ -z "$started" ] || [ "$(systemctl show --property=NeedDaemonReload --value "$unit")" = yes ] ||
        [ -n "$(find "/etc/systemd/system/$unit.d/resources.conf" "/etc/infra-dagger/$slug.env" -newermt "$started")" ]; then
        echo "$unit"
      fi
    done
  register: build_runner_stale_services
  changed_when: false
  check_mode: false

- name: Restart stale runner service
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: restarted
  loop: '{{ build_runner_stale_services.stdout_lines | union(build_runner_state_restarts | default([])) }}'
