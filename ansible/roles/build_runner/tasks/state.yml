- name: Install runner dependencies
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ build_runner_packages }}"

- name: Declare unattended patching
  ansible.builtin.import_role:
    name: host_patching

- name: Start dedicated Docker engine
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create trusted runner account
  ansible.builtin.user:
    name: runner
    groups: docker
    shell: /bin/bash
    create_home: true

- name: Install aggregate runner resource limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/infra-runners.slice
    owner: root
    group: root
    mode: '0644'
    content: |
      [Slice]
      CPUQuota={{ build_runner_cpus_percent }}%
      MemoryMax={{ build_runner_memory }}
      TasksMax=4096
  register: build_runner_resource_slice

- name: Find stale runner slice
  ansible.builtin.command:
    argv: [systemctl, show, --property=NeedDaemonReload, --value, infra-runners.slice]
  register: build_runner_stale_slice
  changed_when: false
  check_mode: false

- name: Reload stale runner slice
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: build_runner_stale_slice.stdout == 'yes'

- name: Create trusted hook adapter directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install immutable trusted-job hook adapter
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-hook.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      set -eu
      CI_POOL=main /usr/local/bin/infra platform runner-hook
      {% if build_runner_admission_enabled | bool %}
      exec /usr/local/bin/infra platform runner-admission acquire --capacity={{ build_runner_job_slots | int }}
      {% endif %}

- name: Install runner admission runtime directory
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/infra-runner-admission.conf
    content: "d /run/infra-runner-admission 0700 runner runner -\n"
    owner: root
    group: root
    mode: '0644'

- name: Create runner admission runtime directory
  ansible.builtin.file:
    path: /run/infra-runner-admission
    state: directory
    owner: runner
    group: runner
    mode: '0700'

- name: Install job completion hook
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-completed.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      exec /usr/local/bin/infra platform runner-admission release --timeout=30s
