- name: Install runner dependencies
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ build_runner_packages }}"

- name: Declare unattended patching
  ansible.builtin.import_role:
    name: host_patching

- name: Start dedicated Docker engine
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create runner admission group
  ansible.builtin.group:
    name: infra-runners
    system: true

- name: Create trusted runner account
  ansible.builtin.user:
    name: runner
    groups: [docker, infra-runners]
    shell: /bin/bash
    create_home: true

- name: Install aggregate runner resource limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/infra-runners.slice
    owner: root
    group: root
    mode: '0644'
    content: |
      [Slice]
      CPUQuota={{ build_runner_cpus_percent }}%
      MemoryMax={{ build_runner_memory }}
      TasksMax=4096
  register: build_runner_resource_slice

- name: Find stale runner slice
  ansible.builtin.command:
    argv: [systemctl, show, --property=NeedDaemonReload, --value, infra-runners.slice]
  register: build_runner_stale_slice
  changed_when: false
  check_mode: false

- name: Reload stale runner slice
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: build_runner_stale_slice.stdout == 'yes'

- name: Require the installed CLI's admission broker
  ansible.builtin.command:
    argv: [/usr/local/bin/infra, platform, runner-admission, serve, --help]
  register: build_runner_admission_cli
  changed_when: false
  failed_when: build_runner_admission_cli.rc != 0 or 'runner-admission serve [flags]' not in build_runner_admission_cli.stdout
  check_mode: false

- name: Create trusted hook adapter directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install runner admission runtime directory
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/infra-runner-admission.conf
    content: "d /run/infra-runner-admission 0700 root root -\n"
    owner: root
    group: root
    mode: '0644'

- name: Create runner admission runtime directory
  ansible.builtin.file:
    path: /run/infra-runner-admission
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Give the admission broker its leases
  ansible.builtin.file:
    path: /run/infra-runner-admission
    state: directory
    owner: root
    group: root
    recurse: true

- name: Install runner admission broker
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item.name }}'
    owner: root
    group: root
    mode: '0644'
    content: '{{ item.content }}'
  loop:
  - name: infra-runner-admission.socket
    content: |
      [Socket]
      ListenStream=/run/infra-runner-admission.sock
      SocketUser=root
      SocketGroup=infra-runners
      SocketMode=0660

      [Install]
      WantedBy=sockets.target
  - name: infra-runner-admission.service
    content: |
      [Unit]
      Requires=infra-runner-admission.socket
      After=infra-runner-admission.socket

      [Service]
      ExecStart=/usr/local/bin/infra platform runner-admission serve --capacity={{ build_runner_job_slots | int }} --directory=/run/infra-runner-admission
      Restart=always
      RestartSec=1
      CapabilityBoundingSet=
      NoNewPrivileges=true
      PrivateNetwork=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=strict
      ReadWritePaths=/run/infra-runner-admission
      MemoryMax=128M
      TasksMax=256
  loop_control:
    label: '{{ item.name }}'
  register: build_runner_admission_units

- name: Listen for runner admission
  ansible.builtin.systemd_service:
    name: infra-runner-admission.socket
    enabled: true
    daemon_reload: '{{ build_runner_admission_units.changed }}'
    state: started

- name: Find stale runner admission units
  ansible.builtin.shell: |
    set -eu
    for unit in infra-runner-admission.socket infra-runner-admission.service; do
      [ "$(systemctl show --property=ActiveState --value "$unit")" = active ] || continue
      started=$(systemctl show --timestamp=us+utc --property=ActiveEnterTimestamp --value "$unit")
      inputs="/etc/systemd/system/$unit"
      if [ "$unit" = infra-runner-admission.service ]; then inputs="$inputs $(readlink -f /usr/local/bin/infra)"; fi
      if [ "$(systemctl show --property=NeedDaemonReload --value "$unit")" = yes ] || [ -n "$(find $inputs -newermt "$started")" ]; then
        echo "$unit"
      fi
    done
  register: build_runner_stale_admission
  changed_when: false
  check_mode: false

- name: Restart stale runner admission units
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: restarted
  loop: '{{ build_runner_stale_admission.stdout_lines }}'

- name: Install immutable trusted-job hook adapter
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-hook.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      set -eu
      CI_POOL=main /usr/local/bin/infra platform runner-hook
      {% if build_runner_admission_enabled | bool %}
      exec /usr/local/bin/infra platform runner-admission acquire
      {% endif %}

- name: Install job completion hook
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-completed.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      exec /usr/local/bin/infra platform runner-admission release --timeout=30s

- name: Create guest metric directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install cgroup metric writer
  ansible.builtin.copy:
    src: infra-cgroup-metrics
    dest: /usr/local/libexec/infra-cgroup-metrics
    owner: root
    group: root
    mode: '0555'

- name: Install guest metric units
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item.name }}.service'
    owner: root
    group: root
    mode: '0644'
    content: '{{ item.content }}'
  loop:
  - name: infra-node-exporter
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/opt/{{ build_runner_node_exporter_release }}/node_exporter --web.listen-address=:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      DynamicUser=true
      Restart=on-failure
      RestartSec=5
      MemoryMax=128M
      CPUQuota=25%

      [Install]
      WantedBy=multi-user.target
  - name: infra-cgroup-metrics
    content: |
      [Service]
      ExecStart=/usr/local/libexec/infra-cgroup-metrics
      Restart=always
      RestartSec=5
      CapabilityBoundingSet=
      NoNewPrivileges=true
      PrivateNetwork=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ProtectControlGroups=true
      ReadWritePaths=/var/lib/node_exporter/textfile_collector
      UMask=0022
      MemoryMax=32M
      CPUQuota=10%

      [Install]
      WantedBy=multi-user.target
  loop_control:
    label: '{{ item.name }}'
  register: build_runner_metric_units

- name: Start guest metric services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    daemon_reload: '{{ build_runner_metric_units.changed }}'
    state: started
  loop: [infra-node-exporter, infra-cgroup-metrics]

- name: Find stale guest metric services
  ansible.builtin.shell: |
    set -eu
    for unit in infra-node-exporter infra-cgroup-metrics; do
      started=$(systemctl show --timestamp=us+utc --property=ActiveEnterTimestamp --value "$unit")
      if [ -z "$started" ] || [ "$(systemctl show --property=NeedDaemonReload --value "$unit")" = yes ] ||
        [ -n "$(find "/etc/systemd/system/$unit.service" "/usr/local/libexec/$unit" -newermt "$started" 2>/dev/null)" ]; then
        echo "$unit"
      fi
    done
  register: build_runner_stale_metric_services
  changed_when: false
  check_mode: false

- name: Restart stale guest metric services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: restarted
  loop: '{{ build_runner_stale_metric_services.stdout_lines }}'
