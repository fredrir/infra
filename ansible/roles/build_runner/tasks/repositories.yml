- name: Probe repository runners
  ansible.builtin.shell: |
    set -eu
    for root in {{ build_runner_instances | map(attribute='root') | map('quote') | join(' ') }}; do
      (
        version=$("$root/bin/Runner.Listener" --version 2>/dev/null) || version=-
        service=$(head -n 1 "$root/.service" 2>/dev/null) || service=-
        registration=unregistered
        if [ -e "$root/.runner" ]; then registration=registered; fi
        replacement=complete
        if [ -e "$root/.infra-runner-pending" ]; then replacement=pending; fi
        printf '%s %s %s %s %s\n' "${root##*/}" "$registration" "$replacement" "${version:--}" "${service:--}"
      ) &
    done
    wait
  register: build_runner_instance_probe
  changed_when: false
  check_mode: false

- name: Select converged repository runners
  ansible.builtin.set_fact:
    build_runner_converged: >-
      {%- set converged = [] -%}
      {%- for line in build_runner_instance_probe.stdout_lines -%}
      {%- set name, registration, replacement, version, service = line.split() -%}
      {%- set repository = build_runner_instances | selectattr('name', 'equalto', name) | map(attribute='repository') | first -%}
      {%- if registration == 'registered' and replacement == 'complete' and version == build_runner_version
            and service == 'actions.runner.' ~ build_runner_owner ~ '-' ~ repository ~ '.' ~ inventory_hostname ~ '-' ~ name ~ '.service'
            and name not in build_runner_reregister | default([]) -%}
      {%- set _ = converged.append({'name': name, 'service': service}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ converged }}

- name: Declare converged repository runner directories
  ansible.builtin.import_tasks: repository-directories.yml
  vars:
    build_runner_state_repositories: "{{ build_runner_instances | selectattr('name', 'in', build_runner_converged | map(attribute='name') | list) | list }}"

- name: Declare converged repository runner services
  ansible.builtin.import_tasks: repository-services.yml
  vars:
    build_runner_state_services: "{{ build_runner_converged | map(attribute='service') | list }}"
    build_runner_state_restarts: "{{ build_runner_converged | selectattr('name', 'in', build_runner_restart | default([])) | map(attribute='service') | list }}"

- name: Replace or register repository runners
  ansible.builtin.include_tasks: repository.yml
  loop: "{{ build_runner_instances | rejectattr('name', 'in', build_runner_converged | map(attribute='name') | list) | list }}"
  loop_control:
    loop_var: build_runner_instance
    label: '{{ build_runner_instance.name }}'

- name: Find listener checkouts unreadable to image users
  ansible.builtin.shell: |
    set -eu
    {% for instance in build_runner_instances %}
    if [ -d {{ (instance.root ~ '/_work') | quote }} ] && [ -s {{ (instance.root ~ '/.service') | quote }} ] \
      && ! pgrep --full {{ ((instance.root ~ '/bin/Runner.Worker') | regex_escape ~ '( |$)') | quote }} > /dev/null \
      && [ -n "$(find {{ (instance.root ~ '/_work') | quote }} -path {{ (instance.root ~ '/_work/_temp') | quote }} -prune -o ! -perm -o=r -print -quit)" ]; then
      printf '%s %s\n' {{ instance.root | quote }} "$(head -n 1 {{ (instance.root ~ '/.service') | quote }})"
    fi
    {% endfor %}
  register: build_runner_unreadable_checkouts
  changed_when: false
  check_mode: false

- name: Replace listener checkouts unreadable to image users
  ansible.builtin.command:
    argv:
    - sh
    - -c
    - |
      set -eu
      if pgrep --full "$3" > /dev/null; then exit 0; fi
      systemctl stop "$2"
      rm -rf "$1/_work"
      systemctl start "$2"
      echo replaced
    - replace
    - '{{ item.split()[0] }}'
    - '{{ item.split()[1] }}'
    - "{{ (item.split()[0] ~ '/bin/Runner.Worker') | regex_escape ~ '( |$)' }}"
  loop: '{{ build_runner_unreadable_checkouts.stdout_lines }}'
  register: build_runner_replaced_checkouts
  changed_when: "'replaced' in build_runner_replaced_checkouts.stdout"
