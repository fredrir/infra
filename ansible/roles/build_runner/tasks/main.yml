- name: Require trusted dedicated runner guest
  ansible.builtin.assert:
    that:
    - build_engine_dedicated | bool
    - build_engine_qualified | bool
    - ansible_facts.system == 'Linux'
    - ansible_facts.architecture == 'x86_64'
    - ansible_facts.virtualization_role == 'guest'
    - inventory_hostname not in groups.get('k3s_cluster', [])
    - build_runner_owner == 'fredrir'
    - build_runner_repositories | length > 0
    - build_runner_repositories | difference(['infra', 'Y', 'llunde-frontend', 'llunde-backend', 'llunde-pyparser', 'packages', 'nsql', 'portfolio']) | length == 0
    - build_runner_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    - build_runner_sha256 is match('^[a-f0-9]{64}$')
    - build_runner_memory is match('^[1-9][0-9]*G$')
    - build_runner_job_slots | int >= 1
    - build_runner_job_slots | int <= 8
    - build_runner_cpus_percent | int >= 1
    - build_runner_cpus_percent | int <= 400
    - build_runner_labels | select('match', '^[a-zA-Z0-9_-]+$') | list | length == build_runner_labels | length

- name: Wait for cloud initialization
  ansible.builtin.command:
    argv: [cloud-init, status, --wait]
  changed_when: false
  timeout: 120

- name: Install runner dependencies
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ build_runner_packages }}"

- name: Declare unattended patching
  ansible.builtin.import_role:
    name: host_patching

- name: Start dedicated Docker engine
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create trusted runner account
  ansible.builtin.user:
    name: runner
    groups: docker
    shell: /bin/bash
    create_home: true

- name: Install aggregate runner resource limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/infra-runners.slice
    owner: root
    group: root
    mode: '0644'
    content: |
      [Slice]
      CPUQuota={{ build_runner_cpus_percent }}%
      MemoryMax={{ build_runner_memory }}
      TasksMax=4096
  register: build_runner_resource_slice

- name: Create trusted hook adapter directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install immutable trusted-job hook adapter
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-hook.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      set -eu
      CI_POOL=main /usr/local/bin/infra platform runner-hook
      {% if build_runner_admission_enabled | bool %}
      exec /usr/local/bin/infra platform runner-admission acquire --capacity={{ build_runner_job_slots | int }}
      {% endif %}

- name: Install runner admission runtime directory
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/infra-runner-admission.conf
    content: "d /run/infra-runner-admission 0700 runner runner -\n"
    owner: root
    group: root
    mode: '0644'

- name: Create runner admission runtime directory
  ansible.builtin.file:
    path: /run/infra-runner-admission
    state: directory
    owner: runner
    group: runner
    mode: '0700'

- name: Install job completion hook
  ansible.builtin.copy:
    dest: /usr/local/libexec/infra-runner-completed.sh
    owner: root
    group: root
    mode: '0555'
    content: |
      #!/bin/sh
      exec /usr/local/bin/infra platform runner-admission release --timeout=30s

- name: Download verified runner archive
  ansible.builtin.get_url:
    url: 'https://github.com/actions/runner/releases/download/v{{ build_runner_version }}/actions-runner-linux-x64-{{ build_runner_version }}.tar.gz'
    dest: '/var/cache/actions-runner-{{ build_runner_version }}.tar.gz'
    checksum: 'sha256:{{ build_runner_sha256 }}'
    owner: root
    group: root
    mode: '0644'
    timeout: 30
  register: build_runner_archive

- name: Find superseded runner archives
  ansible.builtin.find:
    paths: /var/cache
    patterns: 'actions-runner-*.tar.gz'
  register: build_runner_archives
  when: build_runner_archive.changed

- name: Remove superseded runner archives
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ build_runner_archives.files | default([]) | rejectattr('path', 'equalto', build_runner_archive.dest) | list }}"
  loop_control:
    label: '{{ item.path }}'
  when: build_runner_archive.changed

- name: Configure repository runners
  ansible.builtin.include_tasks: repository.yml
  loop: '{{ build_runner_repositories }}'
  loop_control:
    loop_var: build_runner_repository
