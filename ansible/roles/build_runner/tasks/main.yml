- name: Require trusted dedicated runner guest
  ansible.builtin.assert:
    that:
    - build_engine_dedicated | bool
    - build_engine_qualified | bool
    - ansible_facts.system == 'Linux'
    - ansible_facts.architecture == 'x86_64'
    - ansible_facts.virtualization_role == 'guest'
    - inventory_hostname not in groups.get('k3s_cluster', [])
    - inventory_hostname == build_runner_fleet.host
    - build_runner_repositories.keys() | difference(build_runner_fleet.repositories.keys()) | length == 0
    - build_runner_repositories.values() | min >= 1
    - build_runner_repositories.values() | max <= 8
    - build_runner_accounts | map(attribute='slug') | unique | length == build_runner_accounts | length
    - build_runner_accounts | map(attribute='slug') | select('match', '^[a-z][a-z0-9-]{0,24}$') | list | length == build_runner_accounts | length
    - build_runner_memory is match('^[1-9][0-9]*G$')
    - build_runner_job_slots | int >= 1
    - build_runner_job_slots | int <= 8
    - build_runner_cpus_percent | int >= 1
    - build_runner_cpus_percent | int <= ansible_facts.processor_vcpus | int * 100
    - build_runner_node_exporter_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    - build_runner_node_exporter_sha256 is match('^[a-f0-9]{64}$')

- name: Wait for cloud initialization
  ansible.builtin.command:
    argv: [cloud-init, status, --wait]
  changed_when: false
  timeout: 120

- name: Install verified node exporter
  ansible.builtin.import_tasks: node-exporter.yml

- name: Declare runner host state
  ansible.builtin.import_tasks: state.yml

- name: Restart replaced node exporter
  ansible.builtin.systemd_service:
    name: infra-node-exporter
    state: restarted
  when: build_runner_node_exporter_extraction.changed

- name: Download verified runner archive
  ansible.builtin.get_url:
    url: 'https://github.com/actions/runner/releases/download/v{{ build_runner_version }}/actions-runner-linux-x64-{{ build_runner_version }}.tar.gz'
    dest: '/var/cache/actions-runner-{{ build_runner_version }}.tar.gz'
    checksum: 'sha256:{{ build_runner_sha256 }}'
    owner: root
    group: root
    mode: '0644'
    timeout: 30
  register: build_runner_archive

- name: Find superseded runner archives
  ansible.builtin.find:
    paths: /var/cache
    patterns: 'actions-runner-*.tar.gz'
  register: build_runner_archives
  when: build_runner_archive.changed

- name: Remove superseded runner archives
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ build_runner_archives.files | default([]) | rejectattr('path', 'equalto', build_runner_archive.dest) | list }}"
  loop_control:
    label: '{{ item.path }}'
  when: build_runner_archive.changed

- name: Retire listeners outside their declared roots
  ansible.builtin.import_tasks: retire.yml

- name: Configure repository runners
  ansible.builtin.import_tasks: repositories.yml
