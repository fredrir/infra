- name: Create repository runner directory
  ansible.builtin.file:
    path: '/home/runner/{{ build_runner_repository }}'
    state: directory
    owner: runner
    group: runner
    mode: '0750'

- name: Read runner registration
  ansible.builtin.stat:
    path: '/home/runner/{{ build_runner_repository }}/.runner'
  register: build_runner_registration

- name: Extract pinned runner
  ansible.builtin.unarchive:
    src: '/var/cache/actions-runner-{{ build_runner_version }}.tar.gz'
    dest: '/home/runner/{{ build_runner_repository }}'
    remote_src: true
    owner: runner
    group: runner
    creates: '/home/runner/{{ build_runner_repository }}/bin/Runner.Listener'

- name: Obtain single-use runner registration token
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv: [gh, api, --method, POST, 'repos/{{ build_runner_owner }}/{{ build_runner_repository }}/actions/runners/registration-token', --jq, .token]
  register: build_runner_token
  changed_when: false
  no_log: true
  when: not build_runner_registration.stat.exists

- name: Register trusted repository runner
  become_user: runner
  ansible.builtin.command:
    argv:
    - '/home/runner/{{ build_runner_repository }}/config.sh'
    - --unattended
    - --disableupdate
    - --url
    - 'https://github.com/{{ build_runner_owner }}/{{ build_runner_repository }}'
    - --token
    - '{{ build_runner_token.stdout }}'
    - --name
    - '{{ inventory_hostname }}-{{ build_runner_repository }}'
    - --labels
    - '{{ build_runner_labels | join(",") }}'
    - --work
    - _work
    chdir: '/home/runner/{{ build_runner_repository }}'
  no_log: true
  when: not build_runner_registration.stat.exists

- name: Install repository runner service
  ansible.builtin.command:
    argv: ['/home/runner/{{ build_runner_repository }}/svc.sh', install, runner]
    chdir: '/home/runner/{{ build_runner_repository }}'
    creates: '/home/runner/{{ build_runner_repository }}/.service'
  register: build_runner_service_install

- name: Read installed service name
  ansible.builtin.slurp:
    src: '/home/runner/{{ build_runner_repository }}/.service'
  register: build_runner_service_file

- name: Select runner service
  ansible.builtin.set_fact:
    build_runner_service_name: '{{ build_runner_service_file.content | b64decode | trim }}'

- name: Create runner resource override directory
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ build_runner_service_name }}.d'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Place repository runner in bounded resource slice
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ build_runner_service_name }}.d/resources.conf'
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Slice=infra-runners.slice
      Environment=ACTIONS_RUNNER_HOOK_JOB_STARTED=/usr/local/libexec/infra-runner-hook.sh
      Environment=CI_POOL=main
      Environment=BAZEL_REMOTE_CACHE=http://127.0.0.1:9092
      Environment=_EXPERIMENTAL_DAGGER_RUNNER_HOST=docker-container://infra-dagger
  register: build_runner_service_override

- name: Start registered runner
  ansible.builtin.systemd_service:
    name: '{{ build_runner_service_name }}'
    enabled: true
    daemon_reload: '{{ build_runner_resource_slice.changed or build_runner_service_install.changed or build_runner_service_override.changed }}'
    state: '{{ "restarted" if build_runner_service_override.changed else "started" }}'

- name: Select engine runner service
  ansible.builtin.set_fact:
    build_engine_runner_service: '{{ build_runner_service_name }}'
