build_runner_repositories: '{{ build_runner_fleet.repositories }}'
build_runner_accounts: >-
  {%- set accounts = [] -%}
  {%- for repository in build_runner_repositories.keys() | sort -%}
  {%- set slug = repository | lower -%}
  {%- set _ = accounts.append({'repository': repository, 'slug': slug, 'account': 'runner-' ~ slug, 'home': '/home/runner-' ~ slug, 'engine_group': 'infra-dagger-' ~ slug}) -%}
  {%- endfor -%}
  {{ accounts }}
build_runner_instances: >-
  {%- set instances = [] -%}
  {%- for account in build_runner_accounts -%}
  {%- for index in range(1, build_runner_repositories[account.repository] | int + 1) -%}
  {%- set name = account.repository ~ '-' ~ index -%}
  {%- set _ = instances.append({'repository': account.repository, 'slug': account.slug, 'account': account.account, 'name': name, 'root': account.home ~ '/' ~ name}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ instances }}
build_runner_fleet_roots: >-
  {%- set roots = [] -%}
  {%- for repository, count in build_runner_fleet.repositories.items() -%}
  {%- for index in range(1, count | int + 1) -%}
  {%- set _ = roots.append('/home/runner-' ~ (repository | lower) ~ '/' ~ repository ~ '-' ~ index) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ roots }}
build_runner_scanner_databases: /var/lib/infra-scanner/databases
build_runner_owner: '{{ build_runner_fleet.owner }}'
build_runner_version: '{{ build_runner_fleet.version }}'
build_runner_sha256: '{{ build_runner_fleet.sha256 }}'
build_runner_labels: '{{ build_runner_fleet.labels }}'
build_runner_memory: 2G
build_runner_job_slots: 1
build_runner_drain_minutes: 50
build_runner_drain_interval: 10
build_runner_admission_enabled: true
build_runner_cpus_percent: 400
build_runner_packages: [docker.io, git, curl, jq, libicu74, build-essential, unattended-upgrades]
build_runner_node_exporter_version: 1.12.1
build_runner_node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
build_runner_node_exporter_release: 'node_exporter-{{ build_runner_node_exporter_version }}.linux-amd64'
build_runner_node_exporter_verify: >-
  test "$(tar -xzOf /var/cache/{{ build_runner_node_exporter_release }}.tar.gz {{ build_runner_node_exporter_release }}/node_exporter | sha256sum)"
  = "$(sha256sum < /opt/{{ build_runner_node_exporter_release }}/node_exporter)"
