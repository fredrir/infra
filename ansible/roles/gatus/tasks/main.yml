- name: Require the verified monitor architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'x86_64'
      - gatus_address is match('^100\.')

- name: Create monitor configuration and artifact directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [/etc/gatus, /var/cache/gatus]

- name: Inspect the cached upstream binary layer
  ansible.builtin.stat:
    path: /var/cache/gatus/binary.tar.gz
    checksum_algorithm: sha256
  register: gatus_layer

- name: Read the public upstream artifact token
  ansible.builtin.uri:
    url: https://auth.docker.io/token?service=registry.docker.io&scope=repository:twinproduction/gatus:pull
    return_content: true
  register: gatus_registry
  check_mode: false
  retries: 1
  delay: 5
  when: gatus_layer.stat.checksum | default('') != gatus_archive_sha256
  no_log: true

- name: Download the pinned upstream binary layer
  ansible.builtin.get_url:
    url: "https://registry-1.docker.io/v2/twinproduction/gatus/blobs/sha256:{{ gatus_archive_sha256 }}"
    dest: /var/cache/gatus/binary.tar.gz
    checksum: "sha256:{{ gatus_archive_sha256 }}"
    headers:
      Authorization: "Bearer {{ gatus_registry.json.token | default('') }}"
    unredirected_headers: [Authorization]
    owner: root
    group: root
    mode: "0600"
    timeout: 60
  no_log: true

- name: Compare the extracted binary with the pinned executable
  ansible.builtin.stat:
    path: /var/cache/gatus/gatus
    checksum_algorithm: sha256
  register: gatus_extracted
  changed_when: gatus_extracted.stat.checksum | default('') != gatus_binary_sha256

- name: Extract the upstream binary
  ansible.builtin.unarchive:
    src: /var/cache/gatus/binary.tar.gz
    dest: /var/cache/gatus
    remote_src: true
    include: [gatus]
  register: gatus_extraction
  when: gatus_extracted.changed

- name: Verify the upstream binary
  ansible.builtin.stat:
    path: /var/cache/gatus/gatus
    checksum_algorithm: sha256
  register: gatus_binary
  when: gatus_extraction.changed

- name: Require the pinned executable
  ansible.builtin.assert:
    that: gatus_binary.stat.checksum == gatus_binary_sha256
  when: gatus_extraction.changed

- name: Install Gatus
  ansible.builtin.copy:
    src: /var/cache/gatus/gatus
    dest: /usr/local/bin/gatus
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Gatus

- name: Install the encrypted monitor secrets
  ansible.builtin.import_role:
    name: host_secrets
    tasks_from: install.yml
  vars:
    host_secrets_src: secrets.sops.yaml
    host_secrets_dest: /etc/gatus/secrets.sops.yaml
    host_secrets_handlers: [Restart Gatus]

- name: Install monitor settings
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/gatus/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart Gatus

- name: Install monitor service
  ansible.builtin.template:
    src: gatus.service.j2
    dest: /etc/systemd/system/gatus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Gatus

- name: Apply monitor changes
  ansible.builtin.meta: flush_handlers

- name: Enable the independent monitor
  ansible.builtin.systemd_service:
    name: gatus
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the monitor listener
  ansible.builtin.wait_for:
    host: "{{ gatus_address }}"
    port: "{{ gatus_port }}"
    timeout: 45
  check_mode: false

- name: Verify monitor readiness
  ansible.builtin.uri:
    url: "http://{{ gatus_address }}:{{ gatus_port }}/health"
    status_code: 200
    use_proxy: false
  register: gatus_ready
  check_mode: false
  until: gatus_ready.status == 200
  retries: 6
  delay: 2
