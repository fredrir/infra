web:
    address: 100.86.241.75
    port: 8080
concurrency: 2
storage:
    type: sqlite
    path: /var/lib/gatus/gatus.db
    maximum-number-of-results: 100
    maximum-number-of-events: 50
alerting:
    email:
        from: alerts@fredrir.com
        host: email-smtp.eu-north-1.amazonaws.com
        password: ENC[AES256_GCM,data:isacc1fNhNATv8N1hL7AbCACeKuQchTpyCLFCc19wvcs/BWfe5H7TPP8qdA=,iv:m1k7Hsh5bCOVl2C8m+MNbFZhhBB4wUFVqpsSZD44z2s=,tag:77o77D/ruMbNCqacj7wEnA==,type:str]
        port: 587
        to: fhansteen@gmail.com
        username: ENC[AES256_GCM,data:y0BdkWdLWSCd5LXcy4v+P48J4a4=,iv:f3H+Ok2FrazHMqIspC0Nfx8eKsgHnIHfDCCyq84A9Ck=,tag:nBNFPNeDmAFDKNbvdBvEug==,type:str]
        client:
            insecure: false
        default-alert:
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
endpoints:
    - name: llunde
      group: applications
      url: https://llunde.no/
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
    - name: llunde-api-auth
      group: applications
      url: https://api.llunde.no/health
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 403'
      alerts:
        - type: email
    - name: parser-access
      group: applications
      url: https://parser.llunde.no/
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 302'
      alerts:
        - type: email
    - name: parser-external
      group: applications
      url: https://external.llunde.no/
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 404'
      alerts:
        - type: email
    - name: portfolio
      group: applications
      url: https://hansteen.dev/
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: false
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
    - name: portfolio-origin-auth
      group: applications
      url: https://origin.hansteen.dev/readyz
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 403'
      alerts:
        - type: email
    - name: "y"
      group: applications
      url: https://yeeter.no/
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
    - name: y-health
      group: applications
      url: https://yeeter.no/healthz
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
    - name: y-api
      group: applications
      url: https://yeeter.no/graphql?query=%7B__typename%7D
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 200'
        - '[BODY].data.__typename == Query'
      alerts:
        - type: email
      headers:
        x-apollo-operation-name: health
    - name: grafana-login
      group: applications
      url: https://grafana.fredrir.com/login
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 200'
      alerts:
        - type: email
    - name: grafana-auth
      group: applications
      url: https://grafana.fredrir.com/api/user
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 401'
      alerts:
        - type: email
    - name: logs-redirect
      group: applications
      url: https://fredrir.com/logs
      interval: 1m
      client:
        timeout: 10s
        ignore-redirect: true
      conditions:
        - '[STATUS] == 302'
      alerts:
        - type: email
