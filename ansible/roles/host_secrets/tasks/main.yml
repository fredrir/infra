- name: Install the age key generator
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ host_secrets_packages }}"

- name: Create the private host key directory
  ansible.builtin.file:
    path: "{{ host_secrets_key | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the host age key
  ansible.builtin.command:
    argv: [age-keygen, -o, "{{ host_secrets_key }}"]
    creates: "{{ host_secrets_key }}"

- name: Read the host age recipient
  ansible.builtin.command:
    argv: [age-keygen, -y, "{{ host_secrets_key }}"]
  register: host_secrets_recipient
  changed_when: false
  check_mode: false

- name: Report the host age recipient
  ansible.builtin.assert:
    that: host_secrets_recipient.stdout is match('^age1[0-9a-z]{58}$')
    success_msg: "{{ inventory_hostname }} {{ host_secrets_recipient.stdout }}"
