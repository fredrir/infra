- name: Read dispatcher unit files
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [infra-verification-request.timer, infra-verification-request.service]
  register: dispatcher_units

- name: Stop dispatcher units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ dispatcher_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Remove dispatcher files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/infra-verification-request.timer
    - /etc/systemd/system/infra-verification-request.service
    - /etc/infra-verification
    - /run/infra-verification-request
    - /usr/local/bin/infra
  register: dispatcher_files

- name: Reload dispatcher removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: dispatcher_files.changed
