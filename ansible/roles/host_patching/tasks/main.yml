- name: Enable unattended security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    validate: apt-config -c %s dump

- name: Limit unattended upgrades to security updates without reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52infra-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      #clear Unattended-Upgrade::Allowed-Origins;
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    validate: apt-config -c %s dump

- name: Create service restart policy directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Keep platform services out of automatic restarts
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/infra.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      $nrconf{override_rc}{qr(^(k3s|k3s-agent|tailscaled|docker|containerd|infra-build-vm)\.service$)} = 0;
      $nrconf{override_rc}{qr(^actions\.runner\..+\.service$)} = 0;
    validate: perl -c %s
