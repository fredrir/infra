- name: Install bounded engine cache retention
  ansible.builtin.template:
    src: infra-dagger.toml.j2
    dest: /etc/infra-dagger.toml
    owner: root
    group: root
    mode: '0644'

- name: Install Dagger unit
  ansible.builtin.template:
    src: infra-dagger.service.j2
    dest: /etc/systemd/system/infra-dagger.service
    owner: root
    group: root
    mode: '0644'
  register: build_engine_dagger_unit

- name: Start build engine
  ansible.builtin.systemd_service:
    name: infra-dagger
    daemon_reload: '{{ build_engine_dagger_unit.changed }}'
    enabled: true
    state: started

- name: Find stale build engine
  ansible.builtin.shell: |
    set -eu
    started=$(systemctl show --timestamp=us+utc --property=ActiveEnterTimestamp --value infra-dagger)
    image=$(docker container inspect --format '{{ "{{.Config.Image}}" }}' {{ build_engine_dagger_name | quote }} 2>/dev/null || true)
    if [ -z "$started" ] || [ "$(systemctl show --property=NeedDaemonReload --value infra-dagger)" = yes ] ||
      { [ -n "$image" ] && [ "$image" != {{ build_engine_image | quote }} ]; } ||
      [ -n "$(find /etc/infra-dagger.toml /etc/systemd/system/infra-dagger.service -newermt "$started")" ]; then
      echo infra-dagger
    fi
  register: build_engine_stale
  changed_when: false
  check_mode: false

- name: Restart stale build engine
  ansible.builtin.systemd_service:
    name: infra-dagger
    daemon_reload: true
    state: restarted
  when: build_engine_stale.stdout_lines | length > 0
