- name: Require a qualified dedicated VM
  ansible.builtin.assert:
    that:
    - build_engine_dedicated | bool
    - build_engine_qualified | bool
    - build_engine_trust == 'trusted'
    - ansible_facts.system == 'Linux'
    - ansible_facts.architecture == 'x86_64'
    - inventory_hostname not in groups.get('k3s_cluster', [])
    - build_engine_cpus | int >= 1
    - build_engine_cpus | int <= ansible_facts.processor_vcpus | int
    - build_engine_memory is match('^[1-9][0-9]*g$')
    - build_engine_memory[:-1] | int * 1024 <= ansible_facts.memtotal_mb | int
    - build_engine_pids | int >= 256
    - build_engine_pids | int <= 8192
    - build_engine_parallelism | int >= 1
    - build_engine_parallelism | int <= build_engine_cpus | int
    - build_engine_dagger_cache_gib | int >= 4
    - build_engine_named_cache_hours | int >= 1
    - build_engine_named_cache_hours | int <= 168
    - build_engine_gc_emergency_free_gib | int >= 1
    - build_engine_gc_free_gib | int > build_engine_gc_emergency_free_gib | int
    - build_engine_dagger_name == 'infra-dagger'

- name: Read engine pin
  ansible.builtin.set_fact:
    build_engine_image: "{{ (lookup('ansible.builtin.file', playbook_dir + '/../build/toolchain.json') | from_json).engine_image }}"

- name: Validate engine pin
  ansible.builtin.assert:
    that:
    - build_engine_image is match('^registry.dagger.io/engine:v[0-9.]+@sha256:[a-f0-9]{64}$')

- name: Inspect pinned engine image
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, '{{ "{{.Id}}" }}', '{{ build_engine_image }}']
  register: build_engine_local_image
  changed_when: false
  failed_when: build_engine_local_image.rc not in [0, 1]
  check_mode: false

- name: Pull missing pinned engine image
  ansible.builtin.command:
    argv: [docker, pull, '{{ build_engine_image }}']
  when: build_engine_local_image.rc != 0
  register: build_engine_pull
  changed_when: "'Downloaded newer image' in build_engine_pull.stdout"

- name: Install bounded engine cache retention
  ansible.builtin.template:
    src: infra-dagger.toml.j2
    dest: /etc/infra-dagger.toml
    owner: root
    group: root
    mode: '0644'
  notify: Restart infra-dagger

- name: Install Dagger unit
  ansible.builtin.template:
    src: infra-dagger.service.j2
    dest: /etc/systemd/system/infra-dagger.service
    owner: root
    group: root
    mode: '0644'
  register: build_engine_dagger_unit
  notify: Restart infra-dagger

- name: Start build engine
  ansible.builtin.systemd_service:
    name: infra-dagger
    daemon_reload: '{{ build_engine_dagger_unit.changed }}'
    enabled: true
    state: started

- name: Read retired prewarming timer
  ansible.builtin.stat:
    path: /etc/systemd/system/infra-build-prewarm.timer
  register: build_engine_prewarm_timer

- name: Stop retired prewarming timer
  ansible.builtin.systemd_service:
    name: infra-build-prewarm.timer
    state: stopped
    enabled: false
  when: build_engine_prewarm_timer.stat.exists

- name: Remove retired prewarming state
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
  - /etc/systemd/system/infra-build-prewarm.timer
  - /etc/systemd/system/infra-build-prewarm.service
  - /var/lib/infra/build
  - /home/runner/.cache/infra/source-cli
  register: build_engine_prewarm_removed

- name: Reload units without retired prewarming
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: build_engine_prewarm_removed.changed

- name: Read retired Bazel cache unit
  ansible.builtin.stat:
    path: /etc/systemd/system/infra-bazel-cache.service
  register: build_engine_bazel_cache_unit

- name: Stop retired Bazel cache
  ansible.builtin.systemd_service:
    name: infra-bazel-cache
    state: stopped
    enabled: false
  when: build_engine_bazel_cache_unit.stat.exists

- name: Inspect retired Bazel cache container and volume
  ansible.builtin.command:
    argv: [docker, '{{ item }}', inspect, infra-bazel-cache]
  loop: [container, volume]
  register: build_engine_bazel_cache_objects
  changed_when: false
  failed_when: build_engine_bazel_cache_objects.rc not in [0, 1]
  check_mode: false

- name: Remove retired Bazel cache container and volume
  ansible.builtin.command:
    argv: [docker, '{{ item.item }}', rm, --force, infra-bazel-cache]
  loop: '{{ build_engine_bazel_cache_objects.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: item.rc == 0

- name: Find retired Bazel cache images
  ansible.builtin.command:
    argv: [docker, image, ls, --quiet, --filter, reference=buchgr/bazel-remote-cache]
  register: build_engine_bazel_cache_images
  changed_when: false
  check_mode: false

- name: Remove retired Bazel cache images
  ansible.builtin.command:
    argv: "{{ ['docker', 'image', 'rm', '--force'] + build_engine_bazel_cache_images.stdout_lines | unique }}"
  when: build_engine_bazel_cache_images.stdout_lines | length > 0

- name: Remove retired native Bazel state
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
  - /etc/systemd/system/infra-bazel-cache.service
  - /usr/local/bin/bazel
  - /etc/bazel.bazelrc
  - /var/cache/infra/bazel-repo
  register: build_engine_bazel_removed

- name: Reload units without retired Bazel cache
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: build_engine_bazel_removed.changed
