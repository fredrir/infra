- name: Restart infra-dagger
  ansible.builtin.systemd_service:
    name: infra-dagger
    daemon_reload: true
    state: restarted

- name: Restart infra-bazel-cache
  ansible.builtin.systemd_service:
    name: infra-bazel-cache
    daemon_reload: true
    state: restarted

- name: Restart build prewarming
  ansible.builtin.systemd_service:
    name: infra-build-prewarm.timer
    daemon_reload: true
    state: '{{ "restarted" if build_engine_prewarm_commands | length > 0 else "stopped" }}'
