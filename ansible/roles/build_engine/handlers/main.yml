- name: Restart build engines
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: restarted
  loop:
  - infra-dagger
  - infra-bazel-cache

- name: Restart build prewarming
  ansible.builtin.systemd_service:
    name: infra-build-prewarm.timer
    daemon_reload: true
    state: '{{ "restarted" if build_engine_prewarm_commands | length > 0 else "stopped" }}'
