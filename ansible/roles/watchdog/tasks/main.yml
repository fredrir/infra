- name: Require supported external host
  ansible.builtin.assert:
    that:
      - ansible_facts.service_mgr == 'systemd'
      - ansible_facts.os_family == 'Debian'
      - platform_watchdog_config_file is match('^/(run|var/lib)/')

- name: Inspect watchdog runtime configuration
  ansible.builtin.stat:
    path: "{{ platform_watchdog_config_file }}"
  register: platform_watchdog_config
  no_log: true

- name: Require private watchdog credentials
  ansible.builtin.assert:
    that:
      - platform_watchdog_config.stat.exists
      - platform_watchdog_config.stat.isreg
      - platform_watchdog_config.stat.uid == 0
      - platform_watchdog_config.stat.mode in ['0400', '0600']
  no_log: true

- name: Install watchdog runtime
  ansible.builtin.apt:
    name: [python3, ca-certificates]
    state: present
    update_cache: true

- name: Install external watchdog
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../modules/platform/watchdog.py"
    dest: /usr/local/lib/platform-watchdog.py
    owner: root
    group: root
    mode: '0644'

- name: Install watchdog service
  ansible.builtin.template:
    src: watchdog.service.j2
    dest: /etc/systemd/system/platform-watchdog.service
    owner: root
    group: root
    mode: '0644'

- name: Install watchdog timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/platform-watchdog.timer
    mode: '0644'
    content: |
      [Unit]
      Description=External infrastructure check schedule
      [Timer]
      OnBootSec=2m
      OnUnitActiveSec=5m
      RandomizedDelaySec=15s
      [Install]
      WantedBy=timers.target

- name: Enable external watchdog timer
  ansible.builtin.systemd_service:
    name: platform-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
