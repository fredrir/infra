- name: Create transport artifact directory
  ansible.builtin.file:
    path: /var/lib/platform
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install verified transport binaries
  ansible.builtin.include_tasks: tailscale-install.yml

- name: Install transport service
  ansible.builtin.template:
    src: tailscaled.service.j2
    dest: /etc/systemd/system/tailscaled.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart bootstrap Tailscale

- name: Find unloaded tunnel support
  ansible.builtin.shell: |
    set -eu
    if [ ! -e /sys/class/misc/tun ]; then
      modprobe --dry-run tun
      echo tun
    fi
  register: platform_tailscale_tun
  changed_when: platform_tailscale_tun.stdout != ''
  check_mode: false

- name: Load tunnel support
  ansible.builtin.command:
    argv: [modprobe, tun]
  when: platform_tailscale_tun.changed

- name: Inspect tunnel device
  ansible.builtin.stat:
    path: /dev/net/tun
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: platform_bootstrap_tun

- name: Require kernel tunnel support
  ansible.builtin.assert:
    that: platform_bootstrap_tun.stat.ischr | default(false)

- name: Apply transport service changes
  ansible.builtin.meta: flush_handlers

- name: Start transport service
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true
  register: platform_tailscale_start
