- name: Check bootstrap inputs
  ansible.builtin.include_tasks: tailscale-bootstrap-contract.yml

- name: Inspect K3s artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - /usr/local/bin/k3s
    - /usr/bin/k3s
    - /etc/rancher/k3s/config.yaml
    - /var/lib/rancher/k3s
    - /etc/systemd/system/k3s.service
    - /etc/systemd/system/k3s-agent.service
  register: platform_bootstrap_k3s

- name: Inspect runtime credential metadata
  ansible.builtin.stat:
    path: "{{ platform_tailscale_auth_key_file }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: platform_bootstrap_key
  no_log: true

- name: Check bootstrap credential and host state
  ansible.builtin.include_tasks: tailscale-bootstrap-credentials.yml

- name: Install transport
  ansible.builtin.include_tasks: install.yml

- name: Enroll restricted transport identity
  ansible.builtin.include_tasks: tailscale-bootstrap-enroll.yml
  when: not ansible_check_mode

