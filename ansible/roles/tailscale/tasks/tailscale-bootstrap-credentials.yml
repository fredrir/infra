- name: Require a new host and protected runtime credential
  ansible.builtin.assert:
    that:
      - platform_bootstrap_k3s.results | selectattr('stat.exists') | list | length == 0
      - platform_bootstrap_key.stat.exists
      - platform_bootstrap_key.stat.isreg | default(false)
      - not (platform_bootstrap_key.stat.islnk | default(true))
      - platform_bootstrap_key.stat.uid | default(-1) == 0
      - platform_bootstrap_key.stat.mode | default('') in ['0400', '0600']
      - platform_bootstrap_key.stat.nlink | default(0) == 1
      - 0 < platform_bootstrap_key.stat.size | default(0) <= 4096
    fail_msg: Bootstrap requires no K3s artifacts and a root-owned private regular runtime key file

