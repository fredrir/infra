- name: Require the supported host and network
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == ubuntu_release
      - ansible_facts.architecture in k3s_artifacts
      - k3s_role in ['server', 'agent']
      - tailscale_ip in ansible_facts.all_ipv4_addresses
      - ansible_facts.tailscale0.mtu == 1280
      - k3s_role != 'server' or private_ip in ansible_facts.all_ipv4_addresses
      - k3s_server_token_file != k3s_agent_token_file

- name: Require an inventory control server for registration
  ansible.builtin.assert:
    that:
      - k3s_registration_server in groups['server']
  tags: [registration-check, worker-labels]

- name: Verify the selected registration server API and datastore
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, --raw=/readyz, --request-timeout=15s]
  delegate_to: "{{ k3s_registration_server }}"
  changed_when: false
  check_mode: false
  retries: 1
  delay: 5
  when: inventory_hostname != k3s_registration_server
  tags: [registration-check, worker-labels]

- name: Inspect protected join credentials
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: "{{ inventory_hostname in groups.get('volatile', []) }}"
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ [k3s_server_token_file, k3s_agent_token_file] if k3s_role == 'server' else [k3s_agent_token_file] }}"
  register: k3s_credentials

- name: Require existing private token files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode == '0600'
      - item.stat.size > 0
  loop: "{{ k3s_credentials.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the shared join token
  ansible.builtin.stat:
    path: "{{ k3s_agent_token_file }}"
    checksum_algorithm: sha256
    get_mime: false
  delegate_to: "{{ k3s_registration_server }}"
  when: inventory_hostname in groups.get('volatile', [])
  register: k3s_shared_token

- name: Require a per-node join token on volatile workers
  ansible.builtin.assert:
    that: k3s_shared_token.stat.checksum != (k3s_credentials.results | last).stat.checksum
    fail_msg: Volatile workers join with their own k3s token create --ttl token
  when: inventory_hostname in groups.get('volatile', [])

- name: Search volatile state for the shared join token
  ansible.builtin.shell: |
    set -eu
    find /var/lib/rancher -type f -print0 | while IFS= read -r -d '' file; do
      if [ "$(sha256sum < "$file" | cut -d' ' -f1)" = "{{ k3s_shared_token.stat.checksum }}" ]; then echo "$file"; fi
    done
  when: inventory_hostname in groups.get('volatile', [])
  register: k3s_shared_token_leak
  changed_when: k3s_shared_token_leak.stdout_lines | length > 0
  check_mode: false

- name: Require no shared join token on volatile workers
  ansible.builtin.assert:
    that: k3s_shared_token_leak.stdout_lines | length == 0
    fail_msg: "Shared join token found on the volatile worker: {{ k3s_shared_token_leak.stdout_lines | join(', ') }}"
  when: inventory_hostname in groups.get('volatile', [])

- name: Install kernel module configuration
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: "overlay\nbr_netfilter\nvxlan\nwireguard\n"

- name: Find unloaded kernel modules
  ansible.builtin.shell: |
    set -eu
    for module in overlay br_netfilter vxlan wireguard; do
      if [ ! -d "/sys/module/$module" ]; then
        modprobe --dry-run "$module"
        if modprobe --dry-run --first-time "$module" 2>/dev/null; then echo "$module"; fi
      fi
    done
  register: k3s_unloaded_modules
  changed_when: k3s_unloaded_modules.stdout_lines | length > 0
  check_mode: false

- name: Load kernel modules
  ansible.builtin.command:
    argv: [modprobe, "{{ item }}"]
  loop: "{{ k3s_unloaded_modules.stdout_lines }}"

- name: Configure Kubernetes kernel settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-k3s.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
      vm.overcommit_memory=1
      vm.panic_on_oom=0
      kernel.panic=10
      kernel.panic_on_oops=1
  register: k3s_sysctl

- name: Apply Kubernetes kernel settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-k3s.conf
  changed_when: true
  when: k3s_sysctl.changed

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write native K3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: k3s_configuration
  tags: [capacity]

- name: Download the pinned K3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/{{ k3s_artifacts[ansible_facts.architecture].file }}"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_artifacts[ansible_facts.architecture].sha256 }}"
    owner: root
    group: root
    mode: "0755"
  register: k3s_binary

- name: Install the upstream service
  ansible.builtin.import_tasks: upstream-service.yml

- name: Create the service dependency directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ k3s_service }}.service.d"
    state: directory
    mode: "0755"

- name: Order K3s after its existing transport
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ k3s_service }}.service.d/transport.conf"
    mode: "0644"
    content: |
      [Unit]
      Requires=tailscaled.service
      After=tailscaled.service network-online.target
  register: k3s_transport

- name: Point flannel at the persisted WireGuard key
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ k3s_service }}.service.d/flannel.conf"
    mode: "0644"
    content: |
      [Service]
      Environment=WIREGUARD_KEY_FILE={{ k3s_flannel_key_file }}
  when: k3s_flannel_backend == 'wireguard-native'
  register: k3s_flannel_environment

- name: Remove the WireGuard key location from other flannel backends
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ k3s_service }}.service.d/flannel.conf"
    state: absent
  when: k3s_flannel_backend != 'wireguard-native'
  register: k3s_flannel_environment_removal

- name: Inspect the persisted flannel WireGuard key
  ansible.builtin.stat:
    path: "{{ k3s_flannel_key_file }}"
    get_checksum: false
    get_mime: false
  register: k3s_flannel_key

- name: Read the registration server state
  ansible.builtin.command:
    argv: [systemctl, show, k3s.service, --property=ActiveState, --value]
  changed_when: false
  check_mode: false
  register: k3s_registration_state
  when: inventory_hostname == k3s_registration_server

- name: Read the flannel backend of the node through the administrator API
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - --ignore-not-found
      - -o=jsonpath={.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type}
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  check_mode: false
  retries: 6
  delay: 5
  when: inventory_hostname != k3s_registration_server or k3s_registration_state.stdout == 'active'
  register: k3s_flannel_state
  changed_when: >-
    k3s_flannel_state.stdout != '' and (k3s_flannel_state.stdout != k3s_flannel_backend_types[k3s_flannel_backend]
    or (k3s_flannel_backend == 'wireguard-native' and not k3s_flannel_key.stat.exists))

- name: Read enrolled volatile workers through the administrator API
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - nodes
      - -o=json
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  check_mode: false
  changed_when: false
  retries: 6
  delay: 5
  until: k3s_volatile_nodes.rc == 0
  when: k3s_flannel_state is not skipped and inventory_hostname not in groups.get('volatile', [])
  register: k3s_volatile_nodes

- name: Refuse to clear or first-register flannel while a volatile worker can race the API
  vars:
    k3s_volatile_node_names: >-
      {{ ((k3s_volatile_nodes.stdout | from_json)['items']
      | selectattr('spec.taints', 'defined') | selectattr('spec.taints', 'search', 'node-restriction.kubernetes.io/volatile')
      | map(attribute='metadata.name') | list)
      + ((k3s_volatile_nodes.stdout | from_json)['items']
      | selectattr('metadata.labels', 'defined') | selectattr('metadata.labels', 'search', 'node-restriction.kubernetes.io/volatile')
      | map(attribute='metadata.name') | list) }}
    k3s_enrolled_volatile_hosts: "{{ groups.get('volatile', []) | map('extract', hostvars, 'tailscale_ip') | select | list }}"
  ansible.builtin.assert:
    that: >-
      not (k3s_flannel_state.changed or k3s_flannel_state.stdout == '')
      or (k3s_volatile_node_names | length == 0
      and (k3s_enrolled_volatile_hosts | length == 0 or volatile_api_cut_off | default(false) | bool))
    fail_msg: >-
      A volatile worker is enrolled and this run would clear or first-set {{ inventory_hostname }}'s flannel backend,
      reopening the write-once race; cut every volatile worker off the API first (remove tag:platform-volatile's 6443
      grant or deauthorize its tailnet node, stop its agent, then delete its Node object), then rerun with
      -e volatile_api_cut_off=true — see docs/runbook.md.
  when: k3s_volatile_nodes is not skipped

- name: Release the previous flannel backend through the administrator API
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - annotate
      - node
      - "{{ inventory_hostname }}"
      - flannel.alpha.coreos.com/backend-type-
      - flannel.alpha.coreos.com/backend-data-
      - flannel.alpha.coreos.com/backend-v6-data-
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  when: k3s_flannel_state.changed

- name: Enable and reconcile K3s
  ansible.builtin.systemd_service:
    name: "{{ k3s_service }}"
    enabled: true
    daemon_reload: true
    state: >-
      {{ 'restarted' if k3s_configuration.changed or (k3s_binary | default({})).get('changed', false)
      or (k3s_transport | default({})).get('changed', false) or k3s_flannel_state.changed
      or k3s_flannel_environment.changed or k3s_flannel_environment_removal.changed else 'started' }}
  tags: [capacity]

- name: Compare the upstream service with its declared command
  ansible.builtin.shell: |
    set -eu
    unit={{ k3s_service }}.service
    property() { systemctl show "$unit" --property="$1" --value; }
    [ "$(property FragmentPath)" = "/etc/systemd/system/$unit" ] || echo "unit file $(property FragmentPath)"
    command=$(property ExecStart | sed -n 's/.*argv\[\]=\([^;]*\) ;.*/\1/p')
    [ "$command" = "/usr/local/bin/k3s {{ k3s_role }}" ] || echo "command $command"
    [ -f "/etc/systemd/system/$unit.env" ] && [ ! -s "/etc/systemd/system/$unit.env" ] || echo "environment in /etc/systemd/system/$unit.env"
    [ "$(property NeedDaemonReload)" = no ] || echo "pending daemon reload"
  register: k3s_upstream_service
  changed_when: k3s_upstream_service.stdout != ''
  check_mode: false

- name: Wait for the node to become ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - "-o=jsonpath={.status.conditions[?(@.type=='Ready')].status}"
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  changed_when: false
  check_mode: false
  register: k3s_ready
  until: k3s_ready.rc == 0 and k3s_ready.stdout == 'True'
  retries: 36
  delay: 5
  tags: [worker-labels, capacity]

- name: Wait for the node to publish the cluster flannel backend
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o=jsonpath={.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type}{"\n"}{.metadata.annotations.flannel\.alpha\.coreos\.com/backend-data}
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  changed_when: false
  check_mode: false
  register: k3s_flannel_published
  until: (k3s_flannel_published.stdout_lines | first | default('')) == k3s_flannel_backend_types[k3s_flannel_backend]
  retries: 36
  delay: 5

- name: Derive the public WireGuard key from the persisted flannel key
  ansible.builtin.shell: |
    set -eu
    { printf '\060\056\002\001\000\060\005\006\003\053\145\156\004\042\004\040'; base64 -d < {{ k3s_flannel_key_file | quote }}; } \
      | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64
  changed_when: false
  check_mode: false
  register: k3s_flannel_public_key
  when: k3s_flannel_backend == 'wireguard-native'

- name: Require the node to publish its own WireGuard key
  ansible.builtin.assert:
    that: (k3s_flannel_published.stdout_lines | last | from_json).PublicKey == k3s_flannel_public_key.stdout
    fail_msg: >-
      {{ inventory_hostname }} publishes a WireGuard key that is not its own; cut fredrir-10 off the API first
      (remove tag:platform-volatile's 6443 grant or deauthorize its tailnet node), then an administrator clears the
      flannel backend annotations and restarts {{ k3s_service }}
  when: k3s_flannel_backend == 'wireguard-native'

- name: Read declared worker taints through the administrator API
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - '-o=jsonpath={range .spec.taints[*]}{.key}={.value}:{.effect}{"\n"}{end}'
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  check_mode: false
  retries: 1
  delay: 5
  when: k3s_role == 'agent' and k3s_node_taints | length > 0
  register: k3s_taints
  changed_when: k3s_node_taints | difference(k3s_taints.stdout_lines) | length > 0
  tags: [worker-labels]

- name: Taint the worker through the administrator API
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/k3s', 'kubectl', 'taint', 'node', inventory_hostname] + k3s_node_taints + ['--overwrite', '--request-timeout=10s'] }}"
  delegate_to: "{{ k3s_registration_server }}"
  when: k3s_taints.changed
  tags: [worker-labels]

- name: Assign worker capabilities through the administrator API
  ansible.builtin.command:
    argv: "{{ ['/usr/local/bin/k3s', 'kubectl', 'label', 'node', inventory_hostname] + k3s_node_labels + ['infra.fredrir.com/ci-slots=' ~ k3s_ci_slots, '--overwrite', '--request-timeout=10s', '--dry-run=' ~ ('server' if ansible_check_mode else 'none')] }}"
  delegate_to: "{{ k3s_registration_server }}"
  check_mode: false
  retries: 1
  delay: 5
  when: k3s_role == 'agent'
  register: k3s_labels
  changed_when: "'not labeled' not in k3s_labels.stdout"
  tags: [worker-labels]

- name: Advertise CI job slots through the administrator API
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - patch
      - node
      - "{{ inventory_hostname }}"
      - --subresource=status
      - --type=merge
      - "--patch={{ {'status': {'capacity': {k3s_ci_slot_resource: k3s_ci_slots | string}}} | to_json }}"
      - --request-timeout=10s
      - "--dry-run={{ 'server' if ansible_check_mode else 'none' }}"
  delegate_to: "{{ k3s_registration_server }}"
  check_mode: false
  retries: 1
  delay: 5
  when: k3s_role == 'agent'
  register: k3s_ci_slot_patch
  changed_when: "'(no change)' not in k3s_ci_slot_patch.stdout"
  tags: [worker-labels]

- name: Wait for the kubelet to publish the CI job slots
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - "-o=jsonpath={.status.allocatable.{{ k3s_ci_slot_resource | replace('.', '\\.') }}}"
      - --request-timeout=10s
  delegate_to: "{{ k3s_registration_server }}"
  when: k3s_role == 'agent'
  changed_when: false
  check_mode: false
  register: k3s_ci_slot_allocatable
  until: k3s_ci_slot_allocatable.stdout == (k3s_ci_slots | string)
  retries: 12
  delay: 5
  tags: [worker-labels]
