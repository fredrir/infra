- name: Reload platform systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload platform SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Apply platform sysctls
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart platform Tailscale
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
    daemon_reload: true
  when: platform_existing_k3s.stat.exists

- name: Restart bootstrap Tailscale
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart platform API proxy
  ansible.builtin.systemd_service:
    name: platform-api-proxy
    state: restarted
    daemon_reload: true
  when: platform_existing_k3s.stat.exists

- name: Restart platform firewall
  ansible.builtin.systemd_service:
    name: platform-firewall
    state: restarted
    daemon_reload: true
  when: platform_existing_k3s.stat.exists

- name: Restart platform K3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
    daemon_reload: true
  when: platform_existing_k3s.stat.exists
