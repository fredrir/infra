- name: Install Restic
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ control_backup_packages }}"

- name: Create private backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
  - /etc/platform-backups
  - /var/lib/platform-backups

- name: Install encrypted recovery credentials
  ansible.builtin.import_role:
    name: host_secrets
    tasks_from: install.yml
  vars:
    host_secrets_src: control.sops.yaml
    host_secrets_dest: /etc/platform-backups/control.sops.yaml

- name: Install verified infrastructure binary
  ansible.builtin.include_role:
    name: infra_binary
  tags: [infra_binary]

- name: Create the backup metric directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the bounded recovery service
  ansible.builtin.copy:
    dest: /etc/systemd/system/platform-control-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target k3s.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      LoadCredential=age-key:{{ host_secrets_key }}
      Environment=SOPS_AGE_KEY_FILE=%d/age-key
      Environment=RESTIC_REPOSITORY={{ control_backup_repository }}
      Environment=AWS_DEFAULT_REGION={{ control_backup_region }}
      Environment=RESTIC_CACHE_DIR=/var/lib/platform-backups/cache
      ExecStart=/usr/local/bin/sops exec-env --same-process /etc/platform-backups/control.sops.yaml "exec /usr/local/bin/infra platform control-backup"
      RuntimeMaxSec=1800
      TimeoutStartSec=1800
      TimeoutStopSec=90
      KillMode=mixed
      MemoryMax=512M
      MemorySwapMax=0
      CPUQuota=100%
      TasksMax=128
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/platform-backups /var/lib/node_exporter/textfile_collector
      InaccessiblePaths={{ host_secrets_key | dirname }}
      UMask=0077

- name: Install the recovery timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/platform-control-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      [Timer]
      OnCalendar=*-*-* 00,06,12,18:55:00 UTC
      Persistent=true
      RandomizedDelaySec=300
      [Install]
      WantedBy=timers.target

- name: Configure the recovery schedule
  ansible.builtin.systemd_service:
    name: platform-control-backup.timer
    enabled: "{{ backup_timer_enabled | default(false) }}"
    state: "{{ 'started' if backup_timer_enabled | default(false) else 'stopped' }}"
    daemon_reload: true

- name: Remove plaintext recovery credentials
  ansible.builtin.file:
    path: /etc/platform-backups/control.env
    state: absent
