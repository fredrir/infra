- name: Install nftables
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ firewall_packages }}"

- name: Require the enrolled management interface
  ansible.builtin.command: ip address show dev tailscale0
  changed_when: false
  check_mode: false

- name: Create the firewall configuration directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure host input filtering
  ansible.builtin.template:
    src: platform-host.nft.j2
    dest: /etc/nftables.d/platform-host.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload host firewall

- name: Install the host firewall service
  ansible.builtin.copy:
    dest: /etc/systemd/system/platform-host-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      DefaultDependencies=no
      After=local-fs.target
      Before=network-pre.target k3s.service k3s-agent.service shutdown.target
      Wants=network-pre.target
      Conflicts=shutdown.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/platform-host.nft
      ExecReload=/usr/sbin/nft -f /etc/nftables.d/platform-host.nft

      [Install]
      WantedBy=multi-user.target

- name: Enable host input filtering
  ansible.builtin.systemd_service:
    name: platform-host-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: Apply firewall changes
  ansible.builtin.meta: flush_handlers

- name: Confirm management access
  ansible.builtin.wait_for_connection:
    timeout: 30
  check_mode: false
