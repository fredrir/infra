- name: Require immutable binary identity
  ansible.builtin.assert:
    that:
    - infra_binary_revision is defined
    - infra_binary_revision is match('^[a-f0-9]{40}$')
    - infra_binary_sha256 is defined
    - infra_binary_sha256 is match('^[a-f0-9]{64}$')
    - infra_binary_url is defined
    - infra_binary_url is match('^https://[^ ]+$')
    - ansible_facts.system == 'Linux'
    - ansible_facts.architecture in ['x86_64', 'aarch64']

- name: Select artifact cache directory
  ansible.builtin.set_fact:
    infra_binary_cache: "/var/cache/infra/{{ infra_binary_revision }}/linux-{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}/{{ infra_binary_sha256 }}"

- name: Create root-owned artifact cache
  ansible.builtin.file:
    path: '{{ infra_binary_cache }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download verified compiled binary
  ansible.builtin.get_url:
    url: '{{ infra_binary_url }}'
    dest: '{{ infra_binary_cache }}/infra'
    checksum: 'sha256:{{ infra_binary_sha256 }}'
    owner: root
    group: root
    mode: '0555'
    timeout: 30
  register: infra_binary_download

- name: Check executable compatibility
  ansible.builtin.command:
    argv: ['{{ infra_binary_cache }}/infra', version]
  changed_when: false
  when: infra_binary_download.changed

- name: Activate verified binary
  ansible.builtin.file:
    src: '{{ infra_binary_cache }}/infra'
    dest: /usr/local/bin/infra
    state: link
    owner: root
    group: root
    force: true

- name: Find superseded binary revisions
  ansible.builtin.find:
    paths: /var/cache/infra
    file_type: directory
    patterns: '^[a-f0-9]{40}$'
    use_regex: true
  register: infra_binary_revisions
  when: infra_binary_download.changed

- name: Remove superseded binary revisions
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ infra_binary_revisions.files | default([]) | rejectattr('path', 'equalto', '/var/cache/infra/' ~ infra_binary_revision) | list }}"
  loop_control:
    label: '{{ item.path }}'
  when: infra_binary_download.changed
