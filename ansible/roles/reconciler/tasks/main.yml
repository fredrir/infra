- name: Install reconciler packages
  ansible.builtin.import_role:
    name: host_packages
  vars:
    host_packages_required: "{{ reconciler_packages }}"

- name: Install the verified infrastructure binary
  ansible.builtin.import_role:
    name: infra_binary
  vars:
    infra_binary_url: "https://github.com/fredrir/infra/releases/download/{{ reconciler_cli.tag }}/infra-linux-amd64"
    infra_binary_revision: "{{ reconciler_cli.revision }}"
    infra_binary_sha256: "{{ reconciler_cli.sha256 }}"
  tags: [infra_binary]

- name: Create the reconciliation group
  ansible.builtin.group:
    name: infra-reconcile
    system: true

- name: Create the verification user
  ansible.builtin.user:
    name: infra-verify
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/infra-verify
    create_home: false
    password: "!"
    groups: [infra-reconcile]
    append: false

- name: Create the apply user
  ansible.builtin.user:
    name: infra-apply
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/infra-apply
    create_home: false
    password: "!"
    groups: [infra-reconcile]
    append: false

- name: Create the shared reconciliation directories
  ansible.builtin.file:
    path: "{{ reconciler_shared }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: infra-reconcile
    mode: "{{ item.mode }}"
  loop:
    - {path: "", owner: root, mode: "0750"}
    - {path: repairs, owner: infra-verify, mode: "2750"}
    - {path: requests, owner: root, mode: "2750"}
  loop_control:
    label: "{{ item.path }}"

- name: Create the reconciler host lock
  ansible.builtin.file:
    path: "{{ reconciler_shared }}/lock"
    state: touch
    owner: root
    group: infra-reconcile
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Create the reconciler configuration directory
  ansible.builtin.file:
    path: /etc/infra-reconcile
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [ssh_identity]

- name: Create the private SSH identity directory
  ansible.builtin.file:
    path: "{{ reconciler_ssh_identity | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [ssh_identity]

- name: Generate the reconciler SSH identity
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "infra-reconciler@{{ inventory_hostname }}", -f, "{{ reconciler_ssh_identity }}"]
    creates: "{{ reconciler_ssh_identity }}"
  tags: [ssh_identity]

- name: Restrict the reconciler SSH identity
  ansible.builtin.file:
    path: "{{ reconciler_ssh_identity }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode
  tags: [ssh_identity]

- name: Read the reconciler SSH public key
  ansible.builtin.command:
    argv: [ssh-keygen, -y, -f, "{{ reconciler_ssh_identity }}"]
  register: reconciler_ssh_public_key
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [ssh_identity]

- name: Report the reconciler SSH public key
  ansible.builtin.assert:
    that: reconciler_ssh_public_key.stdout is match('^ssh-ed25519 [A-Za-z0-9+/=]+( .*)?$')
    success_msg: "{{ inventory_hostname }} {{ reconciler_ssh_public_key.stdout }}"
  when: not ansible_check_mode
  tags: [ssh_identity]

- name: Install the encrypted reconciler credentials
  ansible.builtin.import_role:
    name: host_secrets
    tasks_from: install.yml
  vars:
    host_secrets_src: credentials.sops.yaml
    host_secrets_dest: /etc/infra-reconcile/credentials.sops.yaml
  tags: [reconciler_credentials]

- name: Require every verification credential
  ansible.builtin.command:
    argv: [/usr/local/bin/sops, decrypt, --extract, '["verify"]["{{ item }}"]', --output, /dev/null, /etc/infra-reconcile/credentials.sops.yaml]
  environment:
    SOPS_AGE_KEY_FILE: "{{ host_secrets_key }}"
  loop: "{{ reconciler_verify_credentials }}"
  changed_when: false
  check_mode: false
  tags: [reconciler_credentials]

- name: Require every apply credential
  ansible.builtin.command:
    argv: [/usr/local/bin/sops, decrypt, --extract, '["apply"]["{{ item }}"]', --output, /dev/null, /etc/infra-reconcile/credentials.sops.yaml]
  environment:
    SOPS_AGE_KEY_FILE: "{{ host_secrets_key }}"
  loop: "{{ reconciler_apply_credentials }}"
  changed_when: false
  check_mode: false
  tags: [reconciler_credentials]

- name: Require the runner App installation
  ansible.builtin.assert:
    that:
      - reconciler_apply.runner.installation_id is integer
      - reconciler_apply.runner.installation_id > 0
    fail_msg: Set reconciler_apply.runner.installation_id to the runner App's installation ID

- name: Require verified host keys
  ansible.builtin.assert:
    that:
      - reconciler_known_hosts_content is not search('PLACEHOLDER')
      - reconciler_known_hosts_content is search('(?m)^[^#\\s]\\S* (ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) \\S+')
    fail_msg: ansible/files/reconciliation_known_hosts must list the verified host keys
  vars:
    reconciler_known_hosts_content: "{{ lookup('ansible.builtin.file', reconciler_known_hosts_file) }}"

- name: Install the verified host keys
  ansible.builtin.copy:
    src: "{{ reconciler_known_hosts_file }}"
    dest: "{{ reconciler_known_hosts }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the cluster certificate authority
  ansible.builtin.copy:
    src: "{{ reconciler_kubernetes_ca_file }}"
    dest: /etc/infra-reconcile/kubernetes-ca.crt
    owner: root
    group: root
    mode: "0644"

- name: Install the verification configuration
  ansible.builtin.copy:
    content: "{{ reconciler_verify | to_nice_json }}\n"
    dest: /etc/infra-reconcile/verify.json
    owner: root
    group: root
    mode: "0644"

- name: Install the apply configuration
  ansible.builtin.copy:
    content: "{{ reconciler_apply | to_nice_json }}\n"
    dest: /etc/infra-reconcile/apply.json
    owner: root
    group: root
    mode: "0644"

- name: Create the journal configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bound the local journal
  ansible.builtin.copy:
    content: |
      [Journal]
      SystemMaxUse=2G
      SystemKeepFree=4G
      MaxRetentionSec=1month
    dest: /etc/systemd/journald.conf.d/infra-reconcile.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the journal

- name: Install the verification units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [infra-reconcile-verify.service, infra-reconcile-verify.timer]
  notify: Restart the verification timer

- name: Schedule verification
  ansible.builtin.systemd_service:
    name: infra-reconcile-verify.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Install the apply units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [infra-reconcile-apply.service, infra-reconcile-apply.timer]
  notify: Restart the apply timer

- name: Schedule reconciliation
  ansible.builtin.systemd_service:
    name: infra-reconcile-apply.timer
    state: started
    enabled: true
    daemon_reload: true
