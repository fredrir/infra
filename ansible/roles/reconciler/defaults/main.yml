reconciler_cli: "{{ lookup('ansible.builtin.file', playbook_dir + '/../build/cli-release.json') | from_json }}"
reconciler_kubernetes_ca_file: kubernetes-ca.crt
reconciler_ssh_identity: /etc/infra-reconcile/ssh/id_ed25519
reconciler_shared: /var/lib/infra-reconcile
reconciler_known_hosts: /etc/infra-reconcile/known_hosts
reconciler_known_hosts_file: "{{ playbook_dir }}/files/reconciliation_known_hosts"
reconciler_packages: [ca-certificates, git, golang-go, openssh-client, python3]
reconciler_verify_credentials:
  - aws-access-key-id
  - aws-secret-access-key
  - cloudflare-api-token
  - hcloud-token
  - platform-mail-recipient
  - kubernetes-token
  - observer-app-key
  - gatus-token
reconciler_verify_schedule: hourly
reconciler_verify_randomized_delay: 5min
reconciler_verify:
  repository: https://github.com/fredrir/infra.git
  state: /var/lib/infra-verify
  cache: /var/cache/infra-verify
  shared: "{{ reconciler_shared }}"
  bucket: llunde-pyparser-bucket
  prefix: reconciliation/production
  region: eu-north-1
  gatus: "http://{{ hostvars['fredrir-06'].tailscale_ip }}:8080"
  heartbeat: reconciliation_verification
  scope: full
  known_hosts: "{{ reconciler_known_hosts }}"
  kubernetes:
    server: "https://{{ hostvars[groups['server'][0]].tailscale_ip }}:6443"
    certificate_authority: /etc/infra-reconcile/kubernetes-ca.crt
  observer:
    app_id: 5080610
    installation_id: 164992211
    api: https://api.github.com
reconciler_apply_credentials:
  - aws-access-key-id
  - aws-secret-access-key
  - cloudflare-api-token
  - hcloud-token
  - platform-mail-recipient
  - kubernetes-token
  - runner-app-key
  - publisher-app-key
  - provenance-token
  - gatus-token
reconciler_apply_schedule: "*:*:0/30"
reconciler_apply:
  repository: https://github.com/fredrir/infra.git
  state: /var/lib/infra-apply
  cache: /var/cache/infra-apply
  shared: "{{ reconciler_shared }}"
  bucket: llunde-pyparser-bucket
  prefix: reconciliation/production
  region: eu-north-1
  gatus: "http://{{ hostvars['fredrir-06'].tailscale_ip }}:8080"
  heartbeat: reconciliation_apply
  known_hosts: "{{ reconciler_known_hosts }}"
  kubernetes:
    server: "https://{{ hostvars[groups['server'][0]].tailscale_ip }}:6443"
    certificate_authority: /etc/infra-reconcile/kubernetes-ca.crt
  runner:
    app_id: 4924976
    installation_id: 161243498
    api: https://api.github.com
